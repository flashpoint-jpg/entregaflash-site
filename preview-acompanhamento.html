  :root{

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--noite);color:var(--osso);font-family:&#x27;Karla&#x27;,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;}
  body{min-height:100vh;}

  /* ---- sensação de app nativo: toque, gestos e feedback (não muda nada visual do layout) ---- */
  /* obs: .cartao fica de fora de propósito — é usado também pra listas de dados do admin (telefone,

  button,.btn,.btn-primario,.btn-secundario,.btn-verde,.btn-azul,.btn-chama,.pedido,
  .abas-motorista button,.aba-mini button,.toggle-modo button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
  button,.btn,.pedido,.abas-motorista button,.aba-mini button,.toggle-modo button{transition:transform 0.12s ease;}
  button:active,.btn:active,[onclick]:active{transform:scale(0.97);}

  /* transição suave ao trocar de tela (login, cadastro, abas do motorista, pedidos↔histórico↔perfil etc.) */
  @keyframes ef-tela-entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .ef-tela-entrando{animation:ef-tela-entrar 0.22s ease both;}

  /* esqueleto de carregamento, no lugar do texto &quot;A carregar...&quot; pelado */
  .ef-skeleton{background:linear-gradient(90deg, var(--painel-alt) 25%, rgba(255,255,255,0.10) 37%, var(--painel-alt) 63%);background-size:400% 100%;animation:ef-skeleton-brilho 1.4s ease infinite;border-radius:18px;}

  .bv-escolha-col.selecionada{border-color:rgba(255,201,60,0.6);background:rgba(255,201,60,0.08);}
  .bv-escolha-marcador{position:absolute;top:8px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}

  @keyframes bv-prep-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  .bv-prep-titulo{font-family:&#x27;Rajdhani&#x27;;font-weight:700;font-size:24px;color:#fff;margin-bottom:8px;}

  /* ---------- splash de abertura (premium) ---------- */
  #splash{
    position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 12% -8%, rgba(255,151,16,0.25), transparent 45%),
      linear-gradient(165deg, #0a0b0d 0%, #121317 45%, #16181d 78%, #1c1e24 100%);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #splash.splash-esconder{opacity:0;visibility:hidden;pointer-events:none;}

  /* partículas douradas de fundo */
  .splash-particulas{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .splash-particulas span{position:absolute;bottom:-10%;width:4px;height:4px;border-radius:50%;background:rgba(255,193,7,0.75);box-shadow:0 0 8px rgba(255,193,7,0.9);animation:splash-flutuar 5.5s ease-in infinite;}
  .splash-particulas span:nth-child(1){left:8%;animation-delay:.2s;width:3px;height:3px;}
  .splash-particulas span:nth-child(2){left:20%;animation-delay:1.4s;}
  .splash-particulas span:nth-child(3){left:34%;animation-delay:.8s;width:5px;height:5px;}
  .splash-particulas span:nth-child(4){left:50%;animation-delay:2.2s;width:3px;height:3px;}
  .splash-particulas span:nth-child(5){left:64%;animation-delay:.5s;}
  .splash-particulas span:nth-child(6){left:78%;animation-delay:1.9s;width:4px;height:4px;}
  .splash-particulas span:nth-child(7){left:90%;animation-delay:1.1s;width:3px;height:3px;}
  .splash-particulas span:nth-child(8){left:44%;animation-delay:2.8s;width:5px;height:5px;}
  @keyframes splash-flutuar{0%{transform:translateY(0) scale(0);opacity:0;}10%{opacity:1;transform:scale(1);}90%{opacity:.8;}100%{transform:translateY(-110vh) scale(0.4);opacity:0;}}

  /* anel de luz pulsante atrás da logo */
  .splash-auréola{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle, rgba(255,193,7,0.35) 0%, rgba(255,193,7,0) 70%);animation:splash-auréola-pulso 2.6s ease-in-out infinite;}
  @keyframes splash-auréola-pulso{0%,100%{transform:scale(0.85);opacity:.6;}50%{transform:scale(1.15);opacity:1;}}

  .splash-logo-badge{position:relative;background:linear-gradient(155deg,#123089 0%,#0d2c6e 55%,#0a2258 100%);border-radius:20px;padding:16px 22px;overflow:hidden;border:1px solid rgba(255,193,7,0.35);box-shadow:0 10px 30px rgba(0,0,0,0.35);}
  .splash-logo-badge img{width:220px;height:auto;display:block;position:relative;z-index:1;filter:drop-shadow(0 2px 10px rgba(255,193,7,0.25));}
  .splash-logo-duas-fases{display:grid;place-items:center;}
  .splash-logo-duas-fases img{grid-area:1/1;}
  .splash-emblema{width:96px!important;opacity:0;transform:scale(.6);animation:splash-emblema-surge .55s cubic-bezier(.34,1.56,.64,1) .15s forwards, splash-emblema-sai .35s ease .95s forwards;}
  .splash-logo-completo{opacity:0;transform:scale(.94);animation:splash-logo-surge .6s ease 1.05s forwards;}
  @keyframes splash-emblema-surge{0%{opacity:0;transform:scale(.6);}100%{opacity:1;transform:scale(1);}}
  @keyframes splash-emblema-sai{0%{opacity:1;}100%{opacity:0;}}
  @keyframes splash-logo-surge{0%{opacity:0;transform:scale(.94);}100%{opacity:1;transform:scale(1);}}
  .splash-sem-anim .splash-emblema,.splash-sem-anim .splash-logo-completo{animation:none!important;opacity:0!important;}
  .splash-sem-anim .splash-logo-completo{opacity:1!important;transform:scale(1)!important;}
  /* efeito de brilho &quot;shine&quot; que varre a logo */
  .splash-logo-badge::after{
    content:&quot;&quot;;position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
