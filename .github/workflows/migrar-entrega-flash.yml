name: Migrar Entrega Flash para Supabase novo

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite MIGRAR para iniciar a cópia"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migracao-entrega-flash
  cancel-in-progress: false

jobs:
  migrar:
    if: ${{ github.event.inputs.confirmacao == 'MIGRAR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OLD_SUPABASE_URL: ${{ secrets.ENTREGA_OLD_SUPABASE_URL }}
      OLD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ENTREGA_OLD_SERVICE_ROLE_KEY }}
      NEW_SUPABASE_URL: ${{ secrets.ENTREGA_NEW_SUPABASE_URL }}
      NEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ENTREGA_NEW_SERVICE_ROLE_KEY }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar os quatro segredos
        shell: bash
        run: |
          set -euo pipefail
          vars=(
            OLD_SUPABASE_URL OLD_SUPABASE_SERVICE_ROLE_KEY
            NEW_SUPABASE_URL NEW_SUPABASE_SERVICE_ROLE_KEY
          )
          for v in "${vars[@]}"; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Segredo ausente: $v"
              exit 1
            fi
          done

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar cliente Supabase
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save @supabase/supabase-js@2

      - name: Migrar dados do Entrega Flash
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrar-dados-entrega-flash.mjs

      - name: Copiar somente Storage do Entrega Flash
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrar-storage-entrega-flash.mjs

      - name: Final
        shell: bash
        run: |
          echo "Migração de dados e Storage concluída."
          echo "O workflow NÃO troca o site para o banco novo automaticamente."
