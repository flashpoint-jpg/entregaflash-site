# build-ready: popup-formatado-1609
name: Build Entrega Flash Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-build/source.b64.part*'
      - '.github/workflows/build-android-native.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android source archive
        run: |
          cat android-build/source.b64.part* | tr -d '\n' | base64 -d > android-build/android-native-source-rebuilt.zip
          unzip -t android-build/android-native-source-rebuilt.zip
          unzip -q android-build/android-native-source-rebuilt.zip

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release unsigned
        run: gradle -p gh_android assembleRelease

      - name: Collect signing tools
        run: |
          mkdir -p android-build/tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" android-build/tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" android-build/tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android-build/tools/lib/

      - name: Upload APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Entrega-Flash-BUILD
          path: |
            gh_android/app/build/outputs/apk/release/app-release-unsigned.apk
            android-build/tools/
          if-no-files-found: error
