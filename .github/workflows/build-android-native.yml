name: Build Entrega Flash Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-build/android-native-source.zip'
      - '.github/workflows/build-android-native.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android source
        run: unzip -q android-build/android-native-source.zip

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release unsigned
        run: gradle -p gh_android assembleRelease

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Entrega-Flash-UNSIGNED
          path: gh_android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
