<style id="ef-mobile-scroll-fix-v4">
/* Correção crítica de rolagem mobile: mantém toque rápido sem travar a página */
@media (max-width:700px){
  html{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;overscroll-behavior-y:auto!important;}
  body{position:static!important;height:auto!important;min-height:100vh!important;min-height:100dvh!important;max-height:none!important;overflow-x:hidden!important;overflow-y:auto!important;overscroll-behavior-y:auto!important;touch-action:pan-y pinch-zoom!important;-webkit-overflow-scrolling:touch!important;}
  #app,main,#conteudo,.conteudo,.pagina,.tela{height:auto!important;max-height:none!important;overflow:visible!important;touch-action:pan-y!important;}
  #app{min-height:100dvh!important;}
  .bv-wrap,.bv-section-real,.bv-hero-real{height:auto!important;max-height:none!important;overflow:visible!important;}
  .modal-fundo,.foto-fundo,#ef-face-modal,#ef-selfie-motorista{touch-action:pan-y!important;}
}

/* ===== Entrega Flash Admin Ultra Clean ===== */
body.ef-admin-logado .admin-topo{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px)}
.admin-card,.cartao{border-radius:18px}
.admin-lista-secao{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);margin-bottom:10px}
.chat-modal{backdrop-filter:blur(18px);box-shadow:0 22px 70px rgba(0,0,0,.48);border-radius:22px 22px 0 0;overflow:hidden}
.chat-topo{position:sticky;top:0;z-index:2;padding:16px 18px;background:rgba(22,31,80,.98)}
.chat-fechar{width:42px!important;height:42px!important;min-width:42px;border-radius:12px!important;font-size:30px!important;display:grid!important;place-items:center;line-height:1!important}
#suporte-admin-input{min-height:48px;border-radius:14px!important}
@media(max-width:700px){
  .admin-topo{padding:12px 14px!important}
  .admin-topo h1{font-size:20px!important}
  .chat-modal{height:min(76dvh,680px)!important;max-height:76dvh!important}
  .chat-mensagens{overscroll-behavior:contain}
  .admin-lista-secao{margin-left:2px;margin-right:2px}
}
</style>
