<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1266cb"><title>Documentação | Entrega Flash Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#17283f;font:15px system-ui,Arial,sans-serif}
header{background:#1266cb;color:white;padding:18px 20px;display:flex;justify-content:space-between;gap:8px;align-items:center}
header b{font-size:18px}header a{color:white}main{max-width:1050px;margin:auto;padding:20px}
h1{font-size:26px;margin:10px 0}h2{font-size:17px;margin:0 0 8px}p{color:#5e7288;line-height:1.5}
.box,.person{padding:18px;border-radius:14px;border:1px solid #d9e6f5;background:white;margin:12px 0}
input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #b9cce3}
input{width:100%;max-width:420px}button{background:#1266cb;border:0;color:#fff;font-weight:700;cursor:pointer}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls input{flex:1}
.badge{font-size:12px;font-weight:700;background:#fff0d6;color:#7b4f00;padding:5px 9px;border-radius:20px}
.docs{display:flex;gap:8px;flex-wrap:wrap}.docs a,.missing{font-size:13px;padding:9px 11px;border-radius:8px;border:1px solid #ccdcee}
.docs a{color:#135bb0;text-decoration:none;background:#f7fbff}.missing{color:#99512b;background:#fff7f2}
#err{color:#ae3030}small{color:#65788b}button:disabled{opacity:.5}
</style></head><body>
<header><b>ENTREGA FLASH · Documentos</b><a href="/admin/">Voltar ao painel</a></header>
<main><h1>Documentação dos motoristas</h1><p>Documentos do banco atual do Entrega Flash, sem modificar os cadastros.</p>
<div class="box" id="gate"><h2>Área administrativa</h2><form id="auth"><input id="senha" type="password" autocomplete="current-password" placeholder="Senha administrativa" required><button type="submit">Entrar</button></form><p id="err"></p></div>
<div id="app" hidden><div class="box"><div class="controls"><input id="search" placeholder="Buscar por nome ou cidade"><select id="status"><option value="pendente">Aguardando aprovação</option><option value="basico">Documentos parciais</option><option value="reprovado">Reprovados</option><option value="todos">Todos</option></select><button id="refresh">Atualizar</button></div><p id="summary"></p></div><div id="people"></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
const db=window.supabase&&window.supabase.createClient('https://urtpjcndtcleeorpnpct.supabase.co','sb_publishable_bhe5zL6CgvGrXBXeckK-Fg_zupiWu7A',{auth:{persistSession:false}});
const $=id=>document.getElementById(id);
let password='',drivers=[];
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const docs=[['foto_motorista_url','Selfie'],['cnh_url','CNH'],['crlv_url','CRLV'],['foto_veiculo_url','Veículo frente'],['foto_veiculo_tras_url','Veículo traseira']];
const secureLink=u=>{try{let x=new URL(u);return x.protocol==='https:'&&/^[a-z0-9-]+\.supabase\.co$/.test(x.hostname)&&x.pathname.includes('/storage/v1/object/public/motorista-documentos/')?x.href:null}catch(e){return null}};
const show=()=>{let txt=$('search').value.toLowerCase().trim(),stat=$('status').value;
let subset=drivers.filter(m=>(stat==='todos'||(stat==='basico'?['basico','liberado'].includes(m.status):m.status===stat))&&(!txt||[m.nome,m.cidade,m.telefone].some(v=>String(v||'').toLowerCase().includes(txt))));
$('summary').textContent=drivers.filter(x=>x.status==='pendente').length+' aguardando aprovação · '+drivers.filter(x=>['basico','liberado'].includes(x.status)).length+' com documentação parcial · '+drivers.filter(x=>x.status==='reprovado').length+' reprovado(s).';
$('people').innerHTML=subset.length?subset.map(m=>{const fields=m.veiculo_tipo==='bicicleta'?docs.filter(d=>!['cnh_url','crlv_url'].includes(d[0])):docs;return '<article class="person"><h2>'+esc(m.nome)+' <span class="badge">'+esc(m.status)+'</span></h2><p>'+esc(m.cidade)+' · '+esc(m.veiculo_tipo)+' · '+esc(m.telefone)+'</p><div class="docs">'+fields.map(d=>{const u=secureLink(m[d[0]]);return u?'<a target="_blank" rel="noopener noreferrer" href="'+esc(u)+'">'+esc(d[1])+' ↗</a>':'<span class="missing">'+esc(d[1])+' ausente</span>'}).join('')+'</div><p><small>Enviado em: '+(m.documentos_enviados_em?new Date(Number(m.documentos_enviados_em)).toLocaleString('pt-BR'):'não informado')+'</small></p></article>'}).join(''):'<div class="box">Nenhum cadastro nesse filtro.</div>';};
async function refresh(){if(!db||!password)return;$('summary').textContent='Carregando...';const r=await db.rpc('entrega_admin_listar_documentos_pendentes',{p_senha:password});if(r.error){$('summary').textContent='Falha na consulta: '+r.error.message;return;}drivers=Array.isArray(r.data)?r.data:[];show();}
async function login(e){e?.preventDefault();if(!db){$('err').textContent='Biblioteca de conexão indisponível. Atualize a página.';return;}
const val=$('senha').value||sessionStorage.getItem('ef_admin_senha')||'';if(!val)return;
const r=await db.rpc('entrega_verificar_senha_admin',{p_senha:val});
if(r.error||r.data!==true){$('err').textContent='Senha inválida ou banco indisponível.';return;}
password=val;sessionStorage.setItem('ef_admin_senha',val);$('senha').value='';$('gate').hidden=true;$('app').hidden=false;await refresh();}
$('auth').addEventListener('submit',login);$('refresh').addEventListener('click',refresh);$('status').addEventListener('change',show);$('search').addEventListener('input',show);
const saved=sessionStorage.getItem('ef_admin_senha');if(saved){$('senha').value=saved;login();}
})();
</script></body></html>
