}
function entregasSimultaneasAtivas(telefone){
  return estado.pedidos.filter(p=>p.motoristaTelefone===telefone && ['indo_coletar','coletado','a_caminho'].includes(p.status)).length;
}
// vibração curtinha em ações importantes (aceitar pedido, confirmar entrega) — silenciosa se o aparelho não suportar
function vibrarLeve(padrao){ try{ if(navigator.vibrate) navigator.vibrate(padrao||30); }catch(e){} }
async function aceitarPedido(id){
  if(estado.motorista.visitante){ mostrarToast(' Isso aqui é só uma demonstração. Cadastre-se para aceitar corridas de verdade!', 'info'); sairDoModoVisitante(); return; }
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  if(estado.motorista.status!=='aprovado'){
    mostrarToast('Ainda falta enviar os documentos e ser aprovado pelo administrador para poderes aceitar corridas.');
    return;
  }
  const plano = PLANOS[estado.motorista.plano] || PLANOS.free;
  if(plano.limiteMensal!=null && entregasDoMesAtual(estado.motorista.telefone)>=plano.limiteMensal){
    mostrarToast(`Limite do plano ${plano.label} (${plano.limiteMensal} entregas/mês) atingido.${plano===PLANOS.free?' Passa para o Pro para entregas ilimitadas.':''}`);
    return;
  }
  if(entregasSimultaneasAtivas(estado.motorista.telefone)>=plano.limiteSimultaneo){
    mostrarToast(`No plano ${plano.label} você pode ter até ${plano.limiteSimultaneo} entregas em andamento ao mesmo tempo. Finaliza uma para aceitar outra.`);
    return;
  }
  const mo = estado.motorista;
  // ---- acréscimo noturno/feriado/chuva: só se aplica a motoristas Pro, e só quando alguma condição está ativa agora ----
  const motivosAcrescimo = (plano===PLANOS.pro) ? motivosAcrescimoAtivos() : [];
  let acrescimoValor = 0;
  if(motivosAcrescimo.length>0){
    acrescimoValor = Math.round(p.preco * ACRESCIMO_NOTURNO_PCT * 100)/100;
    // debita o acréscimo do saldo do cliente; se não tiver saldo suficiente, simplesmente não aplica o acréscimo desta vez
    try{
      const { data:dadosDebito, error:erroDebito } = await sb.rpc('entrega_ajustar_saldo_cliente_pedido', { p_telefone: p.clienteTelefone, p_delta: -acrescimoValor });
      if(erroDebito){ acrescimoValor = 0; }
    }catch(e){ console.error(e); acrescimoValor = 0; }
  }
  // .eq('status','buscando') garante que a aceitação só vale se NINGUÉM pegou o pedido antes —
  // se dois motoristas tocarem "aceitar" ao mesmo tempo, só o primeiro consegue: o banco resolve
  // isso sozinho, sem risco de dois motoristas ficarem com o mesmo pedido.
  const { data, error } = await sb.from('entrega_pedidos').update({
    status:'indo_coletar', motorista_nome: mo.nome, motorista_telefone: mo.telefone, atualizado_em: Date.now(),
    motorista_foto_url: mo.fotoMotoristaUrl||null, motorista_veiculo_tipo: mo.veiculo||null,
    motorista_marca: mo.marca||null, motorista_cor: mo.cor||null, motorista_placa: mo.placa||null,
    motorista_nota_media: mo.notaMedia!=null?mo.notaMedia:5, motorista_total_avaliacoes: mo.totalAvaliacoes||0,
    iniciado_em: null, aceito_em: Date.now(),
    acrescimo_valor: acrescimoValor, acrescimo_motivos: JSON.stringify(motivosAcrescimo.map(m=>m.label)),
    preco: p.preco + acrescimoValor
  }).eq('id', id).eq('status','buscando').select('id');
  if(error){ console.error(error); mostrarToast('Erro ao aceitar o pedido.', 'erro'); return; }
  if(!data || data.length===0){
    // ninguém ficou com o pedido: se já tinha debitado o acréscimo do cliente, estorna
    if(acrescimoValor>0){ try{ await sb.rpc('entrega_ajustar_saldo_cliente_pedido', { p_telefone: p.clienteTelefone, p_delta: acrescimoValor }); }catch(e){ console.error(e); } }
    mostrarErro('Esse pedido acabou de ser aceito por outro motorista. Escolhe outro da lista.');
    estado.ultimoPedidosJSON=''; await carregarPedidos();
    return;
  }
  estado.ultimoPedidosJSON='';
  vibrarLeve(30);
  registrarAlertaAdmin('pedido_aceito', `${mo.nome||'Um motorista'} (${mo.telefone||''}) aceitou o pedido de ${p.clienteNome||'?'}.${acrescimoValor>0?` Acréscimo de R$ ${acrescimoValor.toFixed(2)} aplicado (${motivosAcrescimo.map(m=>m.label).join(', ')}).`:''}`, id);
  enviarPushServidor('cliente', p.clienteTelefone, 'Entregador encontrado!', `${mo.nome||'Um entregador'} vai levar o seu pedido.`);
  if(acrescimoValor>0) enviarPushServidor('cliente', p.clienteTelefone, 'Acréscimo aplicado', `Sua corrida caiu em ${motivosAcrescimo.map(m=>m.label).join(', ')}: foi cobrado um acréscimo de R$ ${acrescimoValor.toFixed(2)}.`);
  mostrarToast(acrescimoValor>0 ? `Pedido aceito! Acréscimo Pro de R$ ${acrescimoValor.toFixed(2)} aplicado (${motivosAcrescimo.map(m=>m.label).join(', ')}).` : 'Pedido aceito! Toque em "Iniciar corrida" quando estiver pronto para seguir até a coleta.', 'sucesso');
  await carregarPedidos();
}

// ---------- cancelamento pelo motorista (com limite diário por plano) ----------
async function cancelarPedidoMotorista(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p || p.motoristaTelefone!==estado.motorista.telefone) return;
  if(!['indo_coletar','coletado','a_caminho'].includes(p.status)) return;
  const plano = PLANOS[estado.motorista.plano] || PLANOS.free;
  await carregarCancelamentosMotorista();
  const usados = estado.motorista.cancelamentosHoje||0;
  if(usados>=plano.limiteCancelamentosDia){
    mostrarToast(`Limite de cancelamentos do dia atingido (${usados}/${plano.limiteCancelamentosDia} no plano ${plano.label}). Não é possível cancelar mais entregas hoje.`);
    return;
  }
  if(!(await confirmarAcao(`Cancelar esta entrega? Ela volta para a lista de pedidos disponíveis. Restam ${plano.limiteCancelamentosDia-usados-1} cancelamentos hoje (plano ${plano.label}).`))) return;
  const agora = Date.now();
  const { error } = await sb.from('entrega_pedidos').update({
    status:'buscando', motorista_nome:null, motorista_telefone:null, motorista_foto_url:null,
    motorista_veiculo_tipo:null, motorista_marca:null, motorista_cor:null, motorista_placa:null,
    motorista_nota_media:null, motorista_total_avaliacoes:null, motorista_lat:null, motorista_lng:null,
    iniciado_em:null, cancelado_por:'motorista', atualizado_em: agora
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao cancelar.', 'erro'); return; }
  const { error: erroLog } = await sb.from('entrega_cancelamentos_motorista').insert({
    motorista_telefone: estado.motorista.telefone, pedido_id: id, criado_em: agora
  });
  if(erroLog) console.error(erroLog);
  registrarAlertaAdmin('pedido_cancelado_motorista', `${estado.motorista.nome||'Um motorista'} (${estado.motorista.telefone||''}) cancelou a entrega de ${p.clienteNome||'?'}.`, id);
  if(p.clienteTelefone) enviarPushServidor('cliente', p.clienteTelefone, 'Entrega Flash', 'O motorista cancelou a corrida. Estamos a buscar outro entregador perto de ti.');
  const aindaAtivos = estado.pedidos.some(x=>x.id!==id && x.motoristaTelefone===estado.motorista.telefone && x.iniciadoEm && ['indo_coletar','coletado','a_caminho'].includes(x.status));
  if(!aindaAtivos) pararRastreioMotorista();
  mostrarToast('Entrega cancelada e devolvida à lista de pedidos disponíveis.', 'sucesso');
  estado.ultimoPedidosJSON='';
  await carregarCancelamentosMotorista();
  await carregarPedidos();
}

async function avancarStatus(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const i = ESTAGIOS.indexOf(p.status);
  if(i < ESTAGIOS.length-1){
    const novoStatus = ESTAGIOS[i+1];
    const agora = Date.now();
    // ---- taxa de espera: se demorou mais que a tolerância desde que o motorista chegou no local, cobra o excedente ----
    let taxaEspera = 0, campoTaxaEspera = null;
    const chegadaRelevante = novoStatus==='coletado' ? p.chegadaColetaEm : (novoStatus==='entregue' ? p.chegadaEntregaEm : null);
    if(chegadaRelevante){
      const minutosEspera = Math.floor((agora - chegadaRelevante)/60000);
      if(minutosEspera > TAXA_ESPERA_TOLERANCIA_MIN){
        taxaEspera = Math.round((minutosEspera - TAXA_ESPERA_TOLERANCIA_MIN) * TAXA_ESPERA_VALOR_MIN * 100)/100;
        campoTaxaEspera = novoStatus==='coletado' ? 'taxa_espera_coleta' : 'taxa_espera_entrega';
      }
    }
    const payloadAvanco = { status: novoStatus, atualizado_em: agora };
    if(campoTaxaEspera) payloadAvanco[campoTaxaEspera] = taxaEspera;
    const { error } = await sb.from('entrega_pedidos').update(payloadAvanco).eq('id', id);
    if(error){ console.error(error); mostrarToast('Erro ao atualizar o pedido.', 'erro'); return; }
    estado.ultimoPedidosJSON='';
    if(taxaEspera>0){
      // debita do cliente e credita 100% ao motorista, como compensação pelo tempo de espera
      try{ await sb.rpc('entrega_ajustar_saldo_cliente_pedido', { p_telefone: p.clienteTelefone, p_delta: -taxaEspera }); }catch(e){ console.error(e); }
      const creditoEspera = await creditarSaldoMotorista(p.motoristaTelefone, taxaEspera);
      registrarAlertaAdmin('taxa_espera_aplicada', `Taxa de espera de R$ ${taxaEspera.toFixed(2)} aplicada no pedido de ${p.clienteNome||'?'} (${novoStatus==='coletado'?'espera na coleta':'espera na entrega'}).`, id);
      if(p.clienteTelefone) enviarPushServidor('cliente', p.clienteTelefone, 'Taxa de espera cobrada', `O entregador esperou mais que o tolerado ${novoStatus==='coletado'?'na coleta':'na entrega'}. Foi cobrado R$ ${taxaEspera.toFixed(2)} do seu saldo.`);
      mostrarToast(`Taxa de espera de R$ ${taxaEspera.toFixed(2)} cobrada do cliente e creditada a você.${creditoEspera.ok?'':' (erro ao creditar, avisa o suporte)'}`, 'sucesso');
    }
    if(novoStatus==='entregue'){
      vibrarLeve([40,30,40]);
      registrarAlertaAdmin('pedido_entregue', `Pedido de ${p.clienteNome||'?'} entregue por ${p.motoristaNome||'?'} (${p.motoristaTelefone||''}) · R$ ${Number(p.preco||0).toFixed(2)}.`, id);
      const aindaAtivos = estado.pedidos.some(x=>x.id!==id && x.motoristaTelefone===p.motoristaTelefone && x.iniciadoEm && ['indo_coletar','coletado','a_caminho'].includes(x.status));
      if(!aindaAtivos) pararRastreioMotorista();
      const ganhoTotal = ganhoMotorista(p.preco,p);
      if(p.motoristaAmigoSolicitante && p.motoristaAmigoPercentual!=null){
        // entrega assumida via "motorista amigo" — divide entre quem pediu ajuda e quem ajudou
        const valorSolicitante = Math.round(ganhoTotal * (p.motoristaAmigoPercentual/100) * 100)/100;
        const valorAjudante = Math.round((ganhoTotal - valorSolicitante)*100)/100;
        const [creditoSolicitante, creditoAjudante] = await Promise.all([
          creditarSaldoMotorista(p.motoristaAmigoSolicitante, valorSolicitante),
          creditarSaldoMotorista(p.motoristaTelefone, valorAjudante)
        ]);
        if(creditoSolicitante.ok && creditoAjudante.ok){
          mostrarToast(`Entrega concluída! Tu ficaste com R$ ${valorAjudante.toFixed(2)} e R$ ${valorSolicitante.toFixed(2)} foi creditado a quem te chamou.`, 'sucesso');
        } else {
          mostrarErro('Entrega concluída, mas houve um erro ao dividir o valor. Avisa o suporte com o ID deste pedido, vamos corrigir manualmente.');
        }
      } else {
        const resultadoCredito = await creditarSaldoMotorista(p.motoristaTelefone, ganhoTotal);
        if(resultadoCredito.ok){
          mostrarToast(`Entrega concluída! R$ ${ganhoTotal.toFixed(2)} creditado.`, 'sucesso');
        } else {
          mostrarErro('Entrega concluída, mas houve um erro ao creditar o valor na sua carteira. Avisa o suporte com o ID deste pedido, vamos corrigir manualmente.');
        }
      }
    }
    await carregarPedidos();
  }
}

// ---------- foto obrigatória antes/depois (com verificação de localização) ----------
let fotoPendente = null; // { pedidoId, tipo }
function obterPosicaoAtual(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos)=>resolve({ lat:pos.coords.latitude, lon:pos.coords.longitude }),
      ()=>resolve(ultimaPosicaoMotorista || null),
      { enableHighAccuracy:true, timeout:8000, maximumAge:5000 }
    );
  });
}
async function verificarNoEndereco(coordAlvo){
  if(!coordAlvo) return { dentro:true, distanciaKm:0 }; // sem coordenada cadastrada, não bloqueia
  const posicao = await obterPosicaoAtual();
  if(!posicao) return { dentro:false, distanciaKm:null, semGps:true };
  const distanciaKmAtual = distanciaKm(posicao.lat, posicao.lon, coordAlvo.lat, coordAlvo.lon);
  return { dentro: distanciaKmAtual<=RAIO_GEOFENCE_KM, distanciaKm: distanciaKmAtual };
}
async function solicitarFoto(pedidoId, tipo){
  const p = estado.pedidos.find(x=>x.id===pedidoId);
  if(!p) return;
  let coordAlvo;
  if(tipo==='antes'){
    coordAlvo = p.origemCoord;
  } else {
    const listaParadas = listaDestinosPedido(p);
    coordAlvo = listaParadas[listaParadas.length-1].coord;
  }
  mostrarToast('Verificando a sua localização...');
  const resultado = await verificarNoEndereco(coordAlvo);
  if(resultado.semGps){
    mostrarToast('Não consegui confirmar a sua localização. Ative o GPS e tente novamente.', 'erro');
    return;
  }
  if(!resultado.dentro){
    const faltam = resultado.distanciaKm!=null ? ` (faltam ~${resultado.distanciaKm.toFixed(2)} km)` : '';
    mostrarToast(`Só pode ${tipo==='antes'?'coletar':'finalizar a entrega'} quando estiver no endereço${faltam}.`);
    return;
  }
  // ---- taxa de espera: registra o momento em que o motorista chegou no local (coleta ou entrega), a primeira vez que passa no geofence ----
  const campoChegada = tipo==='antes' ? 'chegadaColetaEm' : 'chegadaEntregaEm';
  if(!p[campoChegada]){
    const campoDB = tipo==='antes' ? 'chegada_coleta_em' : 'chegada_entrega_em';
    const agoraChegada = Date.now();
    const { error: erroChegada } = await sb.from('entrega_pedidos').update({ [campoDB]: agoraChegada }).eq('id', pedidoId);
    if(!erroChegada){ p[campoChegada] = agoraChegada; estado.ultimoPedidosJSON=''; }
  }
  fotoPendente = { pedidoId, tipo };
  document.getElementById('input-foto').click();
}
async function confirmarParadaIntermediaria(pedidoId){
  const p = estado.pedidos.find(x=>x.id===pedidoId);
  if(!p || p.motoristaTelefone!==estado.motorista.telefone || p.status!=='a_caminho') return;
  const listaParadas = listaDestinosPedido(p);
  const paradaAtualIdx = Math.min(p.paradaAtual||0, listaParadas.length-1);
  if(paradaAtualIdx >= listaParadas.length-1) return; // já é a última, deve usar solicitarFoto
  mostrarToast('Verificando a sua localização...');
  const resultado = await verificarNoEndereco(listaParadas[paradaAtualIdx].coord);
  if(resultado.semGps){
    mostrarToast('Não consegui confirmar a sua localização. Ative o GPS e tente novamente.', 'erro');
    return;
  }
  if(!resultado.dentro){
    const faltam = resultado.distanciaKm!=null ? ` (faltam ~${resultado.distanciaKm.toFixed(2)} km)` : '';
    mostrarToast(`Só pode confirmar essa parada quando estiver no endereço${faltam}.`);
    return;
  }
  const { error } = await sb.from('entrega_pedidos').update({ parada_atual: paradaAtualIdx+1, atualizado_em: Date.now() }).eq('id', pedidoId);
  if(error){ console.error(error); mostrarToast('Erro ao confirmar a parada.', 'erro'); return; }
  estado.ultimoPedidosJSON='';
  mostrarToast(`Parada ${paradaAtualIdx+1} de ${listaParadas.length} entregue! Segue para a próxima.`, 'sucesso');
  await carregarPedidos();
}
async function processarFotoSelecionada(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file || !fotoPendente) return;
  const pendente = fotoPendente; fotoPendente = null;

  await avancarStatus(pendente.pedidoId);
}

// ---------- rastreio ao vivo ----------
let avisoLocalizacaoMostrado = false;
function iniciarRastreioMotorista(){
  if(watchId!=null) return;
  if(!window.isSecureContext){
    // navegadores modernos bloqueiam geolocalização fora de HTTPS (exceto localhost) — sem isso, a posição nunca chega
    if(!avisoLocalizacaoMostrado){ avisoLocalizacaoMostrado=true; mostrarToast('Não foi possível ativar a localização: o app precisa estar em HTTPS.', 'erro'); }
    return;
  }
  if(!navigator.geolocation){
    if(!avisoLocalizacaoMostrado){ avisoLocalizacaoMostrado=true; mostrarToast('Este navegador não tem suporte a localização.', 'erro'); }
    return;
  }
  watchId = navigator.geolocation.watchPosition(
    (pos)=>{ ultimaPosicaoMotorista = { lat:pos.coords.latitude, lon:pos.coords.longitude }; enviarPosicaoMotorista(); },
    (err)=>{
      console.warn(err);
      if(!avisoLocalizacaoMostrado){
        avisoLocalizacaoMostrado = true;
        const msg = err && err.code===1 ? 'Localização bloqueada. Ative a permissão de localização pro app pra aparecer no mapa e receber pedidos.'
          : 'Não consegui obter sua localização agora. Verifique o GPS e tente de novo.';
        mostrarToast(msg, 'erro');
      }
    },
    { enableHighAccuracy:true, maximumAge:10000 }
  );
  if(!window._envioIntervalo) window._envioIntervalo = setInterval(enviarPosicaoMotorista, 8000);
}
function pararRastreioMotorista(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } avisoLocalizacaoMostrado=false; }
async function enviarPosicaoMotorista(){
  if(!ultimaPosicaoMotorista || !estado.motorista.ativo) return;
  // grava a posição atual do motorista sempre que ele estiver logado — isso alimenta o mapa
  // geral do admin, que mostra motoristas disponíveis mesmo sem corrida em andamento
  if(estado.motorista.telefone){
    sb.from('entrega_motoristas').update({
      lat_atual: ultimaPosicaoMotorista.lat, lng_atual: ultimaPosicaoMotorista.lon, lat_atualizado_em: Date.now()
    }).eq('telefone', estado.motorista.telefone);
  }
  const ativos = estado.pedidos.filter(p=>p.motoristaTelefone===estado.motorista.telefone && p.iniciadoEm && ['indo_coletar','coletado','a_caminho'].includes(p.status));
  if(ativos.length===0) return;
  await Promise.all(ativos.map(p=>sb.from('entrega_pedidos').update({
    motorista_lat: ultimaPosicaoMotorista.lat, motorista_lng: ultimaPosicaoMotorista.lon, motorista_atualizado_em: Date.now()
  }).eq('id', p.id)));
  estado.ultimoPedidosJSON='';
}

// ---------- mapa ----------
// Quando só a posição do motorista muda (GPS a cada 8s), carregarPedidos() NÃO redesenha a tela
// inteira — chama só atualizarMapasAoVivo(), que atualiza o(s) mapa(s) aberto(s). Nos outros casos
// (pedido aceito, status mudou, etc.) o app é re-renderizado via innerHTML normalmente.
// Para o carro "andar" suavemente em vez de saltar a cada atualização, o mapa Leaflet e
// seus marcadores vivem numa div separada, guardada em memória (mapasAtivos), que é
// apenas RE-ENCAIXADA dentro do novo slot do template a cada render — nunca recriada do zero.
function montarMapa(containerId, pedido){
  setTimeout(()=>{
    const slot = document.getElementById(containerId);
    if(!slot || !pedido.origemCoord || !pedido.destinoCoord) return;
    const pO=[pedido.origemCoord.lat,pedido.origemCoord.lon], pD=[pedido.destinoCoord.lat,pedido.destinoCoord.lon];
    const pM = pedido.motoristaCoord ? [pedido.motoristaCoord.lat,pedido.motoristaCoord.lon] : null;
    const alvo = (pedido.status==='indo_coletar') ? pO : pD;
    let m = mapasAtivos[containerId];
    if(!m){
      const div = document.createElement('div');
      div.style.width='100%'; div.style.height='100%';
      slot.appendChild(div);
      const map = L.map(div,{zoomControl:false, attributionControl:false});
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      L.marker(pO,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#ff5a3c;border:2px solid #fff"></div>'})}).addTo(map);
      L.marker(pD,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#7fae72;border:2px solid #fff"></div>'})}).addTo(map);
      L.polyline([pO,pD],{color:'#a9a89c',weight:2,opacity:0.35,dashArray:'5,7'}).addTo(map);
      m = { el:div, map, mMotorista:null, linhaMotorista:null, posAtual:null, raf:null };
      mapasAtivos[containerId]=m;
      map.fitBounds(pM?[pO,pD,pM]:[pO,pD],{padding:[24,24]});
      // o card acabou de entrar no DOM (innerHTML recém-renderizado) — o Leaflet às vezes calcula
      // o tamanho do container antes do layout/CSS terminarem de assentar, e o mapa fica em branco.
      // Forçamos um recálculo de tamanho logo depois para garantir que os tiles apareçam.
      setTimeout(()=>{ try{ m.map.invalidateSize(); m.map.fitBounds(pM?[pO,pD,pM]:[pO,pD],{padding:[24,24]}); }catch(e){} }, 200);
    } else if(m.el.parentElement!==slot){
      // o container do template foi recriado no último render — reencaixa o mapa vivo nele
      slot.appendChild(m.el);
      setTimeout(()=>{ try{ m.map.invalidateSize(); }catch(e){} },0);
    }
    if(pM){
      const emoji = (VEICULOS[pedido.veiculo]&&VEICULOS[pedido.veiculo].emoji)||'';
      if(!m.mMotorista){
        m.mMotorista = L.marker(pM,{icon:iconeMotorista(emoji)}).addTo(m.map);
        m.linhaMotorista = L.polyline([pM,alvo],{color:'#ffc93c',weight:5,opacity:0.9,lineCap:'round'}).addTo(m.map);
        m.posAtual = pM;
        m.map.fitBounds([pO,pD,pM],{padding:[24,24]});
      } else if(m.posAtual && (m.posAtual[0]!==pM[0] || m.posAtual[1]!==pM[1])){
        animarMotorista(m, m.posAtual, pM, alvo);
      } else if(m.linhaMotorista){
        m.linhaMotorista.setLatLngs([pM,alvo]);
      }
    }
  },30);
}
function iconeMotorista(emoji){
  return L.divIcon({ className:'', html:`<div class="icone-motorista-anim"><span>${emoji}</span></div>`, iconSize:[30,30], iconAnchor:[15,15] });
}
// bolinha colorida usada no mapa geral do admin (disponível / em corrida / cliente aguardando)
function iconeBolinhaMapa(emoji, classeCor){
  return L.divIcon({ className:'', html:`<div class="bolinha-mapa ${classeCor}">${emoji}</div>`, iconSize:[26,26], iconAnchor:[13,13] });
}
// desliza o marcador do motorista da posição antiga até a nova em vez de "teleportar"
function animarMotorista(m, de, para, alvo){
  if(m.raf) cancelAnimationFrame(m.raf);
  const inicio = performance.now();
  const duracao = 3500;
  function passo(agora){
    const t = Math.min(1, (agora-inicio)/duracao);
    const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    const lat = de[0]+(para[0]-de[0])*ease;
    const lon = de[1]+(para[1]-de[1])*ease;
    if(m.mMotorista) m.mMotorista.setLatLng([lat,lon]);
    if(m.linhaMotorista) m.linhaMotorista.setLatLngs([[lat,lon],alvo]);
    if(t<1){ m.raf=requestAnimationFrame(passo); } else { m.posAtual=para; m.raf=null; }
  }
  m.raf = requestAnimationFrame(passo);
}
// desliza um marcador simples (sem linha até um alvo) da posição antiga até a nova
function animarMarcadorSimples(mk, de, para){
  if(mk.raf) cancelAnimationFrame(mk.raf);
  const inicio = performance.now();
  const duracao = 3500;
  function passo(agora){
    const t = Math.min(1, (agora-inicio)/duracao);
    const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    const lat = de[0]+(para[0]-de[0])*ease;
    const lon = de[1]+(para[1]-de[1])*ease;
    mk.marker.setLatLng([lat,lon]);
    if(t<1){ mk.raf=requestAnimationFrame(passo); } else { mk.posAtual=para; mk.raf=null; }
  }
  mk.raf = requestAnimationFrame(passo);
}
// ---------- mapa geral do admin: mostra AO VIVO motoristas em corrida, motoristas disponíveis e clientes aguardando ----------
// idade máxima de uma posição pra ainda ser considerada "ao vivo" (motorista pode ter fechado o app sem sair)
const POSICAO_MOTORISTA_MAX_IDADE_MS = 6*60*1000; // 6 minutos
function montarMapaAdminGeral(){
  setTimeout(()=>{
    const slot = document.getElementById('admin-mapa-geral');
    if(!slot) return; // painel admin não está na aba Resumo agora — não há onde montar
    // pega, por motorista, o pedido ativo mais recente com posição conhecida
    const porTelefone = {};
    (estado.admin.todosPedidos||[]).forEach(p=>{
      if(!['indo_coletar','coletado','a_caminho'].includes(p.status)) return;
      if(p.motorista_lat==null || p.motorista_lng==null || !p.motorista_telefone) return;
      const atual = porTelefone[p.motorista_telefone];
      if(!atual || Number(p.motorista_atualizado_em||0) > Number(atual.motorista_atualizado_em||0)){
        porTelefone[p.motorista_telefone] = p;
      }
    });
    const emCorrida = Object.values(porTelefone);
    const telefonesEmCorrida = new Set(emCorrida.map(p=>p.motorista_telefone));
    const agora = Date.now();
    // motoristas online com acesso ao painel, com posição conhecida e recente, e que não estejam já contados como "em corrida"
    const disponiveis = (estado.admin.motoristas||[]).filter(m=>
      motoristaOnlineAgora(m) && m.lat_atual!=null && m.lng_atual!=null &&
      !telefonesEmCorrida.has(m.telefone) && (agora - Number(m.lat_atualizado_em||0)) < POSICAO_MOTORISTA_MAX_IDADE_MS
    );
    // clientes aguardando: pedidos ainda buscando motorista, com endereço de origem já geolocalizado
    const aguardando = (estado.admin.todosPedidos||[]).filter(p=>p.status==='buscando' && p.origem_lat!=null && p.origem_lng!=null);
    const todasPosicoes = [
      ...emCorrida.map(p=>[p.motorista_lat,p.motorista_lng]),
      ...disponiveis.map(m=>[m.lat_atual,m.lng_atual]),
      ...aguardando.map(p=>[p.origem_lat,p.origem_lng])
    ];
    if(!mapaAdminGeral){
      const div = document.createElement('div');
      div.style.width='100%'; div.style.height='100%';
      slot.appendChild(div);
      const map = L.map(div,{zoomControl:true, attributionControl:false});
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      map.setView([-14.235,-51.9253], 4); // centro do Brasil, até termos algo pra enquadrar
      const legenda = L.control({position:'bottomright'});
      legenda.onAdd = function(){
        const div = L.DomUtil.create('div','legenda-mapa-admin');
        div.innerHTML = `
          <div class="item"><span class="ponto" style="background:#2ecc71"></span>Motorista disponível</div>
          <div class="item"><span class="ponto" style="background:#ff9330"></span>Motorista em corrida</div>
          <div class="item"><span class="ponto" style="background:#3fa7ff"></span>Cliente aguardando</div>`;
        return div;
      };
      legenda.addTo(map);
      mapaAdminGeral = { el:div, map, marcadores:{}, marcadoresDisponiveis:{}, marcadoresClientes:{} };
      setTimeout(()=>{ try{ mapaAdminGeral.map.invalidateSize(); }catch(e){} }, 200);
    } else if(mapaAdminGeral.el.parentElement !== slot){
      // o container do template foi recriado no último render — reencaixa o mapa vivo nele
      slot.appendChild(mapaAdminGeral.el);
      setTimeout(()=>{ try{ mapaAdminGeral.map.invalidateSize(); }catch(e){} }, 0);
    }
    // ---- motoristas em corrida (bolinha laranja, ícone do veículo) ----
    const telefonesAtivos = new Set();
    emCorrida.forEach(p=>{
      telefonesAtivos.add(p.motorista_telefone);
      const pos = [p.motorista_lat, p.motorista_lng];
      const emoji = (VEICULOS[p.motorista_veiculo_tipo]&&VEICULOS[p.motorista_veiculo_tipo].emoji) || '';
      const popup = `<b>${p.motorista_nome||'Motorista'}</b>${p.motorista_telefone?`<br> ${p.motorista_telefone}`:''}<br>${STATUS_MAPA_ADMIN[p.status]||p.status}<br>Cliente: ${p.cliente_nome||'—'}`;
      let mk = mapaAdminGeral.marcadores[p.motorista_telefone];
      if(!mk){
        const marker = L.marker(pos,{icon:iconeBolinhaMapa(emoji,'bolinha-corrida')}).addTo(mapaAdminGeral.map).bindPopup(popup);
        mapaAdminGeral.marcadores[p.motorista_telefone] = { marker, posAtual:pos, raf:null };
      } else {
        mk.marker.setPopupContent(popup);
        if(mk.posAtual[0]!==pos[0] || mk.posAtual[1]!==pos[1]){
          animarMarcadorSimples(mk, mk.posAtual, pos);
        }
      }
    });
    // remove do mapa quem não está mais em corrida (entregou, cancelou ou ficou indisponível)
    Object.keys(mapaAdminGeral.marcadores).forEach(tel=>{
      if(!telefonesAtivos.has(tel)){
        try{ mapaAdminGeral.map.removeLayer(mapaAdminGeral.marcadores[tel].marker); }catch(e){}
        delete mapaAdminGeral.marcadores[tel];
      }
    });
    // ---- motoristas disponíveis, sem corrida no momento (bolinha verde) ----
    const telefonesDisponiveisAtivos = new Set();
    disponiveis.forEach(m=>{
      telefonesDisponiveisAtivos.add(m.telefone);
      const pos = [m.lat_atual, m.lng_atual];
      const emoji = (VEICULOS[m.veiculo_tipo]&&VEICULOS[m.veiculo_tipo].emoji) || '';
      const desde = m.disponivel_atualizado_em ? `<br>Disponível ${tempoDecorrido(Number(m.disponivel_atualizado_em))}` : '';
      const popup = `<b>${m.nome||'Motorista'}</b>${m.telefone?`<br> ${m.telefone}`:''}<br> Disponível${desde}`;
      let mk = mapaAdminGeral.marcadoresDisponiveis[m.telefone];
      if(!mk){
        const marker = L.marker(pos,{icon:iconeBolinhaMapa(emoji,'bolinha-disponivel')}).addTo(mapaAdminGeral.map).bindPopup(popup);
        mapaAdminGeral.marcadoresDisponiveis[m.telefone] = { marker, posAtual:pos, raf:null };
      } else {
        mk.marker.setPopupContent(popup);
        if(mk.posAtual[0]!==pos[0] || mk.posAtual[1]!==pos[1]){
          animarMarcadorSimples(mk, mk.posAtual, pos);
        }
      }
    });
    Object.keys(mapaAdminGeral.marcadoresDisponiveis).forEach(tel=>{
      if(!telefonesDisponiveisAtivos.has(tel)){
        try{ mapaAdminGeral.map.removeLayer(mapaAdminGeral.marcadoresDisponiveis[tel].marker); }catch(e){}
        delete mapaAdminGeral.marcadoresDisponiveis[tel];
      }
    });
    // ---- clientes aguardando motorista (bolinha azul) ----
    const idsAguardandoAtivos = new Set();
    aguardando.forEach(p=>{
      idsAguardandoAtivos.add(p.id);
      const pos = [p.origem_lat, p.origem_lng];
      const popup = `<b>${p.cliente_nome||'Cliente'}</b>${p.cliente_telefone?`<br> ${p.cliente_telefone}`:''}<br>⏳ Aguardando ${tempoDecorrido(Number(p.criado_em))}${p.origem?`<br>${p.origem}`:''}`;
      let mk = mapaAdminGeral.marcadoresClientes[p.id];
      if(!mk){
        const marker = L.marker(pos,{icon:iconeBolinhaMapa('','bolinha-cliente')}).addTo(mapaAdminGeral.map).bindPopup(popup);
        mapaAdminGeral.marcadoresClientes[p.id] = { marker, posAtual:pos };
      } else {
        mk.marker.setLatLng(pos);
        mk.marker.setPopupContent(popup);
        mk.posAtual = pos;
      }
    });
    Object.keys(mapaAdminGeral.marcadoresClientes).forEach(id=>{
      if(!idsAguardandoAtivos.has(id)){
        try{ mapaAdminGeral.map.removeLayer(mapaAdminGeral.marcadoresClientes[id].marker); }catch(e){}
        delete mapaAdminGeral.marcadoresClientes[id];
      }
    });
    if(todasPosicoes.length>0){
      try{ mapaAdminGeral.map.fitBounds(todasPosicoes, {padding:[36,36], maxZoom:14}); }catch(e){}
    }
  }, 30);
}
// remove mapas de pedidos que já não estão mais visíveis na tela (evita vazamento de memória)
function limparMapasInativos(idsAtivos){
  Object.keys(mapasAtivos).forEach(containerId=>{
    if(!idsAtivos.has(containerId)){
      const m = mapasAtivos[containerId];
      try{ if(m.raf) cancelAnimationFrame(m.raf); m.map.remove(); }catch(e){}
      delete mapasAtivos[containerId];
    }
  });
}
function etaHTML(pedido){
  if(!pedido.motoristaCoord) return `<div class="subtitulo" style="margin-top:8px">Aguardando o entregador iniciar a rota...</div>`;
  const alvo = (pedido.status==='indo_coletar') ? pedido.origemCoord : pedido.destinoCoord;
  if(!alvo) return '';
  const km = distanciaKm(pedido.motoristaCoord.lat,pedido.motoristaCoord.lon,alvo.lat,alvo.lon);
  const min = Math.max(1, Math.round((km/VEICULOS[pedido.veiculo].veloc)*60));
  const txt = pedido.status==='indo_coletar' ? 'até a coleta' : 'até o seu endereço';
  registrarEta(pedido.id, min);
  return `<div class="eta-banner"><div class="eta-min" id="eta-min-${pedido.id}">~${min} min</div><div class="eta-sub" id="eta-sub-${pedido.id}">${km.toFixed(1)} km ${txt} · atualizado em tempo real</div></div>`;
}
// ---------- contagem regressiva do ETA em tempo real ----------
// a cada atualização real de posição (registrarEta) fixamos o valor "oficial"; entre uma
// atualização e outra (a cada 8-15s), o número vai diminuindo sozinho, segundo a segundo
function registrarEta(pedidoId, minutos){
  etaEstado[pedidoId] = { segundos: minutos*60, ultimoOficial: minutos*60 };
}
function iniciarTickEta(){
  if(etaTickInterval) return;
  etaTickInterval = setInterval(()=>{
    Object.keys(etaEstado).forEach(id=>{
      const el = document.getElementById('eta-min-'+id);
      if(!el){ delete etaEstado[id]; return; }
      const e = etaEstado[id];
      if(e.segundos>30) e.segundos -= 1;
      el.textContent = '~'+Math.max(1,Math.round(e.segundos/60))+' min';
    });
  },1000);
}
// ---------- tempo "há X min" nos pedidos disponíveis do motorista, atualiza sozinho sem re-render ----------
let tempoPedidosTickInterval = null;
function iniciarTickTempoPedidos(){
  if(tempoPedidosTickInterval) return;
  tempoPedidosTickInterval = setInterval(()=>{
    document.querySelectorAll('.tempo-pedido').forEach(el=>{
      const criado = Number(el.getAttribute('data-criado'));
      if(!criado) return;
      el.textContent = '⏱ '+tempoDecorrido(criado);
    });

}

// ---------- raio do radar de busca (cliente) — vai "alimentando" o raio de 1 em 1 minuto, sem precisar de novo render ----------
let radarBuscaTickInterval = null;
function iniciarTickRadarBusca(){
  if(radarBuscaTickInterval) return;
  radarBuscaTickInterval = setInterval(()=>{
    document.querySelectorAll('.radar-busca-wrap').forEach(wrap=>{
      const criado = Number(wrap.getAttribute('data-criado'));
      if(!criado) return;
      const el = wrap.querySelector('.radar-raio-texto');
      if(!el) return;
      const minutosBuscando = (Date.now() - criado) / 60000;
      const raioKm = Math.min(15, 2 + Math.floor(minutosBuscando));
      const ampliando = minutosBuscando >= 1;
      el.textContent = `${ampliando ? 'Ampliando a área de busca' : 'Buscando na área'} — ${raioKm} km`;
    });

// ---------- relógio da janela grátis de cancelamento (cliente) ----------
let relogioCancelTickInterval = null;
function relogioCancelamentoHTML(p){
  // só mostra enquanto o pedido ainda pode ser cancelado e a corrida já foi aceita (janela em contagem)
  if(p.status!=='indo_coletar' || !p.aceitoEm) return '';
  const { html, vencido } = textoRelogioCancelamento(p.aceitoEm, p.preco);
  return `<div class="relogio-cancelamento${vencido?' relogio-cancelamento-vencido':''}" id="relogio-cancel-${p.id}" data-aceito="${p.aceitoEm}" data-preco="${p.preco}">${html}</div>`;
}
function textoRelogioCancelamento(aceitoEm, preco){
  const restanteMs = JANELA_CANCELAMENTO_MS - (Date.now() - aceitoEm);
  if(restanteMs > 0){
    const min = Math.floor(restanteMs/60000);
    const seg = Math.floor((restanteMs%60000)/1000);
    return { html: `⏱ Cancelamento grátis por mais <b>${min}:${String(seg).padStart(2,'0')}</b>`, vencido:false };
  }
  const taxa = Math.round(preco*TAXA_CANCELAMENTO_TARDIO*100)/100;
  return { html: ` Janela grátis encerrada — cancelar agora cobra taxa de <b>R$ ${taxa.toFixed(2)}</b>`, vencido:true };
}
function iniciarTickRelogioCancelamento(){
  if(relogioCancelTickInterval) return;
  relogioCancelTickInterval = setInterval(()=>{
    document.querySelectorAll('.relogio-cancelamento').forEach(el=>{
      const aceito = Number(el.getAttribute('data-aceito'));
      const preco = Number(el.getAttribute('data-preco'));
      if(!aceito) return;
      const { html, vencido } = textoRelogioCancelamento(aceito, preco);
      el.innerHTML = html;
      el.classList.toggle('relogio-cancelamento-vencido', vencido);
    });
  }, 1000);
}

  return `<div class="trilha">${pontos}</div><div class="etiquetas"><span>Buscando</span><span>Coleta</span><span>Recolhido</span><span>Rota</span><span>Entregue</span></div>`;

async function copiarIdPedido(id){
  try{ await navigator.clipboard.writeText(id); mostrarToast('ID copiado.', 'sucesso'); }catch(e){ mostrarToast('Não foi possível copiar. Copia manualmente.', 'erro'); }

async function compartilharPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const texto = `Acompanha a minha entrega Entrega Flash:\nRecolha: ${p.origem}\nEntrega: ${p.destino}\nStatus: ${ROTULOS_ESTAGIO[p.status]||p.status}\nID do pedido: ${p.id}`;
  if(navigator.share){
    try{ await navigator.share({ title:'Entrega Flash', text:texto }); }catch(e){ /* usuário cancelou */ }
  } else {
    try{ await navigator.clipboard.writeText(texto); mostrarToast('Detalhes copiados para compartilhar.', 'sucesso'); }catch(e){ mostrarToast('Não foi possível compartilhar.', 'erro'); }
  }
}

  return p.paradas.map((end,idx)=>{

function cartaoPedidoAtivo(p){

// ---------- taxa de espera: aviso de tempo esperando no local (coleta ou entrega) ----------
function esperaHTML(p, ultimaParada){
  const aguardandoColeta = p.status==='indo_coletar' && p.chegadaColetaEm && !p.fotoAntesUrl;
  const aguardandoEntrega = p.status==='a_caminho' && ultimaParada && p.chegadaEntregaEm && !p.fotoDepoisUrl;
  const chegada = aguardandoColeta ? p.chegadaColetaEm : (aguardandoEntrega ? p.chegadaEntregaEm : null);
  let blocos = '';
  if(chegada){
    const minutos = Math.floor((Date.now()-chegada)/60000);
    const excedente = Math.max(0, minutos - TAXA_ESPERA_TOLERANCIA_MIN);
    const taxaAcumulada = Math.round(excedente*TAXA_ESPERA_VALOR_MIN*100)/100;
    blocos += `<div class="subtitulo" style="margin-top:8px;background:var(--painel-alt);border-radius:8px;padding:8px 10px">⏳ Esperando no local há <b style="color:var(--osso)">${minutos} min</b> (tolerância: ${TAXA_ESPERA_TOLERANCIA_MIN} min)${excedente>0 ? `<br> Taxa de espera acumulada: <b style="color:var(--mango)">R$ ${taxaAcumulada.toFixed(2)}</b> (R$ ${TAXA_ESPERA_VALOR_MIN.toFixed(2)}/min excedente)` : ''}</div>`;
  }
  const taxaJaCobrada = (p.taxaEsperaColeta||0) + (p.taxaEsperaEntrega||0);
  if(taxaJaCobrada>0){
    blocos += `<div class="subtitulo" style="margin-top:6px"> Taxa de espera já cobrada nesta entrega: <b style="color:var(--osso)">R$ ${taxaJaCobrada.toFixed(2)}</b></div>`;
  }
  return blocos;
}
function extrasHTML(p){
  const ativos = extrasAtivos(p.extras);
  if(ativos.length===0) return '';
  return `<div style="font-size:13px;color:var(--poeira);margin:4px 0 8px"> Extras: ${ativos.map(k=>`${EXTRAS_INFO[k].emoji} ${EXTRAS_INFO[k].label}`).join(' · ')}</div>`;
}
function fotosHTML(p){
  if(!p.fotoAntesUrl && !p.fotoDepoisUrl) return '';
  return `<div class="foto-bloco">
    <div class="foto-legenda"> Foto do produto · toca para ampliar</div>
    <div style="display:flex;gap:8px">
      ${p.fotoAntesUrl ? `<div class="foto-item" onclick="ampliarFoto('${p.fotoAntesUrl}')"><img src="${p.fotoAntesUrl}"><span class="foto-lupa"></span></div>` : ''}
      ${p.fotoDepoisUrl ? `<div class="foto-item" onclick="ampliarFoto('${p.fotoDepoisUrl}')"><img src="${p.fotoDepoisUrl}"><span class="foto-lupa"></span></div>` : ''}
    </div>
  </div>`;
}

function fecharParceiros(){
  estado.parceiro.aberto = false;

  render();
}
function parceiroCampo(campo, valor){ estado.parceiro.form[campo]=valor; }
function parceiroEsc(v){ return String(v??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalizarWhatsParceiro(v){ return String(v||'').replace(/\D/g,'').slice(-11); }
async function enviarCadastroParceiro(){
  const p = estado.parceiro;
  const f = p.form;
  p.erro='';
  const whats = normalizarWhatsParceiro(f.whatsapp);
  if(String(f.estabelecimento||'').trim().length<2){ p.erro='Informe o nome do estabelecimento.'; render(); return; }
  if(String(f.responsavel||'').trim().length<2){ p.erro='Informe o nome do responsável.'; render(); return; }
  if(whats.length<10){ p.erro='Informe um WhatsApp válido com DDD.'; render(); return; }
  if(String(f.cidade||'').trim().length<2){ p.erro='Informe a cidade.'; render(); return; }
  p.enviando=true; render();
  try{
    const payload={
      estabelecimento:String(f.estabelecimento).trim(),
      responsavel:String(f.responsavel).trim(),
      whatsapp:whats,
      cidade:String(f.cidade).trim(),
      endereco:String(f.endereco||'').trim()||null,
      tipo_negocio:f.tipoNegocio,
      entregas_dia:f.entregasDia||null,
      mensagem:String(f.mensagem||'').trim()||null
    };
    const { error } = await sb.from('entrega_parceiros').insert(payload);
    if(error) throw error;
    p.enviado=true;
    p.form={ estabelecimento:'', responsavel:'', whatsapp:'', cidade:'', endereco:'', tipoNegocio:'farmacia', entregasDia:'0-5', mensagem:'' };
    window.scrollTo(0,0);
  }catch(e){
    console.error('Falha cadastro parceiro',e);
    p.erro='Não foi possível enviar agora. Confira sua internet e tente novamente.';
  }finally{ p.enviando=false; render(); }
}

function irEtapaPedido(alvo){
  const f = estado.form;
  if(alvo>f.etapaPedido && f.etapaPedido===1 && (!f.origem || !f.destino)){
    mostrarToast('Preenche o endereço de recolha e o de entrega.'); return;
  }
  // A troca de etapa precisa ser imediata. A antiga espera de 4 segundos deixava tempo para
  // atualizações realtime redesenharem a tela e dava a impressão de que o botão voltou ao formulário.
  estado.transicaoPedido = { ativa:false, alvo:null };
  f.etapaPedido = alvo;
  if(alvo===3 && f.distancia==null && !estado.falhaCalculo){ calcularCorrida(); return; }
  render();
  setTimeout(()=>{ document.querySelector('.etapa-conteudo')?.scrollIntoView({behavior:'smooth',block:'start'}); },30);
}

function telaAcessoMotorista(){
  const pm = estado.painelMotorista;
  if(pm.tela==='basico'){
    return `<div class="box-status"><span class="bs-emoji">📸</span><div class="bs-titulo">Seu cadastro já começou</div><div class="bs-texto">Não precisa esperar liberação. Continue agora de onde parou: informe a chave PIX e envie as fotos/documentos. Normalmente leva cerca de 1 minuto.</div>
      <button class="btn btn-primario" style="margin-top:16px" onclick="iniciarDocumentosDoPainel()">CONTINUAR CADASTRO →</button></div>`;
  }
  if(pm.tela==='liberado'){
    return `<div class="box-status"><span class="bs-emoji"></span><div class="bs-titulo">Cadastro liberado!</div><div class="bs-texto">Envia os teus documentos agora pra começares a receber corridas ainda hoje.</div>
      <button class="btn btn-primario" style="margin-top:16px" ${pm.carregandoLiberado?'disabled':''} onclick="continuarParaDocumentos()">${pm.carregandoLiberado?'A carregar...':' Enviar documentos'}</button></div>`;
  }
  if(pm.tela==='pendente'){
    return `<div class="box-status"><span class="bs-emoji">⏳</span><div class="bs-titulo">Cadastro enviado com sucesso!</div><div class="bs-texto">Recebemos seu cadastro. Agora é só aguardar a análise dos documentos. Vamos avisar pelo app e WhatsApp quando estiver aprovado.</div></div>`;
  }
  if(pm.tela==='reprovado'){
    return `<div class="box-status"><span class="bs-emoji"></span><div class="bs-titulo">Cadastro reprovado</div><div class="bs-texto">${pm.motivoReprovacao||'Não foi indicado um motivo.'}</div>
      <button class="btn btn-primario" style="margin-top:16px" onclick="irParaReenviarDocumentos()"> Corrigir e reenviar documentos</button>
      <button class="btn btn-secundario" style="margin-top:8px" onclick="irParaLogin()">Voltar</button></div>`;
  }
  if(pm.tela==='reenviar'){
    return telaReenviarDocumentosMotorista();
  }
  if(pm.tela==='cadastro'){
    return telaCadastroMotorista();
  }
  return `
  <div style="display:flex;align-items:center;gap:8px;justify-content:center;background:rgba(255,201,60,0.18);border:1.5px solid var(--mango);border-radius:12px;padding:10px 14px;margin-bottom:12px">
    <span style="font-size:22px"></span>
    <span style="font-family:'Rajdhani';font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:0.4px;color:var(--mango)">Login de MOTORISTA</span>
  </div>
  <div style="text-align:center;font-size:13px;color:var(--poeira);margin:-4px 0 14px">Quer pedir uma entrega em vez de trabalhar entregando? <span style="color:var(--azul);text-decoration:underline;cursor:pointer;font-weight:700" onclick="entrarBoasVindas('cliente')">Ir para o login de cliente</span></div>
  <div class="campo-motorista">
    <h2 style="font-family:'Rajdhani';font-weight:700;font-size:17px;text-transform:uppercase;margin:0 0 6px">Entrar como entregador</h2>
    <div class="subtitulo">Escolha entre o plano Free e o Pro — vai escolher no cadastro.</div>
    <label>Telefone</label>
    <input type="tel" id="lm-telefone" value="${pm.loginTelefone}" placeholder="(35) 90000-0000">
    <label>Senha</label>
    <input type="text" id="lm-senha" placeholder="A sua senha" style="-webkit-text-security:disc;text-security:disc;">
    <div style="text-align:right;margin-top:-6px"><span style="font-size:13px;color:var(--poeira);text-decoration:underline;cursor:pointer" onclick="abrirEsqueciSenha('motorista')">Esqueci minha senha</span></div>
    ${pm.loginErro?`<div class="erro-campo">${pm.loginErro}</div>`:''}
    <button class="btn btn-azul" ${atributoDesabilitado('loginMotorista')} onclick="executarComCarregando('loginMotorista', loginMotorista)">${rotuloCarregando('loginMotorista', ' Entrar com senha', 'Entrando...')}</button>
    <div style="display:flex;align-items:center;gap:10px;margin:10px 0;color:var(--poeira);font-size:12px">
      <div style="height:1px;background:var(--linha);flex:1"></div><span>ou</span><div style="height:1px;background:var(--linha);flex:1"></div>
    </div>
    <div style="margin-top:16px;padding:14px;border-radius:12px;background:linear-gradient(135deg,rgba(255,201,60,0.18),rgba(255,201,60,0.08));border:1px solid var(--mango);display:flex;gap:10px;align-items:flex-start">
      <div style="font-size:30px;line-height:1"></div>
      <div style="flex:1">

function passosHTML(atual){
  let html=`<div style="text-align:center;font-size:12.5px;font-weight:800;color:var(--mango);margin-bottom:7px">Etapa ${atual} de 6 · seu progresso fica salvo automaticamente</div><div class="passos">`;
  for(let i=1;i<=6;i++) html += `<div class="p ${i<atual?'feito':i===atual?'atual':''}"></div>`;
  html += '</div>';
  if(atual===1){
    html += `<div style="text-align:center;font-size:13.5px;font-weight:600;color:var(--mango);margin-top:8px"> Faça seu pré-cadastro e prepare sua conta para receber entregas na região!</div>`;

}

function progressoDocumentosCadastro(c){
  const itens = c.veiculo==='bicicleta'
    ? [!!c.fotoMotoristaUrl, !!c.fotoVeiculoFrenteUrl, !!c.fotoVeiculoTrasUrl]
    : [!!c.fotoMotoristaUrl, !!c.fotoVeiculoFrenteUrl, !!c.fotoVeiculoTrasUrl, !!c.crlvUrl, !!c.cnhUrl];
  const feitos = itens.filter(Boolean).length;
  return { feitos, total:itens.length, pct:Math.round((feitos/itens.length)*100) };
}
function progressoDocumentosHTML(c){
  const p=progressoDocumentosCadastro(c);
  const msg = p.feitos===p.total ? 'Tudo enviado! Só falta continuar.' : (p.feitos===0 ? 'Comece pela selfie. Cada foto é salva na hora.' : `Muito bem — faltam só ${p.total-p.feitos}.`);
  return `<div style="margin:10px 0 16px;padding:13px;border-radius:12px;background:rgba(255,201,60,.08);border:1px solid rgba(255,201,60,.35)">
    <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:800;color:var(--osso)"><span>Ativação do cadastro</span><span>${p.feitos} de ${p.total} enviados</span></div>
    <div style="height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px"><div style="height:100%;width:${p.pct}%;background:var(--mango);transition:width .25s ease"></div></div>
    <div style="font-size:12.5px;color:var(--poeira);margin-top:7px">${msg}</div>
  </div>`;
}

function chaveTreinamentoMotorista(){
  const tel=(estado.motorista&&estado.motorista.telefone)||'novo';
  return 'ef_treinamento_motorista_v2_'+String(tel).replace(/\D/g,'');
}
function treinamentoMotoristaConcluido(){
  try{return localStorage.getItem(chaveTreinamentoMotorista())==='concluido';}catch(e){return false;}
}
function etapaTreinamentoMotorista(){
  if(typeof estado.treinamentoMotoristaEtapa!=='number') estado.treinamentoMotoristaEtapa=0;
  return estado.treinamentoMotoristaEtapa;
}
function avancarTreinamentoMotorista(){
  const e=etapaTreinamentoMotorista();
  if(e===2 && !estado.treinamentoFotoProduto){
    mostrarToast('Tire a foto do produto para continuar o treinamento.', 'info');
    return;
  }
  if(e<5){ estado.treinamentoMotoristaEtapa=e+1; render(); }
  else concluirTreinamentoMotorista();
}
function processarFotoTreinamento(input){
  const arq=input&&input.files&&input.files[0];
  if(!arq) return;
  if(!String(arq.type||'').startsWith('image/')){ mostrarToast('Escolha uma foto válida.', 'erro'); return; }
  const leitor=new FileReader();
  leitor.onload=()=>{ estado.treinamentoFotoProduto=leitor.result; mostrarToast('Foto registrada no treinamento.', 'sucesso'); render(); };
  leitor.onerror=()=>mostrarToast('Não foi possível abrir a foto. Tente novamente.', 'erro');
  leitor.readAsDataURL(arq);
}
function concluirTreinamentoMotorista(){
  try{localStorage.setItem(chaveTreinamentoMotorista(),'concluido');}catch(e){}
  estado.treinamentoMotoristaEtapa=0;
  estado.treinamentoFotoProduto=null;
  mostrarToast('Treinamento concluído! Agora você já sabe como funciona uma entrega.', 'sucesso');
  render();
}

function telaMotorista(){
  const m = estado.motorista;
  if(!m.ativo){
    if(estado.sessaoCarregando) return `<div class="cartao"><div class="vazio"><span class="emoji-grande">⏳</span>A retomar a sua sessão...</div></div>`;
    return telaAcessoMotorista();
  }
  const planoAtual = PLANOS[m.plano] || PLANOS.free;
  const agoraTs = Date.now();
  const disponiveis = m.disponivel ? estado.pedidos
    .filter(p=>p.status==='buscando' && p.veiculo===m.veiculo && (p.prioridade || planoAtual.prioridade || (agoraTs-p.criadoEm)>=ATRASO_PRIORIDADE_PRO_MS))
    .map(p=>({ ...p, distanciaAteMim: (ultimaPosicaoMotorista && p.origemCoord) ? distanciaKm(ultimaPosicaoMotorista.lat,ultimaPosicaoMotorista.lon,p.origemCoord.lat,p.origemCoord.lon) : null }))
    // Despacho inteligente: começa perto e amplia automaticamente enquanto ninguém aceita.
    // 0-2 min: 5 km | 2-4 min: 10 km | 4-7 min: 20 km | depois: 40 km.
    .filter(p=>{
      if(p.distanciaAteMim==null) return true; // sem coordenada: não bloqueia o pedido
      const idadeMin=Math.max(0,(agoraTs-Number(p.criadoEm||agoraTs))/60000);
      const raioAuto=idadeMin<2?5:idadeMin<4?10:idadeMin<7?20:40;
      const limite=(m.plano==='pro' && m.raioAtendimentoKm)?Math.min(raioAuto,Number(m.raioAtendimentoKm)):raioAuto;
      return p.distanciaAteMim<=limite;
    })
    .sort((a,b)=> (b.prioridadeValor||0) - (a.prioridadeValor||0) || (a.distanciaAteMim!=null && b.distanciaAteMim!=null ? a.distanciaAteMim-b.distanciaAteMim : a.criadoEm-b.criadoEm)) : [];

let mapaMotoristaHome=null;
function montarMapaMotoristaHome(){
  const slot=document.getElementById('mapa-motorista-home');
  if(!slot || typeof L==='undefined') return;
  const fallback=[-21.3758,-46.5253];
  const pos=ultimaPosicaoMotorista ? [Number(ultimaPosicaoMotorista.lat),Number(ultimaPosicaoMotorista.lon)] : fallback;
  try{
    if(mapaMotoristaHome && mapaMotoristaHome.slot!==slot){ try{mapaMotoristaHome.map.remove()}catch(e){} mapaMotoristaHome=null; }
    if(!mapaMotoristaHome){
      const map=L.map(slot,{zoomControl:true}).setView(pos,15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
      const marker=L.marker(pos).addTo(map).bindPopup('Você está aqui');
      const circle=L.circle(pos,{radius:650,weight:1,fillOpacity:.07}).addTo(map);
      mapaMotoristaHome={slot,map,marker,circle};
      setTimeout(()=>{ try{map.invalidateSize()}catch(e){} },120);
    }else{
      mapaMotoristaHome.marker.setLatLng(pos); mapaMotoristaHome.circle.setLatLng(pos); mapaMotoristaHome.map.panTo(pos,{animate:true,duration:.45});
      setTimeout(()=>{ try{mapaMotoristaHome.map.invalidateSize()}catch(e){} },50);
    }
  }catch(e){ console.warn('Mapa motorista:',e); }
}

// ---------- preserva rolagem e digitação entre re-renderizações (evita "piscar") ----------
function capturarFocoAtivo(){
  const el = document.activeElement;
  if(!el || !el.id || !(el.tagName==='INPUT'||el.tagName==='TEXTAREA')) return null;
  return { id: el.id, value: el.value, selStart: el.selectionStart, selEnd: el.selectionEnd };
}
function restaurarFocoAtivo(foco){
  if(!foco) return;
  const el = document.getElementById(foco.id);
  if(!el || !(el.tagName==='INPUT'||el.tagName==='TEXTAREA')) return;
  if((el.value===''||el.value==null) && foco.value){ el.value = foco.value; }
  el.focus();
  try{ if(typeof foco.selStart==='number') el.setSelectionRange(foco.selStart, foco.selEnd); }catch(e){}
}
// captura o valor de TODOS os campos de texto/senha antes de redesenhar a tela (app.innerHTML=...),
// porque esse redesenho recria os elementos do zero e apagaria o que a pessoa digitou —
// isso é o que causava "login/senha não funciona, como se não tivesse digitado nada".
function capturarValoresInputs(){
  const app = document.getElementById('app');
  if(!app) return null;
  const mapa = {};
  app.querySelectorAll('input[id], textarea[id]').forEach(el=>{
    if(el.value){ mapa[el.id] = el.value; }
  });
  // <select> também precisa ser preservado (ex: escolha de plano no painel admin) —
  // sem isso, uma atualização em tempo real que chegue no meio (posição do motorista,
  // status online, etc.) recria o <select> com base no valor já salvo, apagando
  // silenciosamente a escolha que a pessoa acabou de fazer mas ainda não confirmou.
  app.querySelectorAll('select[id]').forEach(el=>{
    mapa[el.id] = el.value;
  });
  return mapa;
}
function restaurarValoresInputs(mapa){
  if(!mapa) return;
  // sempre restaura o que a pessoa tinha digitado (em vez de só quando o campo fica vazio):
  // vários campos (ex: configurações do admin, cadastro do motorista) só são lidos do DOM
  // na hora de salvar, sem sincronizar cada tecla no estado — se um re-render acontecesse
  // no meio (novo pedido chegando, atualização de outro admin, etc.), o valor digitado
  // "sumia" e voltava pro último valor salvo. Isso garante que digitar nunca se perde.
  Object.keys(mapa).forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){
      el.value = mapa[id];
    } else if(el.tagName==='SELECT'){
      // só restaura se a opção ainda existir no select recém-criado
      const existe = Array.from(el.options).some(o=>o.value===mapa[id]);
      if(existe) el.value = mapa[id];
    }
  });
}
function capturarScroll(){
  const adminConteudo = document.querySelector('.admin-conteudo');
  return { janela: window.scrollY, admin: adminConteudo?adminConteudo.scrollTop:null };
}
function restaurarScroll(s){
  if(!s) return;
  window.scrollTo(0, s.janela);
  if(s.admin!=null){ const el = document.querySelector('.admin-conteudo'); if(el) el.scrollTop = s.admin; }
}

let _efAssinaturaTelaAnterior = null;
// identifica qual "tela" está em exibição (login/cadastro/pedidos/histórico/perfil/admin etc.) — usada só
// para saber SE a tela mudou entre um render() e outro, e então tocar a transição suave uma única vez,
// sem re-animar a cada tecla digitada ou atualização de fundo (o que faria a tela "piscar" o tempo todo)
function _efAssinaturaTela(){
  return [
    estado.modo, estado.cliente.logado, estado.motorista.ativo,
    estado.painelCliente && estado.painelCliente.tela,
    estado.painelMotorista && estado.painelMotorista.tela,

function barraNavegacaoFluxo(){
  if(estado.cliente.logado || estado.motorista.ativo || estado.telaBoasVindas) return '';
  let titulo = estado.modo==='cliente' ? 'Área do cliente' : 'Área do entregador';
  if(estado.modo==='cliente' && estado.painelCliente?.tela==='cadastro') titulo='Cadastro de cliente';
  if(estado.modo==='entregador' && estado.painelMotorista?.tela==='cadastro') titulo=`Cadastro de entregador · etapa ${estado.painelMotorista.cadastro?.etapa||1}`;
  return `<nav class="ef-flow-nav" aria-label="Navegação do cadastro">
    <button class="ef-flow-back" type="button" onclick="voltarFluxoAtual()"><span class="arr">‹</span><span>Voltar</span></button>
    <div class="ef-flow-title">${titulo}</div>
    <button class="ef-flow-home" type="button" onclick="voltarParaEscolhaModo()">Início</button>
  </nav>`;
}
function voltarFluxoAtual(){
  if(estado.modo==='cliente' && !estado.cliente.logado){
    if(estado.painelCliente?.tela==='cadastro'){ irParaLoginCliente(); render(); return; }
    voltarParaEscolhaModo(); return;
  }
  if(estado.modo==='entregador' && !estado.motorista.ativo){
    const pm=estado.painelMotorista||{};
    if(pm.tela==='cadastro'){
      const etapa=Number(pm.cadastro?.etapa||1);
      if(etapa>1){ voltarEtapa(etapa-1); return; }
      irParaLogin(); render(); return;
    }
    if(pm.tela==='reenviar' || pm.tela==='reprovado' || pm.tela==='pendente' || pm.tela==='documentos'){ irParaLogin(); render(); return; }
    voltarParaEscolhaModo(); return;
  }
  voltarParaEscolhaModo();
}

// ---------- mantém o progresso do cadastro (cliente/motorista) mesmo se recarregar a página (F5) ----------
function salvarRascunhosCadastro(){
  try{
    if(!estado.motorista.ativo && estado.painelMotorista.tela!=='entrar'){
      const c = estado.painelMotorista.cadastro;
      localStorage.setItem('ef_motorista_rascunho', JSON.stringify({
        tela: estado.painelMotorista.tela,
        etapa: c.etapa, id: c.id, nome: c.nome, telefone: c.telefone, cidade: c.cidade,
        veiculo: c.veiculo, cpf: c.cpf, marca: c.marca, placa: c.placa, cor: c.cor,
        chavePix: c.chavePix||'', plano: c.plano||null, criadoEm:c.criadoEm||null,
        cnhUrl:c.cnhUrl||null, crlvUrl:c.crlvUrl||null,
        fotoVeiculoFrenteUrl:c.fotoVeiculoFrenteUrl||null,
        fotoVeiculoTrasUrl:c.fotoVeiculoTrasUrl||null,
        fotoMotoristaUrl:c.fotoMotoristaUrl||null,
        aceitaResponsabilidadeBike:!!c.aceitaResponsabilidadeBike
      }));
    } else if(!estado.motorista.ativo){
      localStorage.removeItem('ef_motorista_rascunho');
    }
    if(!estado.cliente.logado && estado.painelCliente.tela==='cadastro'){
      const cc = estado.painelCliente.cadastro;
      localStorage.setItem('ef_cliente_rascunho', JSON.stringify({ nome: cc.nome, telefone: cc.telefone }));
    } else if(!estado.cliente.logado){
      localStorage.removeItem('ef_cliente_rascunho');
    }
  }catch(e){ /* localStorage indisponível: seguimos sem persistir o rascunho */ }
}
function restaurarRascunhosCadastro(){
  try{
    if(!estado.motorista.ativo){
      const bruto = localStorage.getItem('ef_motorista_rascunho');
      if(bruto){
        const r = JSON.parse(bruto);
        estado.painelMotorista.tela = r.tela||'entrar';
        Object.assign(estado.painelMotorista.cadastro, {
          etapa: r.etapa||1, id: r.id||null, nome: r.nome||'', telefone: r.telefone||'', cidade: r.cidade||'',
          veiculo: r.veiculo||'moto', cpf: r.cpf||'', marca: r.marca||'', placa: r.placa||'', cor: r.cor||'',
          chavePix:r.chavePix||'', plano:r.plano||null, criadoEm:r.criadoEm||null,
          cnhUrl:r.cnhUrl||null, crlvUrl:r.crlvUrl||null,
          fotoVeiculoFrenteUrl:r.fotoVeiculoFrenteUrl||null,
          fotoVeiculoTrasUrl:r.fotoVeiculoTrasUrl||null,
          fotoMotoristaUrl:r.fotoMotoristaUrl||null,
          aceitaResponsabilidadeBike:!!r.aceitaResponsabilidadeBike
        });
      }
    }
    if(!estado.cliente.logado){
      const brutoC = localStorage.getItem('ef_cliente_rascunho');
      if(brutoC){
        const rc = JSON.parse(brutoC);
        if(rc.nome || rc.telefone){
          estado.painelCliente.tela='cadastro';
          Object.assign(estado.painelCliente.cadastro, { nome: rc.nome||'', telefone: rc.telefone||'' });
        }
      }
    }
  }catch(e){ /* ignora rascunho corrompido */ }
}

}

function sairMotorista(){ pararRastreioMotorista(); encerrarMotoristaLogadoRealtime(); if(estado.motorista.telefone) atualizarDisponibilidadeDB(estado.motorista.telefone,false); estado.motorista={nome:'',telefone:'',ativo:false,plano:null,disponivel:false,veiculo:'',marca:'',placa:'',cor:'',fotoMotoristaUrl:null,fotoVeiculoUrl:null,saldo:0,notaMedia:5,totalAvaliacoes:0,cancelamentosHoje:0,raioAtendimentoKm:null}; estado.chamadosAmigo=[]; removerLocal('ef_motorista_telefone'); removerLocal('ef_motorista_disponivel'); render(); }
async function atualizarDisponibilidadeDB(telefone, disponivel){
  const agora = Date.now();
  const payload = { disponivel, disponivel_atualizado_em: agora };
  // Ao entrar online, grava a posição capturada no MESMO update do status.
  // Assim nunca aparece "online" no resumo sem existir coordenada para o mapa.
  if(disponivel && ultimaPosicaoMotorista){
    payload.lat_atual = ultimaPosicaoMotorista.lat;
    payload.lng_atual = ultimaPosicaoMotorista.lon;
    payload.lat_atualizado_em = agora;
  }
  const { error } = await sb.from('entrega_motoristas').update(payload).eq('telefone', telefone);
  return !error;
}

let intervaloHeartbeatMotoristaPresenca = null;
async function heartbeatMotoristaPresenca(){
  const m=estado.motorista;
  if(!m?.ativo || !m.telefone || !m.disponivel || m.status!=='aprovado') return;
  const agora=Date.now();
  const payload={ disponivel_atualizado_em: agora };
  if(ultimaPosicaoMotorista){
    payload.lat_atual=ultimaPosicaoMotorista.lat;
    payload.lng_atual=ultimaPosicaoMotorista.lon;
    payload.lat_atualizado_em=agora;
  }
  try{
    const { error } = await sb.from('entrega_motoristas').update(payload).eq('telefone',m.telefone).eq('disponivel',true);
    if(!error) m.disponivel_atualizado_em=agora;
  }catch(e){ console.warn('heartbeat motorista',e); }
}
function iniciarHeartbeatMotoristaPresenca(){
  if(intervaloHeartbeatMotoristaPresenca) return;
  intervaloHeartbeatMotoristaPresenca=setInterval(heartbeatMotoristaPresenca,45000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') heartbeatMotoristaPresenca(); });
  window.addEventListener('focus',()=>heartbeatMotoristaPresenca());
}
iniciarHeartbeatMotoristaPresenca();

async function alternarDisponibilidade(){
  const m = estado.motorista;
  const temAtivos = estado.pedidos.some(p=>!['buscando','entregue','cancelado'].includes(p.status) && p.motoristaTelefone===m.telefone);
  if(m.disponivel && temAtivos){ mostrarToast('Termina a entrega em curso antes de ficar indisponível.'); return; }
  const novoValor = !m.disponivel;
  if(novoValor){
    if(m.status!=='aprovado'){
      mostrarToast('Seu cadastro precisa estar aprovado para iniciar rota e receber pedidos.', 'erro');
      return;
    }
    if(!(await exigirLocalizacaoOperacional('motorista'))) return;
    if(!ultimaPosicaoMotorista){
      mostrarToast('Não consegui obter sua posição para aparecer no mapa. Ative o GPS e tente novamente.', 'erro');
      return;
    }
  }
  const ok = await atualizarDisponibilidadeDB(m.telefone, novoValor);
  if(!ok){ mostrarErro('Não consegui atualizar seu status. Verifica sua internet e tenta de novo.'); return; }
  m.disponivel = novoValor;
  salvarLocal('ef_motorista_disponivel', m.disponivel ? 'true' : 'false');
  if(m.disponivel){
    iniciarRastreioMotorista();
    // redundância intencional: confirma imediatamente a coordenada no banco,
    // além do watchPosition que continuará atualizando enquanto estiver online.
    await enviarPosicaoMotorista();
    mostrarToast('Rota iniciada! Você já aparece no mapa e está recebendo pedidos.', 'sucesso');
    // aproveita o momento em que ele mais precisa de avisos pra pedir notificação, se ainda não tiver decidido
    if(typeof Notification!=='undefined' && Notification.permission==='default') setTimeout(()=>pedirPermissaoNotificacao(), 600);
  }
  else { pararRastreioMotorista(); mostrarToast('Ficaste indisponível. Não vai receber novos pedidos.'); }
  render();
}

// ---------- motorista amigo (SOS) ----------
// botão SOS flutuante (visível em todas as telas do motorista Pro): acha a entrega
// em andamento e abre direto o chamado; se houver mais de uma, pergunta qual.
function abrirSOSFlutuante(){
  const ativos = estado.pedidos.filter(p=>p.motoristaTelefone===estado.motorista.telefone && p.iniciadoEm && ['indo_coletar','coletado','a_caminho'].includes(p.status));
  if(ativos.length===0){ mostrarToast('Você só pode chamar um motorista amigo durante uma entrega em andamento.'); return; }
  // se houver mais de uma entrega ativa, chama ajuda pra mais recente (a que provavelmente está em mãos agora)
  const escolhida = ativos.sort((a,b)=>b.iniciadoEm-a.iniciadoEm)[0];
  abrirChamadoAmigo(escolhida.id);
}
function abrirChamadoAmigo(pedidoId){
  estado.chamadoAmigoModal = { aberto:true, pedidoId, percentual:10, enviando:false, erro:'' };
  render();
}
function fecharChamadoAmigo(){
  estado.chamadoAmigoModal.aberto = false;
  render();
}
async function enviarChamadoAmigo(){
  const cm = estado.chamadoAmigoModal;
  const m = estado.motorista;
  const p = estado.pedidos.find(x=>x.id===cm.pedidoId);
  if(!p){ cm.erro='Não encontrei esta entrega. Fecha e tenta de novo.'; render(); return; }
  cm.erro=''; cm.enviando=true; render();
  const agora = Date.now();
  const id = 'chm'+agora+Math.floor(Math.random()*1000);
  const { error } = await sb.from('entrega_chamados_amigo').insert({
    id, pedido_id: p.id, motorista_solicitante: m.telefone, motorista_solicitante_nome: m.nome,
    percentual_solicitante: cm.percentual, veiculo_tipo: p.veiculo,
    lat: ultimaPosicaoMotorista?ultimaPosicaoMotorista.lat:null, lng: ultimaPosicaoMotorista?ultimaPosicaoMotorista.lon:null,
    status:'aberto', criado_em: agora
  });
  cm.enviando=false;
  if(error){ console.error(error); cm.erro='Erro ao enviar o chamado. Tenta de novo.'; render(); return; }
  registrarAlertaAdmin('chamado_motorista_amigo', `${m.nome||'Um motorista'} (${m.telefone||''}) informou: veículo quebrado / precisa de ajuda para concluir a corrida.`, p.id);
  enviarPushServidor('motorista', null, ' MOTORISTA PRECISA DE AJUDA', `${m.nome||'Um motorista'} está com o veículo quebrado e precisa de outro motorista para ajudar. Abra o app para ver o chamado.`);
  // O cliente é informado, mas sem receber o SOS interno dos motoristas.
  avisarClienteOcorrenciaEntrega(p, 'ocorrencia');
  cm.aberto=false;
  mostrarToast(' Chamado enviado! Assim que outro motorista aceitar, avisamos aqui.', 'sucesso');
  await carregarChamadosAmigo();
}
async function cancelarChamadoAmigo(id){
  const { error } = await sb.from('entrega_chamados_amigo').update({ status:'cancelado' }).eq('id', id).eq('status','aberto');
  if(error){ console.error(error); mostrarToast('Erro ao cancelar o chamado.', 'erro'); return; }
  mostrarToast('Chamado cancelado.');
  await carregarChamadosAmigo();
}
async function ajudarChamadoAmigo(id){
  const m = estado.motorista;
  const chamado = (estado.chamadosAmigo||[]).find(c=>c.id===id);
  const pedidoAntes = chamado ? estado.pedidos.find(p=>p.id===chamado.pedido_id) : null;
  if(!(await confirmarAcao('Vais assumir esta entrega e receber a parte combinada. Confirmar que vais ajudar?'))) return;
  const { data, error } = await sb.rpc('entrega_aceitar_chamado_amigo', {
    p_chamado_id: id, p_ajudante_telefone: m.telefone, p_ajudante_nome: m.nome, p_ajudante_veiculo_tipo: m.veiculo,
    p_ajudante_marca: m.marca, p_ajudante_cor: m.cor, p_ajudante_placa: m.placa, p_ajudante_foto_url: m.fotoMotoristaUrl,
    p_ajudante_nota_media: m.notaMedia, p_ajudante_total_avaliacoes: m.totalAvaliacoes
  });
  if(error){ console.error(error); mostrarToast('Erro ao assumir a entrega.', 'erro'); return; }
  if(!data){ mostrarToast('Esse chamado já foi assumido por outro motorista.'); await carregarChamadosAmigo(); return; }
  if(chamado && chamado.motorista_solicitante){
    enviarPushServidor('motorista', chamado.motorista_solicitante, ' Ajuda aceita', `${m.nome||'Outro motorista'} aceitou ajudar na entrega.`);
  }
  if(pedidoAntes) avisarClienteOcorrenciaEntrega(pedidoAntes, 'assumida');
  mostrarToast('Entrega assumida! Já está na tua lista "Em curso".', 'sucesso');
  estado.ultimoPedidosJSON='';
  iniciarRastreioMotorista();
  await carregarPedidos();
  await carregarChamadosAmigo();
}

async function hashSenha(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

const FACE_MODELS_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
let faceModelsReady = false;
let faceModelsLoading = null;

function fecharModalFacial(){
  const el=document.getElementById('ef-face-modal');
  if(el) el.remove();
}
async function carregarModelosFaciais(){
  if(faceModelsReady) return true;
  if(faceModelsLoading) return faceModelsLoading;
  faceModelsLoading=(async()=>{
    const limite=Date.now()+12000;
    while(typeof faceapi==='undefined' && Date.now()<limite) await new Promise(r=>setTimeout(r,150));
    if(typeof faceapi==='undefined') throw new Error('Biblioteca facial não carregou. Verifique sua internet.');
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS_URL)
    ]);
    faceModelsReady=true; return true;
  })().catch(e=>{ faceModelsLoading=null; throw e; });
  return faceModelsLoading;
}

function mediaPonto(arr){ return {x:arr.reduce((a,p)=>a+p.x,0)/arr.length,y:arr.reduce((a,p)=>a+p.y,0)/arr.length}; }
function metricasRosto(det){
  const pts=det.landmarks.positions, box=det.detection.box;
  const nariz=pts[30], olhos=mediaPonto(pts.slice(36,48));
  return { nx:(nariz.x-box.x)/box.width, ny:(nariz.y-box.y)/box.height, eyeY:(olhos.y-box.y)/box.height, w:box.width, h:box.height };
}
function distanciaDescritores(a,b){
  if(!Array.isArray(a)||!a.length||!b||a.length!==b.length) return 99;
  let s=0; for(let i=0;i<a.length;i++){ const d=Number(a[i])-Number(b[i]); s+=d*d; } return Math.sqrt(s);
}
async function fluxoFacial({tipo,telefone,modo='cadastro',descriptorSalvo=null}){
  const modal=criarModalFacial(modo==='cadastro'?'Cadastre seu rosto':'Confirme que é você', modo==='cadastro'?'Senha + biometria facial':'Faça os movimentos para liberar o acesso');
  const video=modal.querySelector('#ef-face-video'), instr=modal.querySelector('#ef-face-instrucao'), status=modal.querySelector('#ef-face-status'), prog=modal.querySelector('#ef-face-progress'), arrow=modal.querySelector('#ef-face-arrow');
  let stream=null, cancelado=false; modal.querySelector('#ef-face-cancel').onclick=()=>{cancelado=true; if(stream) stream.getTracks().forEach(t=>t.stop()); fecharModalFacial();};
  try{
    instr.textContent='Carregando validação facial…';
    await carregarModelosFaciais(); if(cancelado) return {ok:false,cancelado:true};
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:720}},audio:false});
    video.srcObject=stream; await video.play();
    const opts=new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.55});
    let base=null, ultimaDet=null;
    const etapas=[
      {txt:'Posicione o rosto',ico:'',ok:m=>!!m,tempo:900},
      {txt:'Vire para a esquerda',ico:'←',ok:m=>base && Math.abs(m.nx-base.nx)>.055,tempo:650},
      {txt:'Olhe para cima',ico:'↑',ok:m=>base && (m.ny-base.ny)<-.035,tempo:650},
      {txt:'Volte ao centro',ico:'',ok:m=>base && Math.abs(m.nx-base.nx)<.055,tempo:700}
    ];
    for(let ei=0;ei<etapas.length;ei++){
      const e=etapas[ei]; instr.textContent=e.txt; arrow.textContent=e.ico; prog.style.width=((ei/etapas.length)*100)+'%';
      let iniciou=0, limite=Date.now()+15000;
      while(Date.now()<limite){
        if(cancelado) return {ok:false,cancelado:true};
        const det=await faceapi.detectSingleFace(video,opts).withFaceLandmarks().withFaceDescriptor();
        if(det){ ultimaDet=det; const m=metricasRosto(det); if(ei===0 && !base) base=m;
          if(e.ok(m)){ if(!iniciou) iniciou=Date.now(); if(Date.now()-iniciou>=e.tempo) break; } else iniciou=0;
          status.textContent='Rosto detectado • siga o movimento mostrado.';
        } else { iniciou=0; status.textContent='Não encontrei seu rosto. Centralize-o no círculo e melhore a iluminação.'; }
        await new Promise(r=>setTimeout(r,130));
      }
      if(Date.now()>=limite) throw new Error('Não consegui confirmar o movimento. Tente novamente com o rosto centralizado.');
    }
    prog.style.width='100%'; instr.textContent='Validando rosto…'; arrow.textContent='';
    const finalDet=await faceapi.detectSingleFace(video,opts).withFaceLandmarks().withFaceDescriptor();
    if(!finalDet) throw new Error('Não consegui capturar o rosto no final. Tente novamente.');
    const desc=Array.from(finalDet.descriptor).map(n=>Number(n.toFixed(7)));
    if(modo==='login'){
      const distancia=distanciaDescritores(descriptorSalvo,desc);
      if(distancia>.58) throw new Error('O rosto não corresponde ao cadastro desta conta.');
    } else {
      const tabela=tipo==='motorista'?'entrega_motoristas':'entrega_clientes';
      const {error}=await sb.from(tabela).update({face_descriptor:desc,facial_ativa:true,facial_cadastrada_em:Date.now()}).eq('telefone',telefone);
      if(error) throw new Error('Não consegui salvar a biometria facial. '+(error.message||''));
    }
    status.textContent='Identidade confirmada com sucesso.'; await new Promise(r=>setTimeout(r,450));
    return {ok:true,descriptor:desc};
  }catch(e){
    console.error('Biometria facial:',e); instr.textContent='Não foi possível validar'; status.textContent=e.message||'Tente novamente.'; arrow.textContent='!'; await new Promise(r=>setTimeout(r,1400)); return {ok:false,erro:e.message||'Falha na biometria facial'};
  }finally{ if(stream) stream.getTracks().forEach(t=>t.stop()); fecharModalFacial(); }
}
async function exigirFacialDaConta(tipo,data){
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('Este aparelho/navegador não permite usar a câmera.');
  if(data.facial_ativa && Array.isArray(data.face_descriptor) && data.face_descriptor.length){
    return await fluxoFacial({tipo,telefone:data.telefone,modo:'login',descriptorSalvo:data.face_descriptor});
  }
  return await fluxoFacial({tipo,telefone:data.telefone,modo:'cadastro'});
}

async function cadastrarCliente(){
  const c = estado.painelCliente.cadastro;
  c.nome = document.getElementById('cc-nome')?.value.trim() || c.nome || '';
  c.telefone = (document.getElementById('cc-telefone')?.value || c.telefone || '').replace(/\D/g,'');
  c.senha = document.getElementById('cc-senha')?.value || c.senha || '';

  if(!c.nome||!c.telefone||!c.senha){ c.erro='Preenche todos os campos.'; render(); return; }
  if(c.senha.length<4){ c.erro='A senha precisa de pelo menos 4 caracteres.'; render(); return; }
  c.erro='';

  try{
    const senhaHash = await hashSenha(c.senha);
    const { data, error } = await sb.rpc('entrega_cliente_cadastrar_ou_retomar', {
      p_telefone: c.telefone,
      p_nome: c.nome,
      p_senha_hash: senhaHash
    });

    if(error){
      console.error('Cadastro cliente RPC:', error);
      const msg = String(error.message||'');
      if(msg.includes('telefone_ja_cadastrado') || msg.includes('conta completa') || msg.includes('já tem uma conta')){
        c.erro='Este telefone já tem uma conta. Entre com sua senha.';
      }else{
        c.erro='Não consegui concluir o cadastro agora. Tente novamente.';
      }
      render();
      return;
    }

    const confirmado = Array.isArray(data) ? data[0] : data;
    if(!confirmado || !confirmado.telefone){
      c.erro='Cadastro não confirmado pelo servidor. Tente novamente.';
      render();
      return;
    }

    registrarConversaoMetaCadastro('cliente', confirmado.telefone);
    registrarAlertaAdmin('novo_cliente', `Novo cliente cadastrado: ${c.nome} (${c.telefone}).`);
    estado.cliente={nome:confirmado.nome||c.nome,telefone:confirmado.telefone,logado:true,carteira:{saldo:0,carregando:false,adicionando:false,valorInput:'10',pix:{qrCode:null,copiaCola:null,status:'pendente',gerando:false,erro:'',id:null}}};
    estado.filtroTelefoneCliente=confirmado.telefone; estado.form.nome=confirmado.nome||c.nome; estado.form.telefone=confirmado.telefone; estado.ultimoPedidosJSON='';
    salvarLocal('ef_cliente_telefone',confirmado.telefone); salvarLocal('ef_modo','cliente'); atualizarPresencaSite('cliente');
    clienteBemVindoAnimando=true; render();
    await carregarPedidos(); await carregarCarteiraCliente(); assinarCarteiraClienteRealtime(confirmado.telefone);
    if(estado.notificacoesStatus==='granted') inscreverPushReal(); else if(typeof Notification!=='undefined' && Notification.permission==='default') setTimeout(()=>pedirPermissaoNotificacao(),1200);
    setTimeout(()=>{clienteBemVindoAnimando=false;render();},4000);
  }catch(e){
    console.error('Cadastro cliente:',e);
    c.erro='Falha de conexão ao cadastrar. Tente novamente.';
    render();
  }
}
