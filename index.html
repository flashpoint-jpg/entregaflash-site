async function carregarClientesAdmin(){
  estado.admin.carregando=true; render();
  const { data, error } = await sb.from('entrega_clientes').select('*').order('criado_em',{ascending:false});
  if(error){ estado.admin.carregando=false; console.error(error); mostrarToast('Erro ao carregar clientes.', 'erro'); return; }
  const { data: saldos, error: erroSaldos } = await sb.from('entrega_clientes_saldos').select('telefone,saldo');
  estado.admin.carregando=false;
  if(erroSaldos) console.error(erroSaldos);
  const saldoPorTelefone = {};
  (saldos||[]).forEach(s=>{ saldoPorTelefone[s.telefone] = Number(s.saldo)||0; });
  estado.admin.clientes = (data||[]).map(c=>({ ...c, saldo: saldoPorTelefone[c.telefone]||0 }));
  render();
}
function filtrarPedidosAdmin(){
  const a = estado.admin;
  const busca = (a.buscaPedidos||'').trim().toLowerCase();
  return (a.todosPedidos||[]).filter(p=>{
    if(a.filtroPedidos!=='todos' && p.status!==a.filtroPedidos) return false;
    if(!busca) return true;
    return (p.cliente_nome||'').toLowerCase().includes(busca) || (p.cliente_telefone||'').includes(busca)
      || (p.motorista_nome||'').toLowerCase().includes(busca) || (p.motorista_telefone||'').includes(busca) || (p.id||'').includes(busca);
  });
}

function fluxoFinanceiroAdminHTML(){
  const a = estado.admin;
  const pedidos = a.todosPedidos.length ? a.todosPedidos : null;
  if(!pedidos){
    return `<div class="admin-cartao"><b style="font-family:'Rajdhani';font-weight:700;font-size:14px;text-transform:uppercase">💵 Fluxo de entrada e saída</b><div class="subtitulo" style="margin-top:8px;margin-bottom:0">Abre a aba "📦 Pedidos" pelo menos uma vez para carregar os números completos aqui.</div></div>`;
  }
  const entregues = pedidos.filter(p=>p.status==='entregue');
  const cancelados = pedidos.filter(p=>p.status==='cancelado');
  const ativos = pedidos.filter(p=>!['entregue','cancelado'].includes(p.status));
  const entradaBruta = entregues.reduce((s,p)=>s+(Number(p.preco)||0),0);
  const entradaTaxasCancelamento = cancelados.reduce((s,p)=>s+(Number(p.taxa_cancelamento)||0),0);
  const planoPorTelefone = {}; a.motoristas.forEach(m=>{ planoPorTelefone[m.telefone]=m.plano; });
  const saidaMotoristas = entregues.reduce((s,p)=>{
    const plano = PLANOS[planoPorTelefone[p.motorista_telefone]] || PLANOS.free;
    return s + (Number(p.preco)||0) * (1-plano.taxaPlataforma);
  },0);
  const saquesPagos = (a.saques||[]).filter(s=>s.status==='pago').reduce((s,x)=>s+Number(x.valor||0),0);
  const saquesPendentes = (a.saques||[]).filter(s=>s.status==='pendente').reduce((s,x)=>s+Number(x.valor||0),0);
  return `
  <div class="admin-cartao">
    <b style="font-family:'Rajdhani';font-weight:700;font-size:14px;text-transform:uppercase">💵 Fluxo de entrada e saída (${pedidos.length} pedidos carregados)</b>

    <div class="am-linha"><span>🚫 Cancelados</span><b>${cancelados.length}</b></div>

    <div class="am-linha"><span style="color:var(--verde)">▲ Entrada — taxas de cancelamento</span><b style="color:var(--verde)">R$ ${entradaTaxasCancelamento.toFixed(2)}</b></div>
    <div class="am-linha"><span style="color:var(--chama)">▼ Saída — repasse aos motoristas</span><b style="color:var(--chama)">R$ ${saidaMotoristas.toFixed(2)}</b></div>

async function trocarSenhaAdminPainel(){
  const atual = document.getElementById('cfg-senha-atual')?.value||'';
  const nova = document.getElementById('cfg-senha-nova')?.value||'';
  if(!atual || !nova){ mostrarToast('Preenche a senha atual e a nova.'); return; }
  if(nova.length<6){ mostrarToast('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
  const { data, error } = await sb.rpc('entrega_admin_trocar_senha', { p_senha_atual: atual, p_senha_nova: nova });
  if(error){ console.error(error); mostrarToast('Erro ao trocar a senha.', 'erro'); return; }
  if(!data){ mostrarToast('Senha atual incorreta.', 'erro'); return; }
  estado.admin.senhaDigitada = nova;
  mostrarToast('Senha trocada com sucesso!', 'sucesso');
  render();
}

function alternarEdicaoPedidoAdmin(id){
  estado.admin.pedidoEditando = estado.admin.pedidoEditando===id ? null : id;

}
async function salvarEdicaoPedidoAdmin(id){
  const nome = document.getElementById('edit-pedido-nome-'+id)?.value.trim();
  const telefoneCliente = document.getElementById('edit-pedido-tel-cliente-'+id)?.value.trim();
  const origem = document.getElementById('edit-pedido-origem-'+id)?.value.trim();
  const destino = document.getElementById('edit-pedido-destino-'+id)?.value.trim();
  const motoristaNome = document.getElementById('edit-pedido-motorista-nome-'+id)?.value.trim();
  const motoristaTel = document.getElementById('edit-pedido-motorista-tel-'+id)?.value.trim();
  const preco = Number(document.getElementById('edit-pedido-preco-'+id)?.value);
  const status = document.getElementById('edit-pedido-status-'+id)?.value;
  if(!origem || !destino){ mostrarToast('Preenche os endereços de recolha e entrega.'); return; }
  const { error } = await sb.rpc('entrega_admin_editar_pedido', {
    p_senha: estado.admin.senhaDigitada, p_id: id,
    p_cliente_nome: nome, p_cliente_telefone: telefoneCliente, p_origem: origem, p_destino: destino,
    p_motorista_nome: motoristaNome || null, p_motorista_telefone: motoristaTel || null,
    p_preco: Number.isNaN(preco) ? 0 : preco, p_status: status
  });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao salvar: '+(error.message||''), 'erro'); return; }
  mostrarToast('Pedido atualizado!', 'sucesso');
  estado.admin.pedidoEditando = null;
  await carregarTodosPedidosAdmin();
}
async function excluirPedidoAdmin(id, nome){
  if(!(await confirmarAcao(`Excluir definitivamente o pedido de ${nome||'cliente'}? Essa ação não pode ser desfeita.`, 'Excluir'))) return;
  const { error } = await sb.rpc('entrega_admin_deletar_pedido', { p_senha: estado.admin.senhaDigitada, p_id: id });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao excluir: '+(error.message||''), 'erro'); return; }
  mostrarToast('Pedido excluído.', 'sucesso');
  await carregarTodosPedidosAdmin();
}

  if(a.carregando) return `<div class="subtitulo">A carregar clientes...</div>`;

    const entreguesCliente = pedidosCliente.filter(p=>p.status==='entregue');
    const gastoTotal = entreguesCliente.reduce((s,p)=>s+(Number(p.preco)||0),0);
    const idc = String(c.telefone).replace(/\D/g,'');
    return `
    <div class="admin-cartao">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>${c.nome}</b>
        ${c.bloqueado ? `<span class="selo selo-cancelado">bloqueado</span>` : ''}
      </div>
      <div class="am-linha"><span>Telefone</span><b>${c.telefone}</b></div>
      <div class="am-linha"><span>Cadastrado em</span><b>${c.criado_em?new Date(Number(c.criado_em)).toLocaleDateString('pt-BR'):'—'}</b></div>
      <div class="am-linha"><span>Pedidos feitos</span><b>${pedidosCliente.length}</b></div>
      <div class="am-linha"><span>Entregues</span><b>${entreguesCliente.length}</b></div>
      <div class="am-linha"><span>Total gasto (entregues)</span><b style="color:var(--verde)">R$ ${gastoTotal.toFixed(2)}</b></div>
      <div class="am-linha"><span>💰 Saldo na carteira</span><b style="color:var(--mango)">R$ ${Number(c.saldo||0).toFixed(2)}</b></div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--linha)">
        <label style="display:flex;align-items:center;gap:6px;margin:0 0 8px;cursor:pointer">
          <input type="checkbox" id="bonus-cliente-${idc}" style="width:auto">
          Incluir aviso de bônus na mensagem
        </label>
        <button class="btn btn-verde btn-pequeno" style="width:100%" onclick="enviarBoasVindasWhatsApp('${c.telefone}','${(c.nome||'').replace(/'/g,"\\'")}','${idc}')">💬 Enviar boas-vindas no WhatsApp</button>
      </div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--linha)">
        <label style="margin:0 0 6px">Creditar saldo na carteira (R$, use negativo pra debitar)</label>
        <div style="display:flex;gap:8px">
          <input type="number" id="ajuste-saldo-cliente-${idc}" placeholder="Ex: 20 ou -20" step="0.01" style="flex:1">
          <button class="btn btn-secundario btn-pequeno" ${atributoDesabilitado('ajustarSaldo_'+c.telefone)} onclick="dispararAjusteSaldoCliente('${c.telefone}','${idc}')">${rotuloCarregando('ajustarSaldo_'+c.telefone,'Aplicar','Aplicando...')}</button>
        </div>
      </div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--linha)">
        <b style="font-family:'Rajdhani';font-weight:700;font-size:12.5px;text-transform:uppercase">🔧 Gerenciar cadastro</b>
        ${estado.admin.clienteEditando===c.telefone ? `
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">
          <div><label style="margin:0 0 4px">Nome</label><input type="text" id="edit-nome-cliente-${idc}" value="${(c.nome||'').replace(/"/g,'&quot;')}"></div>
          <div><label style="margin:0 0 4px">Telefone (usuário de login)</label><input type="text" id="edit-telefone-cliente-${idc}" value="${(c.telefone||'').replace(/"/g,'&quot;')}"></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-verde btn-pequeno" style="flex:1" ${atributoDesabilitado('salvarCliente_'+c.telefone)} onclick="executarComCarregando('salvarCliente_${c.telefone}', ()=>salvarEdicaoClienteAdmin('${c.telefone}'))">${rotuloCarregando('salvarCliente_'+c.telefone,'💾 Salvar','Salvando...')}</button>
            <button class="btn btn-secundario btn-pequeno" style="flex:1" onclick="alternarEdicaoClienteAdmin('${c.telefone}')">Cancelar</button>
          </div>
        </div>` : `
        <button class="btn btn-secundario btn-pequeno" style="margin-top:8px;width:100%" onclick="alternarEdicaoClienteAdmin('${c.telefone}')">✏️ Editar nome / telefone</button>`}
        <div style="margin-top:8px;display:flex;gap:8px">

          <button class="btn btn-secundario btn-pequeno" ${atributoDesabilitado('senhaCliente_'+c.telefone)} onclick="executarComCarregando('senhaCliente_${c.telefone}', ()=>alterarSenhaClienteAdmin('${c.telefone}', document.getElementById('nova-senha-cliente-${idc}').value))">${rotuloCarregando('senhaCliente_'+c.telefone,'🔑 Trocar senha','Trocando...')}</button>

            ? `<button class="btn btn-verde btn-pequeno" style="flex:1" ${atributoDesabilitado('desbloquearCliente_'+c.telefone)} onclick="executarComCarregando('desbloquearCliente_${c.telefone}', ()=>desbloquearClienteAdmin('${c.telefone}'))">${rotuloCarregando('desbloquearCliente_'+c.telefone,'🔓 Desbloquear','Desbloqueando...')}</button>`
            : `<button class="btn btn-secundario btn-pequeno" style="flex:1" ${atributoDesabilitado('bloquearCliente_'+c.telefone)} onclick="executarComCarregando('bloquearCliente_${c.telefone}', ()=>bloquearClienteAdmin('${c.telefone}'))">${rotuloCarregando('bloquearCliente_'+c.telefone,'🔒 Bloquear','Bloqueando...')}</button>`}

        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function alternarEdicaoClienteAdmin(telefone){
  estado.admin.clienteEditando = estado.admin.clienteEditando===telefone ? null : telefone;
  render();
}
async function salvarEdicaoClienteAdmin(telefoneAtual){
  const idc = String(telefoneAtual).replace(/\D/g,'');
  const nome = document.getElementById('edit-nome-cliente-'+idc)?.value.trim();
  const telefone = document.getElementById('edit-telefone-cliente-'+idc)?.value.trim();
  if(!nome || !telefone){ mostrarToast('Preenche nome e telefone.'); return; }
  const { error } = await sb.rpc('entrega_admin_editar_cliente', { p_senha: estado.admin.senhaDigitada, p_telefone_atual: telefoneAtual, p_nome: nome, p_telefone_novo: telefone });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao salvar: '+(error.message||''), 'erro'); return; }
  mostrarToast('Cadastro atualizado!', 'sucesso');
  estado.admin.clienteEditando = null;
  await carregarClientesAdmin();
}
async function alterarSenhaClienteAdmin(telefone, novaSenha){
  const idc = String(telefone).replace(/\D/g,'');
  if(!novaSenha || novaSenha.length<4){ mostrarToast('Digita uma senha com pelo menos 4 caracteres.'); return; }
  const senhaHash = await hashSenha(novaSenha);
  const { error } = await sb.rpc('entrega_admin_trocar_senha_cliente', { p_senha: estado.admin.senhaDigitada, p_telefone: telefone, p_senha_hash_nova: senhaHash });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao trocar a senha: '+(error.message||''), 'erro'); return; }
  mostrarToast('Senha alterada com sucesso!', 'sucesso');
  const input = document.getElementById('nova-senha-cliente-'+idc);
  if(input) input.value='';
}
async function bloquearClienteAdmin(telefone){
  if(!(await confirmarAcao('Bloquear este cliente? Ele não vai conseguir entrar na conta até ser desbloqueado.', 'Bloquear'))) return;
  const { error } = await sb.rpc('entrega_admin_bloquear_cliente', { p_senha: estado.admin.senhaDigitada, p_telefone: telefone, p_bloquear: true });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao bloquear: '+(error.message||''), 'erro'); return; }
  mostrarToast('Cliente bloqueado.', 'sucesso');
  await carregarClientesAdmin();
}
async function desbloquearClienteAdmin(telefone){
  const { error } = await sb.rpc('entrega_admin_bloquear_cliente', { p_senha: estado.admin.senhaDigitada, p_telefone: telefone, p_bloquear: false });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao desbloquear: '+(error.message||''), 'erro'); return; }
  mostrarToast('Cliente desbloqueado.', 'sucesso');
  await carregarClientesAdmin();
}
async function excluirClienteAdmin(telefone, nome){
  if(!(await confirmarAcao(`Excluir definitivamente a conta de ${nome}? Essa ação apaga o cliente do sistema e não pode ser desfeita.`, 'Excluir'))) return;
  const { error } = await sb.rpc('entrega_admin_deletar_cliente', { p_senha: estado.admin.senhaDigitada, p_telefone: telefone });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao excluir: '+(error.message||''), 'erro'); return; }
  mostrarToast('Cliente excluído.', 'sucesso');
  await carregarClientesAdmin();
}

function adminAbaMotoristasHTML(){
  const a = estado.admin;
  if(a.carregando) return `<div class="subtitulo">A carregar cadastros...</div>`;
  if(a.motoristas.length===0) return `<div class="vazio"><span class="emoji-grande">🛵</span>Nenhum cadastro de entregador ainda.</div>`;
  const emRotaPorTelefone = {};
  (a.todosPedidos||[]).forEach(p=>{
    if(p.motorista_telefone && ['indo_coletar','coletado','a_caminho'].includes(p.status)) emRotaPorTelefone[p.motorista_telefone] = true;
  });
  const cardHTML = (m)=>motoristaCardHTML(m, !!emRotaPorTelefone[m.telefone]);
  const basicos = a.motoristas.filter(m=>m.status==='basico');
  const pendentes = a.motoristas.filter(m=>m.status==='pendente');
  return `
    ${basicos.length>0 ? `<div style="margin:4px 0 10px"><b style="font-family:'Rajdhani';font-weight:700;font-size:15px;text-transform:uppercase">📝 Cadastro básico — liberar documentos (${basicos.length})</b></div>
    <div class="admin-grade-cartoes">${basicos.map(cardHTML).join('')}</div>` : ''}
    <div style="margin:${basicos.length>0?'18px':'4px'} 0 10px"><b style="font-family:'Rajdhani';font-weight:700;font-size:15px;text-transform:uppercase">📋 Pendentes de aprovação final${pendentes.length?` (${pendentes.length})`:''}</b></div>
    ${pendentes.length===0 ? `<div class="subtitulo">Nenhum cadastro pendente.</div>` : `<div class="admin-grade-cartoes">${pendentes.map(cardHTML).join('')}</div>`}
    <div style="margin:18px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <b style="font-family:'Rajdhani';font-weight:700;font-size:15px;text-transform:uppercase">👥 Gerenciar motoristas (${a.motoristas.length})</b>
      <button class="btn btn-primario btn-pequeno" style="margin-top:0" onclick="divulgarNovoLinkParaMotoristas()">📢 Divulgar novo link</button>
    </div>
    <div class="admin-grade-cartoes">${a.motoristas.map(cardHTML).join('')}</div>`;
}

// Dispara no WhatsApp, um por um, uma mensagem pré-definida avisando os motoristas
// cadastrados sobre o novo endereço (link) do site/app.
function divulgarNovoLinkParaMotoristas(){
  const linkAntigo = 'https://flashcred-sistema.onrender.com';
  const linkNovo = 'https://entregaflash.app.br';
  const motoristas = (estado.admin.motoristas||[]).filter(m=>m.telefone);
  if(motoristas.length===0){ mostrarToast('Nenhum motorista cadastrado para avisar.', 'erro'); return; }

  const montarMensagem = (nome)=>`🚀 *Entrega Flash - Novo endereço do app!*

Fala${nome?`, ${nome}`:''}! Mudamos de casa 📦

O link antigo (${linkAntigo}) não vai funcionar mais.

A partir de agora, use este novo link:
👉 ${linkNovo}

Se você já tinha instalado o app antigo, é só:
1️⃣ Apagar o atalho antigo da tela
2️⃣ Abrir o link novo no navegador
3️⃣ Tocar em "Adicionar à tela inicial"

Qualquer dúvida, chama aqui! 🙌`;

  estado.admin.divulgacaoLink = {
    aberto: true,
    lista: motoristas.map(m=>({
      nome: m.nome||'',
      telefone: m.telefone,
      url: `https://wa.me/${(m.telefone||'').replace(/\D/g,'')}?text=${encodeURIComponent(montarMensagem(m.nome))}`,
      enviado: false
    }))
  };
  render();
}
function fecharDivulgacaoLink(){ estado.admin.divulgacaoLink = { aberto:false, lista:[] }; render(); }
function marcarDivulgacaoEnviada(telefone){
  const item = (estado.admin.divulgacaoLink?.lista||[]).find(x=>x.telefone===telefone);
  if(item) item.enviado = true;
  render();
}

  const d = estado.admin.divulgacaoLink;

  return `
  <div class="modal-fundo" onclick="if(event.target===this) fecharDivulgacaoLink()">
    <div class="modal-caixa">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <b style="font-family:'Rajdhani';font-weight:700;font-size:16px;text-transform:uppercase">📢 Divulgar novo link (${pendentes} pendente${pendentes===1?'':'s'})</b>
        <button class="btn btn-pequeno" onclick="fecharDivulgacaoLink()">✕</button>
      </div>
      <div class="subtitulo" style="margin-bottom:10px">Toca em "Enviar" pra abrir o WhatsApp já com a mensagem pronta para cada motorista.</div>
      <div style="max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px">
        ${d.lista.map(item=>`
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border-radius:10px;background:${item.enviado?'rgba(0,200,120,0.12)':'rgba(255,255,255,0.04)'}">
            <div style="min-width:0">
              <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.nome||'(sem nome)'}</div>
              <div style="font-size:12px;color:var(--poeira)">${item.telefone}</div>

            <a href="${item.url}" target="_blank" class="btn ${item.enviado?'':'btn-primario'} btn-pequeno" style="margin-top:0;white-space:nowrap" onclick="marcarDivulgacaoEnviada('${item.telefone}')">${item.enviado?'✅ Enviado':'Enviar'}</a>

}

async function atualizarPainelAdmin(){
  await Promise.all([carregarMotoristasAdmin(), carregarPedidosEntreguesAdmin(), carregarSaquesAdmin(), carregarTodosPedidosAdmin(), carregarClientesAdmin()]);
  await carregarSuporteAdmin();
}
async function ajustarSaldoMotoristaAdmin(telefone){
  const input = document.getElementById('ajuste-saldo-'+telefone.replace(/\D/g,''));
  const valor = input ? Number(input.value) : NaN;
  if(!valor || Number.isNaN(valor)){ mostrarToast('Informa um valor válido (positivo para creditar, negativo para debitar).'); return; }
  const { data: novoSaldo, error } = await sb.rpc('entrega_admin_ajustar_saldo_motorista', { p_senha: estado.admin.senhaDigitada, p_telefone: telefone, p_valor: valor });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao ajustar o saldo.', 'erro'); return; }
  if(input) input.value='';
  mostrarToast(`Saldo ajustado! Novo saldo: R$ ${Number(novoSaldo).toFixed(2)}`, 'sucesso');
  if(estado.motorista.telefone===telefone) estado.motorista.saldo = Number(novoSaldo);
  await carregarMotoristasAdmin();
}
function enviarBoasVindasWhatsAppMotorista(telefone, nome, idm){
  const checkbox = document.getElementById('bonus-motorista-'+idm);
  const comBonus = !!(checkbox && checkbox.checked);
  const primeiroNome = (nome||'').trim().split(' ')[0] || 'tudo bem';
  let msg = `Olá, ${primeiroNome}! 🚀 Muito obrigado por se cadastrar como entregador no Entrega Flash! Seja muito bem-vindo(a), estamos muito felizes em ter você com a gente.`;
  if(comBonus){
    msg += ' Como forma de agradecimento, estamos liberando um bônus especial de boas-vindas pra você! 🎁';
  }
  const numero = '55'+idm;
  window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(msg), '_blank');
}

}
function dispararAjusteSaldoCliente(telefone, idc){
  // lê o valor do input ANTES de disparar o "carregando" (que re-renderiza a tela e apagaria o campo)
  const input = document.getElementById('ajuste-saldo-cliente-'+idc);
  const valor = input ? Number(input.value) : NaN;
  if(!valor || Number.isNaN(valor)){ mostrarToast('Informa um valor válido (positivo para creditar, negativo para debitar).'); return; }
  executarComCarregando('ajustarSaldo_'+telefone, ()=>ajustarSaldoClienteAdmin(telefone, valor));
}
async function ajustarSaldoClienteAdmin(telefone, valor){
  const { data: novoSaldo, error } = await sb.rpc('entrega_admin_ajustar_saldo_cliente', { p_senha: estado.admin.senhaDigitada, p_telefone: telefone, p_valor: valor });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao ajustar o saldo do cliente.', 'erro'); return; }
  mostrarToast(`Saldo do cliente ajustado! Novo saldo: R$ ${Number(novoSaldo).toFixed(2)}`, 'sucesso');
  if(estado.cliente.telefone===telefone) estado.cliente.carteira.saldo = Number(novoSaldo);
  await carregarClientesAdmin();
}

  const { error } = await sb.rpc('entrega_admin_marcar_taxa_pro_paga', { p_senha: estado.admin.senhaDigitada, p_id: id });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao marcar a taxa como paga.', 'erro'); return; }
  mostrarToast('Taxa do plano Pro marcada como paga!', 'sucesso');
  await carregarMotoristasAdmin();
}
async function alterarPlanoMotoristaAdmin(id){
  const select = document.getElementById('alt-plano-'+id);
  const novoPlano = select ? select.value : null;
  if(novoPlano!=='free' && novoPlano!=='pro'){ mostrarToast('Escolha um plano válido.'); return; }
  if(!(await confirmarAcao(`Alterar o plano deste motorista para ${novoPlano==='pro'?'Pro':'Free'}?`))) return;
  const { error } = await sb.rpc('entrega_admin_alterar_plano_motorista', { p_senha: estado.admin.senhaDigitada, p_id: id, p_plano: novoPlano });

async function solicitarSaque(){
  const m = estado.motorista;
  if(m.status!=='aprovado'){
    mostrarToast('Ainda falta enviar os documentos e ser aprovado pelo administrador para poderes sacar.');
    return;
  }
  const { error } = await sb.rpc('entrega_solicitar_saque', { p_telefone: m.telefone, p_nome: m.nome });
  if(error){
    console.error(error);
    if(error.message==='saque_pendente') mostrarToast('Já tem um pedido de saque pendente. Aguarda o pagamento.');
    else if(error.message==='sem_saldo') mostrarToast('Não tem saldo disponível para saque.');
    else mostrarToast('Erro ao pedir o saque. Tenta novamente.', 'erro');
    return;
  }
  registrarAlertaAdmin('saque_solicitado', `${m.nome||'Motorista'} (${m.telefone||''}) solicitou um saque.`);
  mostrarToast('Pedido de saque enviado! Vamos avisar-te por WhatsApp assim que for pago.', 'sucesso');
}

async function testarSaqueAutomatico(){
  if(!(await confirmarAcao('Isso vai rodar o robô de saque automático agora, processando qualquer saque pendente que já venceu o prazo. Continuar?'))) return;
  mostrarToast('Rodando o robô de saque automático...');
  try{
    const { data, error } = await sb.functions.invoke('processar-saques-automaticos');
    if(error){ console.error(error); mostrarToast('Erro ao chamar o robô: '+(error.message||''), 'erro'); return; }
    const total = data?.processados ?? 0;
    if(total===0){
      mostrarToast('Robô rodou, mas não tinha nenhum saque vencido pra processar.', 'sucesso');
    }else{
      const pagos = (data.resultados||[]).filter(r=>r.status==='pago').length;
      const falhas = total - pagos;
      mostrarToast(`Robô processou ${total} saque(s): ${pagos} pago(s), ${falhas} falharam. Veja o console pra detalhes.`, falhas>0 ? 'erro' : 'sucesso');
      console.log('Resultado do robô de saque automático:', data);
    }
  }catch(e){
    console.error(e);
    mostrarToast('Erro inesperado ao chamar o robô.', 'erro');
  }
  await carregarSaquesAdmin();
}
async function marcarSaquePago(id){

let canalAdminRealtime = null;
function assinarAdminRealtime(){
  if(canalAdminRealtime) return;
  canalAdminRealtime = sb.channel('admin-realtime')
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_motoristas'}, ()=>{
      debounce('admin-motoristas', carregarMotoristasAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_pedidos'}, ()=>{
      debounce('admin-pedidos', ()=>{ carregarTodosPedidosAdmin(); carregarPedidosEntreguesAdmin(); });
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_clientes'}, ()=>{
      debounce('admin-clientes', carregarClientesAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_saques'}, ()=>{
      debounce('admin-saques', carregarSaquesAdmin);
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'entrega_alertas_admin'}, (payload)=>{
      const al = payload.new || {};
      const info = INFO_TIPO_ALERTA[al.tipo] || { emoji:'🔔', titulo:'Novo evento no app' };
      mostrarToast(`${info.emoji} ${info.titulo}`);
      notificar(`${info.emoji} ${info.titulo}`, al.mensagem||'', 'alerta-'+al.id);
      debounce('admin-alertas', carregarAlertasAdmin);
    })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'entrega_alertas_admin'}, ()=>{
      debounce('admin-alertas', carregarAlertasAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_suporte'}, ()=>{
      debounce('admin-suporte', carregarSuporteAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_suporte_status'}, ()=>{
      debounce('admin-suporte', carregarSuporteAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_clientes_saldos'}, ()=>{
      debounce('admin-clientes', carregarClientesAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_saldos'}, ()=>{
      debounce('admin-motoristas', carregarMotoristasAdmin);
    })
    .subscribe();
}
function encerrarAdminRealtime(){
  if(canalAdminRealtime){ sb.removeChannel(canalAdminRealtime); canalAdminRealtime=null; }
}
function abrirAdmin(){
  estado.admin.aberto=true; salvarLocal('ef_admin_aberto','true'); render();
  // se a sessão de admin veio de um recarregamento de página, os dados ainda não foram buscados —
  // carrega agora pra o painel ao vivo (contadores + mapa) já aparecer preenchido de cara
  if(estado.admin.logado){
    if(estado.admin.todosPedidos.length===0) carregarTodosPedidosAdmin();
    if(estado.admin.motoristas.length===0) carregarMotoristasAdmin();
    if(estado.admin.clientes.length===0) carregarClientesAdmin();
    if(estado.admin.saques.length===0) carregarSaquesAdmin();
    if(estado.admin.alertas.length===0) carregarAlertasAdmin();
  }
}

async function entrarAdmin(){
  const senha = estado.admin.senhaDigitada;
  if(!senha){ mostrarToast('Digite a senha.'); return; }
  const { data: senhaOk, error: erroSenha } = await sb.rpc('entrega_verificar_senha_admin', { p_senha: senha });
  if(erroSenha){ console.error(erroSenha); mostrarToast('Erro ao verificar a senha. Tenta de novo.', 'erro'); return; }
  if(!senhaOk){ mostrarToast('Senha incorreta.', 'erro'); return; }
  estado.admin.logado=true;
  salvarLocal('ef_admin_logado','true');

  await Promise.all([carregarMotoristasAdmin(), carregarPedidosEntreguesAdmin(), carregarSaquesAdmin(), carregarTodosPedidosAdmin(), carregarClientesAdmin(), carregarAlertasAdmin()]);

  document.getElementById('app').innerHTML = `<div style="padding:40px 24px;text-align:center;color:#f5f6fb;background:#171d4a;min-height:100vh;font-family:'Karla',sans-serif"><div style="font-size:37px;margin-bottom:12px">⚠️</div><div style="font-family:'Rajdhani';font-weight:700;font-size:18.5px;margin-bottom:8px">Não consegui carregar a ligação à base de dados</div><div style="font-size:15px;color:#b7bce3;line-height:1.6">Verifique sua conexão com a internet e recarregue a página.</div></div>`;
  esconderSplash();
} else {
  aplicarEstadoInicialSincrono();
  render();
  carregarConfigGeral().then(render);
  registrarServiceWorker();
  assinarPedidosRealtime();
  assinarMotoristasOnlineRealtime();
  assinarChatGlobalRealtime();
  assinarPresencaRealtime();
  assinarAvisosGeraisRealtime();
  assinarConfigGeralRealtime();
  carregarMotoristasOnline();
  setInterval(carregarMotoristasOnline, 20000);
  setInterval(atualizarPresencaTipo, 20000);
  // Atalho pra quem vem de anúncio: ?ir=cadastro-cliente ou ?ir=cadastro-motorista
  // marca a visita como "via anúncio" pra cortar onboarding/popup de instalar/faixa de notificação
  try{
    estado.viaAnuncio = !!new URLSearchParams(window.location.search).get('ir');
  }catch(e){ estado.viaAnuncio = false; }
  restaurarSessao().then(async ()=>{
    render();
    // pula a tela de boas-vindas e já abre o cadastro certo (só se não estiver logado)
    try{
      const destinoAnuncio = new URLSearchParams(window.location.search).get('ir');
      if(destinoAnuncio && !estado.cliente.logado && !estado.motorista.ativo){
        if(destinoAnuncio === 'cadastro-cliente'){ escolherBoasVindas('cliente'); registrarInicioFunilAnuncio('cliente'); }
        else if(destinoAnuncio === 'cadastro-motorista'){ escolherBoasVindas('entregador'); registrarInicioFunilAnuncio('motorista'); }
      }
    }catch(e){ console.error(e); }
    atualizarPresencaTipo();
    if(estado.cliente.logado) carregarCarteiraCliente();
    if(estado.motorista.ativo){ carregarSaldoMotorista(); carregarCancelamentosMotorista(); }
    if(estado.admin.logado){ await Promise.all([carregarMotoristasAdmin(), carregarPedidosEntreguesAdmin(), carregarSaquesAdmin()]); await carregarSuporteAdmin(); render(); }
    if(estado.notificacoesStatus==='granted') inscreverPushReal();
  });
  carregarPedidos();
  setInterval(carregarPedidos, 15000);
  iniciarTickEta();
  iniciarTickTempoPedidos();
  setTimeout(esconderSplash, 8000);
  (function agendarOnboardingOuInstalar(){
    if(estado.viaAnuncio) return; // quem veio de anúncio já sabe o que quer: sem onboarding nem popup de instalar
    let onboardingVisto=false;
    try{ onboardingVisto = !!localStorage.getItem('ef_onboarding_visto'); }catch(e){}
    if(!onboardingVisto){
      setTimeout(()=>{ if(!estado.onboardingAberto) abrirOnboarding(); }, 1200);
    } else {
      agendarPopupInstalarSeNecessario();
    }
  })();
}
</script>
</body>
</html>
