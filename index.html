async function loginFacialCliente(){
  const pc = estado.painelCliente;
  const telefone = (document.getElementById('lc-telefone')?.value || '').replace(/\D/g,'');
  if(!telefone){ pc.loginErro='Digite seu telefone para entrar com reconhecimento facial.'; render(); return; }
  pc.loginErro='';
  const { data: perfilRaw, error } = await sb.rpc('entrega_cliente_meu_perfil', {p_telefone: telefone});
  const data = Array.isArray(perfilRaw) ? perfilRaw[0] : perfilRaw;
  if(error){ console.error('Perfil cliente RPC:',error); pc.loginErro='Erro ao consultar a conta. Tenta novamente.'; render(); return; }
  if(!data){ pc.loginErro='Não encontrámos conta com este telefone.'; render(); return; }
  if(data.bloqueado){ pc.loginErro='Esta conta está bloqueada. Fala com o suporte para mais informações.'; render(); return; }
  if(!data.facial_ativa || !Array.isArray(data.face_descriptor) || !data.face_descriptor.length){
    estado.painelCliente.tela='cadastro';
    estado.painelCliente.cadastro={
      nome:data.nome||'',
      telefone:data.telefone||telefone,
      senha:'',
      erro:'Este cadastro ficou pela metade. Digite a senha que deseja usar e conclua agora a validação facial.'
    };
    render();
    return;
  }
  const facial = await fluxoFacial({tipo:'cliente',telefone:data.telefone,modo:'login',descriptorSalvo:data.face_descriptor});
  if(!facial.ok){ pc.loginErro = facial.cancelado ? 'Reconhecimento facial cancelado.' : (facial.erro||'Não foi possível confirmar seu rosto.'); render(); return; }
  await entrarNoPainelCliente(data);
}

async function loginCliente(){
  const pc = estado.painelCliente;
  const telefone = (document.getElementById('lc-telefone')?.value || '').replace(/\D/g,'');
  const senha = document.getElementById('lc-senha')?.value || '';

  if(!telefone||!senha){
    pc.loginErro='Preenche telefone e senha.';
    render();
    return;
  }

  pc.loginErro='';
  const senhaHash = await hashSenha(senha);

  const { data: loginRaw, error } = await sb.rpc('entrega_cliente_autenticar', {
    p_telefone: telefone,
    p_senha_hash: senhaHash
  });
  const data = Array.isArray(loginRaw) ? loginRaw[0] : loginRaw;

  if(error){
    console.error('Login cliente RPC:',error);
    pc.loginErro='Erro ao consultar a conta. Tenta novamente.';
    render();
    return;
  }

  if(!data){
    pc.loginErro='Telefone ou senha incorretos. Se ainda não tem conta, faça seu cadastro.';
    render();
    return;
  }

  // Login por senha não depende de biometria facial.
  // A biometria continua disponível como opção separada para quem já a ativou.

  if(data.bloqueado){
    pc.loginErro='Esta conta está bloqueada. Fala com o suporte para mais informações.';
    render();
    return;
  }

  await entrarNoPainelCliente(data);
}

async function loginMotorista(){

  const data = Array.isArray(dadosLogin) ? (dadosLogin[0] || null) : dadosLogin;
  if(error){ pm.loginErro='Erro ao consultar o cadastro. Tenta novamente.'; render(); return; }
  if(!data){ pm.loginErro='Telefone ou senha incorretos.'; render(); return; }
  if(data.status==='incompleto'){ pm.loginErro='O seu cadastro ficou incompleto. Cadastra-te novamente.'; render(); return; }
  if(data.status==='liberado'){ registrarStatusAplicativo('motorista',data.telefone,estado.notificacoesStatus==='granted'); mostrarLembreteDocumentosDiario(data.telefone,data.status); pm.tela='liberado'; pm.telefoneLiberado=data.telefone; render(); return; }
  if(data.status==='reprovado'){
    pm.tela='reprovado'; pm.motivoReprovacao=data.motivo_reprovacao||'Não foi indicado um motivo.';
    pm.reenvio = { telefone:data.telefone, senhaHash:senhaHash, veiculoTipo:data.veiculo_tipo||'', cnhUrl:data.cnh_url||null, crlvUrl:data.crlv_url||null, fotoVeiculoFrenteUrl:data.foto_veiculo_url||null, fotoVeiculoTrasUrl:data.foto_veiculo_tras_url||null, fotoMotoristaUrl:data.foto_motorista_url||null, enviando:false };
    render(); return;
  }
  if(data.status==='bloqueado'){ pm.loginErro='O seu cadastro está bloqueado. Fala com o suporte para mais informações.'; render(); return; }
  // Cadastro básico ainda não terminou: retoma exatamente do ponto em que parou.
  if(data.status==='basico'){

  if(STATUS_ACESSO_PAINEL.includes(data.status)){ await entrarNoPainelMotorista(data); return; }

async function salvarEtapaCadastro(campos){
  const c = estado.painelMotorista.cadastro;
  const agora = Date.now();
  if(!c.id){ c.id = 'mot'+agora+Math.floor(Math.random()*1000); }
  const base = { id:c.id, criado_em: c.criadoEm||agora, atualizado_em: agora };
  if(c.nome) base.nome = c.nome;
  if(c.cpf) base.cpf = c.cpf;
  if(c.telefone) base.telefone = c.telefone;
  if(c.cidade) base.cidade = c.cidade;
  if(c.senhaHash) base.senha_hash = c.senhaHash;
  const linha = Object.assign(base, campos);
  // O pré-cadastro já existe. UPDATE evita que o upsert tente um novo INSERT
  // e seja bloqueado pela proteção do banco justamente na etapa da chave PIX.
  const { data:confirmado, error } = await sb.from('entrega_motoristas').update(linha).eq('id', c.id).select('id');
  if(error || !confirmado || !confirmado.length){
    console.error('salvar_etapa_motorista', error);
    const detalhe=String(error?.message||'').toLowerCase();
    mostrarToast(
      detalhe.includes('row-level security') || detalhe.includes('permission')
        ? 'Não foi possível autorizar esta etapa. Atualize a página e toque em continuar cadastro.'
        : 'Erro ao gravar o cadastro. Confira a internet e tente novamente.',
      'erro'
    );
    return false;
  }
  c.criadoEm = c.criadoEm || agora;
  salvarRascunhosCadastro();
  return true;
}

function cpfValido(cpf){
  const s = String(cpf||'').replace(/\D/g,'');
  if(s.length!==11) return false;
  if(/^(\d)\1{10}$/.test(s)) return false; // todos os dígitos iguais, ex: 111.111.111-11
  const calcDigito = (base)=>{
    let soma=0, peso=base.length+1;
    for(let i=0;i<base.length;i++){ soma += parseInt(base[i],10)*peso; peso--; }
    const resto = soma % 11;
    return resto<2 ? 0 : 11-resto;
  };
  const d1 = calcDigito(s.slice(0,9));
  if(d1 !== parseInt(s[9],10)) return false;
  const d2 = calcDigito(s.slice(0,10));
  if(d2 !== parseInt(s[10],10)) return false;
  return true;
}
// aceita os dois formatos de placa brasileira: antigo (ABC1234) e Mercosul (ABC1D23) —
// não valida se o veículo existe de verdade, só barra o pessoa digitar qualquer coisa
// (poucas letras, só números, etc.) no lugar de uma placa de verdade
function placaValida(placa){
  const s = String(placa||'').toUpperCase().replace(/[\s-]/g,'');
  return /^[A-Z]{3}\d[A-Z0-9]\d{2}$/.test(s);
}
function normalizarPlaca(placa){
  return String(placa||'').toUpperCase().replace(/[\s-]/g,'');
}

async function avancarEtapa1(){
  const c = estado.painelMotorista.cadastro;
  c.nome = document.getElementById('cm-nome').value.trim();
  c.telefone = (document.getElementById('cm-telefone').value || '').replace(/\D/g,'');
  c.cidade = document.getElementById('cm-cidade').value.trim();
  c.senha = document.getElementById('cm-senha').value;
  // Cadastro básico via RPC segura: o navegador não precisa de permissão direta na tabela.
  // Isso evita o erro de RLS/GRANT e mantém a captação do anúncio funcionando.
  if(!c.nome||!c.telefone||!c.cidade||!c.senha){ c.erroEtapa='Preenche todos os campos.'; render(); return; }
  if(c.telefone.length<10){ c.erroEtapa='Confere o telefone com DDD.'; render(); return; }
  if(c.senha.length<4){ c.erroEtapa='A senha precisa de pelo menos 4 caracteres.'; render(); return; }
  c.erroEtapa=''; c.enviando=true; render();
  try{
    c.senhaHash = await hashSenha(c.senha);
    const { data: salvoRaw, error } = await sb.rpc('entrega_motorista_cadastrar_basico', {
      p_nome:c.nome,
      p_telefone:c.telefone,
      p_cidade:c.cidade,
      p_senha_hash:c.senhaHash,
      p_veiculo_tipo:c.veiculo||'moto'
    });
    if(error) throw error;
    const salvo = Array.isArray(salvoRaw) ? (salvoRaw[0]||null) : salvoRaw;
    if(!salvo || !salvo.id) throw new Error('cadastro_nao_confirmado');
    c.id = salvo.id;
    c.criadoEm = salvo.criado_em || Date.now();
    c.enviando=false;
    // Pré-cadastro é apenas um lead. A conversão CompleteRegistration fica reservada
    // para quem realmente termina documentos, PIX e termos.
    try{ if(typeof fbq!=='undefined') fbq('track','Lead',{content_name:'motorista_basico'}); }catch(e){}
    registrarAlertaAdmin('novo_motorista_basico', `Novo motorista iniciou o cadastro: ${c.nome||''} (${c.telefone||''}).`);

    // Não abre mais o painel no meio do cadastro: segue direto para os dados/documentos.
    c.etapa=2;
    estado.painelMotorista.tela='cadastro';
    render();
  }catch(e){
    console.error('Cadastro básico motorista:',e);
    c.enviando=false;
    const msg=String(e?.message||'');
    c.id=null;
    c.erroEtapa = msg.includes('telefone_ja_cadastrado')
      ? 'Já existe cadastro com este telefone. Use "Já sou cadastrado" para entrar.'
      : 'Não consegui concluir o cadastro agora. Tenta novamente.';
    render();
  }
}

async function prepararImagemDocumento(file){
  // Fotos grandes de celular são reduzidas antes do upload para evitar travar/abandonar em internet móvel.
  if(!file || !String(file.type||'').startsWith('image/')) return file;
  if(file.size <= 1200*1024) return file;
  try{
    const bitmap = await createImageBitmap(file);
    const max=1600, escala=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
    const w=Math.max(1,Math.round(bitmap.width*escala)), h=Math.max(1,Math.round(bitmap.height*escala));
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    canvas.getContext('2d',{alpha:false}).drawImage(bitmap,0,0,w,h);
    if(bitmap.close) bitmap.close();
    const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.82));
    return blob || file;
  }catch(e){ console.warn('compressao_documento_falhou',e); return file; }
}

async function processarDocumentoSelecionado(input){
  const file = input.files && input.files[0];
  input.value='';
  if(!file || !uploadPendente) return;
  const tipo = uploadPendente; uploadPendente = null;
  const c = estado.painelMotorista.cadastro;
  if(!String(file.type||'').startsWith('image/')){ mostrarToast('Escolha uma foto da câmera ou galeria.', 'erro'); return; }
  mostrarToast('Salvando foto...');
  const preparado = await prepararImagemDocumento(file);
  const nomeArquivo = `${c.id}/${tipo}-${Date.now()}.jpg`;
  const { error: erroUp } = await sb.storage.from('motorista-documentos').upload(nomeArquivo, preparado, { upsert:true, contentType:'image/jpeg' });
  if(erroUp){
    console.error('upload_documento',erroUp);
    mostrarToast('Não consegui salvar esta foto. Confira a internet e toque nela para tentar de novo.', 'erro');
    return;
  }
  const { data: pub } = sb.storage.from('motorista-documentos').getPublicUrl(nomeArquivo);
  if(tipo==='cnh') c.cnhUrl = pub.publicUrl;
  if(tipo==='crlv') c.crlvUrl = pub.publicUrl;
  if(tipo==='fotoVeiculoFrente') c.fotoVeiculoFrenteUrl = pub.publicUrl;
  if(tipo==='fotoVeiculoTras') c.fotoVeiculoTrasUrl = pub.publicUrl;
  if(tipo==='fotoMotorista') c.fotoMotoristaUrl = pub.publicUrl;
  const campos={ cnh_url:c.cnhUrl, crlv_url:c.crlvUrl, foto_veiculo_url:c.fotoVeiculoFrenteUrl, foto_veiculo_tras_url:c.fotoVeiculoTrasUrl, foto_motorista_url:c.fotoMotoristaUrl, aceita_responsabilidade_bike:c.aceitaResponsabilidadeBike };
  const prog=progressoDocumentosCadastro(c);
  if(prog.feitos===prog.total && c.veiculo!=='bicicleta') campos.documentos_enviados_em=Date.now();
  const ok=await salvarEtapaCadastro(campos);
  if(!ok){ mostrarToast('A foto subiu, mas não consegui registrar no cadastro. Tente novamente.', 'erro'); return; }
  mostrarToast(`Foto salva! ${prog.feitos} de ${prog.total} enviados.`, 'sucesso');
  render();
}

async function escolherPlano(chave){
  const c = estado.painelMotorista.cadastro;
  if(c.plano===chave) return;
  c.plano = chave;
  c.pix = { qrCode:null, copiaCola:null, status:'pendente', gerando:false, erro:'' };
  if(pixPollTimer){ clearInterval(pixPollTimer); pixPollTimer=null; }
  const p = PLANOS[chave];
  await salvarEtapaCadastro({ plano:chave, taxa_valor:p.preco, taxa_status: p.preco>0 ? 'pendente' : 'pago' });
  if(chave==='free'){ dispararAnimacaoPlano('free'); return; }
  render();
  if(chave==='pro'){ criarCobrancaPix(); }
}

async function criarCobrancaPix(){
  const c = estado.painelMotorista.cadastro;
  c.pix.gerando=true; c.pix.erro=''; render();
  try{
    const resp = await fetch(`${FUNCOES_URL}/criar-cobranca-pix`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'apikey':SUPABASE_KEY},
      body: JSON.stringify({ motoristaId:c.id, valor:PLANOS.pro.preco, nome:c.nome, cpf:c.cpf })
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro){ throw new Error(dados.erro || 'Falha ao gerar cobrança PIX.'); }
    c.pix.qrCode = dados.qrCodeBase64; c.pix.copiaCola = dados.copiaCola; c.pix.gerando=false;
    render();
    iniciarPollingPix();
  }catch(e){
    console.error(e);
    c.pix.gerando=false; c.pix.erro = (e && e.message) ? e.message : 'Não consegui gerar a cobrança PIX. Tente novamente em instantes.';
    render();
  }
}
function iniciarPollingPix(){
  if(pixPollTimer) clearInterval(pixPollTimer);
  pixPollTimer = setInterval(async ()=>{
    const c = estado.painelMotorista.cadastro;
    if(!c.id || c.pix.status==='pago'){ clearInterval(pixPollTimer); pixPollTimer=null; return; }
    const { data } = await sb.from('entrega_motoristas').select('taxa_status').eq('id', c.id).maybeSingle();
    if(data && data.taxa_status==='pago'){
      c.pix.status='pago'; clearInterval(pixPollTimer); pixPollTimer=null;
      dispararAnimacaoPlano('pro');
    }
  }, 4000);
}
function copiarPix(){
  const c = estado.painelMotorista.cadastro;
  if(!c.pix.copiaCola) return;
  navigator.clipboard.writeText(c.pix.copiaCola).then(()=>mostrarToast('Código PIX copiado!', 'sucesso'));
}

function mudarAbaAdmin(aba){
  estado.admin.aba = aba;
  salvarLocal('ef_admin_aba', aba);
  render();
  if(aba==='pedidos' && estado.admin.todosPedidos.length===0) carregarTodosPedidosAdmin();
  if(aba==='clientes' && estado.admin.clientes.length===0) carregarClientesAdmin();
  if(aba==='feedbacks' && !estado.admin.feedbacksCarregados) carregarFeedbacksAdmin();
}
async function carregarFeedbacksAdmin(){
  estado.admin.carregando=true; render();
  const { data, error } = await sb.from('entrega_feedbacks').select('*').order('criado_em',{ascending:false}).limit(300);
  estado.admin.carregando=false; estado.admin.feedbacksCarregados=true;
  if(error){ console.error(error); mostrarToast('Erro ao carregar sugestões e reclamações.', 'erro'); return; }
  estado.admin.feedbacks = data||[];
  render();
}
async function marcarFeedbackLido(id){
  const { error } = await sb.from('entrega_feedbacks').update({ lido:true }).eq('id', id);
  if(error){ console.error(error); return; }
  const f = (estado.admin.feedbacks||[]).find(x=>x.id===id);
  if(f) f.lido=true;
  render();
}
function definirPapelAvisoGeral(papel){ estado.admin.avisoGeral.papel = papel; render(); }
async function enviarAvisoGeralAdmin(){
  const ag = estado.admin.avisoGeral;
  const texto = (document.getElementById('aviso-geral-mensagem')?.value || ag.mensagem || '').trim();
  if(!texto){ mostrarToast('Escreve a mensagem do aviso antes de enviar.'); return; }
  if(!(await confirmarAcao(`Enviar este aviso para TODOS os ${ag.papel==='motorista'?'motoristas':'clientes'} cadastrados?`))) return;
  ag.enviando=true; render();
  const { data: idAviso, error } = await sb.rpc('entrega_admin_enviar_aviso_geral', { p_senha: estado.admin.senhaDigitada, p_papel: ag.papel, p_mensagem: texto });
  ag.enviando=false;
  if(error){
    console.error(error);
    mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao enviar o aviso: '+(error.message||'tenta de novo'), 'erro');
    render();
    return;
  }
  ag.mensagem='';
  mostrarToast(`Aviso enviado para todos os ${ag.papel==='motorista'?'motoristas':'clientes'}!`, 'sucesso');
  enviarPushServidor(ag.papel, null, ' Aviso do Entrega Flash', texto);
  render();
}

async function carregarTodosPedidosAdmin(){
  // mesma lógica: só colapsa pro placeholder de "carregando" se ainda não havia pedidos
  // carregados. Numa atualização pós-edição, mantém a lista visível e evita o scroll pular.
  const jaTinhaPedidos = (estado.admin.todosPedidos||[]).length>0;
  if(!jaTinhaPedidos){ estado.admin.carregando=true; render(); }
  const { data, error } = await sb.from('entrega_pedidos').select('*').order('criado_em',{ascending:false}).limit(500);
  estado.admin.carregando=false;
  if(error){ console.error(error); mostrarToast('Erro ao carregar pedidos.', 'erro'); return; }
  const novaLista=data||[];
  const estrutural = arr=>JSON.stringify((arr||[]).map(p=>{ const x={...p}; delete x.motorista_lat; delete x.motorista_lng; delete x.motorista_atualizado_em; delete x.atualizado_em; return x; }));
  const soGpsMudou = estado.admin.todosPedidos.length>0 && estrutural(novaLista)===estrutural(estado.admin.todosPedidos);
  estado.admin.todosPedidos = novaLista;
  if(soGpsMudou){ if(estado.admin.aberto && estado.admin.aba==='resumo') montarMapaAdminGeral(); return; }
  render();
}
async function carregarClientesAdmin(){
  // Não executa consultas administrativas por trás das telas de cliente/motorista.
  // Isso evita toast de erro do admin aparecendo para usuários comuns quando a sessão admin ficou salva.
  if(!estado.admin.aberto || !estado.admin.logado) return;
  // só mostra a tela cheia de "carregando" no primeiro carregamento (lista ainda vazia).
  // Numa atualização depois de salvar uma edição, a lista já tem conteúdo — não colapsamos
  // ela pra um placeholder no meio do caminho, senão o scroll da pessoa "pula" pro topo.
  const jaTinhaClientes = estado.admin.clientes.length>0;
  if(!jaTinhaClientes){ estado.admin.carregando=true; render(); }
  const { data, error } = await sb.from('entrega_clientes').select('*').order('criado_em',{ascending:false});
  if(error){ estado.admin.carregando=false; console.error(error); mostrarToast('Erro ao carregar clientes.', 'erro'); return; }
  const { data: saldos, error: erroSaldos } = await sb.from('entrega_clientes_saldos').select('telefone,saldo');
  estado.admin.carregando=false;
  if(erroSaldos) console.error(erroSaldos);
  const saldoPorTelefone = {};
  (saldos||[]).forEach(s=>{ saldoPorTelefone[s.telefone] = Number(s.saldo)||0; });
  estado.admin.clientes = (data||[]).map(c=>({
    ...c,
    saldo: saldoPorTelefone[c.telefone]||0,
    cadastro_incompleto: !(c.facial_ativa && Array.isArray(c.face_descriptor) && c.face_descriptor.length)
  }));
  render();
}
function filtrarPedidosAdmin(){
  const a = estado.admin;
  const busca = (a.buscaPedidos||'').trim().toLowerCase();
  return (a.todosPedidos||[]).filter(p=>{
    if(a.filtroPedidos!=='todos' && p.status!==a.filtroPedidos) return false;
    if(!busca) return true;
    return (p.cliente_nome||'').toLowerCase().includes(busca) || (p.cliente_telefone||'').includes(busca)
      || (p.motorista_nome||'').toLowerCase().includes(busca) || (p.motorista_telefone||'').includes(busca) || (p.id||'').includes(busca);
  });
}

function fluxoFinanceiroAdminHTML(){
  const a = estado.admin;
  const pedidos = a.todosPedidos.length ? a.todosPedidos : null;
  if(!pedidos){
    return `<div class="admin-cartao"><b style="font-family:'Rajdhani';font-weight:700;font-size:14px;text-transform:uppercase"> Fluxo de entrada e saída</b><div class="subtitulo" style="margin-top:8px;margin-bottom:0">Abre a aba " Pedidos" pelo menos uma vez para carregar os números completos aqui.</div></div>`;
  }
  const entregues = pedidos.filter(p=>p.status==='entregue');
  const cancelados = pedidos.filter(p=>p.status==='cancelado');
  const ativos = pedidos.filter(p=>!['entregue','cancelado'].includes(p.status));
  const entradaBruta = entregues.reduce((s,p)=>s+(Number(p.preco)||0),0);
  const entradaTaxasCancelamento = cancelados.reduce((s,p)=>s+(Number(p.taxa_cancelamento)||0),0);
  const planoPorTelefone = {}; a.motoristas.forEach(m=>{ planoPorTelefone[m.telefone]=m.plano; });
  const saidaMotoristas = entregues.reduce((s,p)=>{
    const plano = PLANOS[planoPorTelefone[p.motorista_telefone]] || PLANOS.free;
    return s + (Number(p.preco)||0) * (1-plano.taxaPlataforma);
  },0);
  const saquesPagos = (a.saques||[]).filter(s=>s.status==='pago').reduce((s,x)=>s+Number(x.valor||0),0);
  const saquesPendentes = (a.saques||[]).filter(s=>s.status==='pendente').reduce((s,x)=>s+Number(x.valor||0),0);
  return `
  <div class="admin-cartao">
    <b style="font-family:'Rajdhani';font-weight:700;font-size:14px;text-transform:uppercase"> Fluxo de entrada e saída (${pedidos.length} pedidos carregados)</b>
    <div class="am-linha"><span> Entregues</span><b>${entregues.length}</b></div>
    <div class="am-linha"><span> Cancelados</span><b>${cancelados.length}</b></div>
    <div class="am-linha"><span> Em andamento agora</span><b>${ativos.length}</b></div>
    <div class="am-linha" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--linha)"><span style="color:var(--verde)">▲ Entrada — pedidos entregues</span><b style="color:var(--verde)">R$ ${entradaBruta.toFixed(2)}</b></div>
    <div class="am-linha"><span style="color:var(--verde)">▲ Entrada — taxas de cancelamento</span><b style="color:var(--verde)">R$ ${entradaTaxasCancelamento.toFixed(2)}</b></div>
    <div class="am-linha"><span style="color:var(--chama)">▼ Saída — repasse aos motoristas</span><b style="color:var(--chama)">R$ ${saidaMotoristas.toFixed(2)}</b></div>
    <div class="am-linha"><span style="color:var(--chama)">▼ Saída — saques já pagos</span><b style="color:var(--chama)">R$ ${saquesPagos.toFixed(2)}</b></div>
    <div class="am-linha"><span>⏳ Saques pendentes de pagar</span><b>R$ ${saquesPendentes.toFixed(2)}</b></div>
    <div class="am-linha" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--linha)"><span> Saldo líquido (entrada − saída)</span><b style="color:var(--mango)">R$ ${(entradaBruta+entradaTaxasCancelamento-saidaMotoristas-saquesPagos).toFixed(2)}</b></div>
  </div>`;
}

async function trocarSenhaAdminPainel(){
  const atual = document.getElementById('cfg-senha-atual')?.value||'';
  const nova = document.getElementById('cfg-senha-nova')?.value||'';
  if(!atual || !nova){ mostrarToast('Preenche a senha atual e a nova.'); return; }
  if(nova.length<6){ mostrarToast('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
  const { data, error } = await sb.rpc('entrega_admin_trocar_senha', { p_senha_atual: atual, p_senha_nova: nova });
  if(error){ console.error(error); mostrarToast('Erro ao trocar a senha.', 'erro'); return; }
  if(!data){ mostrarToast('Senha atual incorreta.', 'erro'); return; }
  estado.admin.senhaDigitada = nova;
  mostrarToast('Senha trocada com sucesso!', 'sucesso');
  render();
}

async function salvarEdicaoPedidoAdmin(id){
  const nome = document.getElementById('edit-pedido-nome-'+id)?.value.trim();
  const telefoneCliente = document.getElementById('edit-pedido-tel-cliente-'+id)?.value.trim();
  const origem = document.getElementById('edit-pedido-origem-'+id)?.value.trim();
  const destino = document.getElementById('edit-pedido-destino-'+id)?.value.trim();
  const motoristaNome = document.getElementById('edit-pedido-motorista-nome-'+id)?.value.trim();
  const motoristaTel = document.getElementById('edit-pedido-motorista-tel-'+id)?.value.trim();
  const preco = Number(document.getElementById('edit-pedido-preco-'+id)?.value);
  const status = document.getElementById('edit-pedido-status-'+id)?.value;
  if(!origem || !destino){ mostrarToast('Preenche os endereços de recolha e entrega.'); return; }
  const { error } = await sb.rpc('entrega_admin_editar_pedido', {
    p_senha: estado.admin.senhaDigitada, p_id: id,

    p_motorista_nome: motoristaNome || null, p_motorista_telefone: motoristaTel || null,
    p_preco: Number.isNaN(preco) ? 0 : preco, p_status: status
  });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao salvar: '+(error.message||''), 'erro'); return; }
  mostrarToast('Pedido atualizado!', 'sucesso');

  await carregarTodosPedidosAdmin();
}

async function testarSaqueAutomatico(){
  if(!(await confirmarAcao('Isso vai rodar o robô de saque automático agora, processando qualquer saque pendente que já venceu o prazo. Continuar?'))) return;
  mostrarToast('Rodando o robô de saque automático...');
  try{
    const { data, error } = await sb.functions.invoke('processar-saques-automaticos');
    if(error){ console.error(error); mostrarToast('Erro ao chamar o robô: '+(error.message||''), 'erro'); return; }
    const total = data?.processados ?? 0;
    if(total===0){
      mostrarToast('Robô rodou, mas não tinha nenhum saque vencido pra processar.', 'sucesso');
    }else{
      const pagos = (data.resultados||[]).filter(r=>r.status==='pago').length;
      const falhas = total - pagos;
      mostrarToast(`Robô processou ${total} saque(s): ${pagos} pago(s), ${falhas} falharam. Veja o console pra detalhes.`, falhas>0 ? 'erro' : 'sucesso');
      console.log('Resultado do robô de saque automático:', data);
    }
  }catch(e){
    console.error(e);
    mostrarToast('Erro inesperado ao chamar o robô.', 'erro');
  }
  await carregarSaquesAdmin();
}

let canalAdminRealtime = null;
function assinarAdminRealtime(){
  if(canalAdminRealtime) return;
  canalAdminRealtime = sb.channel('admin-realtime')
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_motoristas'}, ()=>{
      debounce('admin-motoristas', carregarMotoristasAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_pedidos'}, ()=>{
      debounce('admin-pedidos', ()=>{ carregarTodosPedidosAdmin(); carregarPedidosEntreguesAdmin(); });
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_clientes'}, ()=>{
      debounce('admin-clientes', carregarClientesAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_saques'}, ()=>{
      debounce('admin-saques', carregarSaquesAdmin);
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'entrega_alertas_admin'}, (payload)=>{
      const al = payload.new || {};
      const info = INFO_TIPO_ALERTA[al.tipo] || { emoji:'', titulo:'Novo evento no app' };
      mostrarToast(`${info.emoji} ${info.titulo}`);
      notificar(`${info.emoji} ${info.titulo}`, al.mensagem||'', 'alerta-'+al.id);
      debounce('admin-alertas', carregarAlertasAdmin);
    })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'entrega_alertas_admin'}, ()=>{
      debounce('admin-alertas', carregarAlertasAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_suporte'}, ()=>{
      debounce('admin-suporte', carregarSuporteAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_suporte_status'}, ()=>{
      debounce('admin-suporte', carregarSuporteAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_clientes_saldos'}, ()=>{
      debounce('admin-clientes', carregarClientesAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_saldos'}, ()=>{
      debounce('admin-motoristas', carregarMotoristasAdmin);
    })
    .subscribe();
}

async function carregarMotoristasAdmin(){
  try{
    const {data:apps,error:erroApps}=await sb.rpc('entrega_admin_status_apps',{p_senha:estado.admin.senhaDigitada});
    if(!erroApps) estado.admin.appDispositivos=apps||[];
  }catch(e){ console.warn('Status dos aplicativos indisponível',e); }
  // mesma lógica do carregarClientesAdmin: só colapsa a lista pro placeholder de "carregando"
  // se ainda não havia nada carregado. Numa atualização pós-edição, mantém a lista visível.
  const jaTinhaMotoristas = estado.admin.motoristas.length>0;
  if(!jaTinhaMotoristas){ estado.admin.carregando=true; render(); }
  const { data, error } = await sb.from('entrega_motoristas').select('*').neq('status','incompleto').order('criado_em',{ascending:false});
  if(error){ estado.admin.carregando=false; console.error(error); mostrarToast('Erro ao carregar cadastros.', 'erro'); return; }
  const { data: saldos, error: erroSaldos } = await sb.from('entrega_saldos').select('telefone,saldo');
  estado.admin.carregando=false;
  if(erroSaldos) console.error(erroSaldos);
  const saldoPorTelefone = {};
  (saldos||[]).forEach(s=>{ saldoPorTelefone[s.telefone] = Number(s.saldo)||0; });
  const novaLista = (data||[]).map(m=>({ ...m, saldo: saldoPorTelefone[m.telefone]||0 }));
  const estrutural = arr=>JSON.stringify((arr||[]).map(m=>{ const x={...m}; delete x.lat_atual; delete x.lng_atual; delete x.lat_atualizado_em; return x; }));
  const soGpsMudou = estado.admin.motoristas.length>0 && estrutural(novaLista)===estrutural(estado.admin.motoristas);
  estado.admin.motoristas = novaLista;
  if(soGpsMudou){ if(estado.admin.aberto && estado.admin.aba==='resumo') montarMapaAdminGeral(); return; }
  render();
}

function normalizarWhatsAppBR(telefone){
  let n=String(telefone||'').replace(/\D/g,'');
  if(!n) return '';
  if(n.startsWith('55') && (n.length===12 || n.length===13)) return n;
  if(n.length===10 || n.length===11) return '55'+n;
  return n;
}
function diasDesdeCadastroMotorista(m){
  const bruto = Number(m?.criado_em||0);
  if(!bruto) return 0;
  const ms = bruto < 100000000000 ? bruto*1000 : bruto;
  return Math.max(0, Math.floor((Date.now()-ms)/86400000));
}

function iniciarAppReal(){
if(typeof window.supabase==='undefined' || !window.supabase.createClient){
  document.getElementById('app').innerHTML = `<div style="padding:40px 24px;text-align:center;color:#f5f6fb;background:#0d0f12;min-height:100vh;font-family:'Karla',sans-serif"><div style="font-size:37px;margin-bottom:12px"></div><div style="font-family:'Rajdhani';font-weight:700;font-size:18.5px;margin-bottom:8px">Não consegui carregar a ligação à base de dados</div><div style="font-size:15px;color:#b7bce3;line-height:1.6">Verifique sua conexão com a internet e recarregue a página.</div></div>`;
  esconderSplash();
} else {
  aplicarEstadoInicialSincrono();
  render();
  carregarConfigGeral().then(render);
  registrarServiceWorker();
  assinarPedidosRealtime();
  assinarMotoristasOnlineRealtime();
  assinarChatGlobalRealtime();
  assinarPresencaRealtime();
  assinarAvisosGeraisRealtime();
  assinarConfigGeralRealtime();
  carregarMotoristasOnline();
  setInterval(carregarMotoristasOnline, 20000);
  setInterval(atualizarPresencaTipo, 20000);
  // Atalho pra quem vem de anúncio: ?ir=cadastro-cliente ou ?ir=cadastro-motorista
  // marca a visita como "via anúncio" pra cortar onboarding/popup de instalar/faixa de notificação
  try{
    estado.viaAnuncio = !!new URLSearchParams(window.location.search).get('ir');
  }catch(e){ estado.viaAnuncio = false; }
  restaurarSessao().then(async ()=>{
    render();
    // pula a tela de boas-vindas e já abre o cadastro certo (só se não estiver logado)
    try{
      const destinoAnuncio = new URLSearchParams(window.location.search).get('ir');
      if(destinoAnuncio && !estado.cliente.logado && !estado.motorista.ativo){
        if(destinoAnuncio === 'cadastro-cliente'){ escolherBoasVindas('cliente'); }
        else if(destinoAnuncio === 'cadastro-motorista'){ escolherBoasVindas('entregador'); }
        else if(destinoAnuncio === 'login-cliente'){ entrarBoasVindas('cliente'); }
        else if(destinoAnuncio === 'login-motorista'){ entrarBoasVindas('entregador'); }
      }
    }catch(e){ console.error(e); }
    atualizarPresencaTipo();
    if(estado.cliente.logado) carregarCarteiraCliente();
    if(estado.motorista.ativo){ carregarSaldoMotorista(); carregarCancelamentosMotorista(); }
    if(estado.admin.logado){ await Promise.all([carregarMotoristasAdmin(), carregarPedidosEntreguesAdmin(), carregarSaquesAdmin()]); await carregarSuporteAdmin(); render(); }
    if(estado.notificacoesStatus==='granted') inscreverPushReal();

    // Só decide a apresentação DEPOIS de confirmar no banco se a sessão ainda existe.
    // Assim, se o admin excluiu cliente/motorista, o localStorage é limpo antes desta decisão.
    if(!estado.onboardingAberto && !estado.viaAnuncio){
      let onboardingVisto=false;
      try{ onboardingVisto = !!localStorage.getItem('ef_onboarding_visto'); }catch(e){}
      if(!onboardingVisto){ setTimeout(()=>{ if(!estado.onboardingAberto) abrirOnboarding(); }, 250); }
      else agendarPopupInstalarSeNecessario();
    }
  });
  carregarPedidos();
  setInterval(carregarPedidos, 15000);
  iniciarTickEta();
  iniciarTickTempoPedidos();
  iniciarTickRelogioCancelamento();
  iniciarTickRadarBusca();
  setTimeout(esconderSplash, 8000);
}
} // fim de iniciarAppReal()

// ---------- exige localização ativada antes de liberar o app (app de entrega) ----------
function checarLocalizacaoObrigatoria(){
  const gate = document.getElementById('gate-localizacao');
  const corpo = document.getElementById('gate-localizacao-corpo');
  function mostrarGate(html){
    if(gate){ gate.style.display='flex'; }
    if(corpo){ corpo.innerHTML = html; }
    esconderSplash();
  }
  function estadoCarregando(){
    mostrarGate(`
      <div class="gl-icone"><span class="girando" style="width:34px;height:34px;border-width:3.5px;margin:0;"></span></div>
      <div class="gl-titulo">A verificar a sua localização…</div>
      <div class="gl-sub">Precisamos da sua localização para calcular distâncias e valores de entrega com precisão.</div>
    `);
  }
  function estadoNegado(mensagemExtra){
    mostrarGate(`
      <div class="gl-icone"></div>
      <div class="gl-titulo">Ative a localização para continuar</div>
      <div class="gl-sub">O Entrega Flash precisa da sua localização para funcionar — sem ela não conseguimos calcular rotas, distâncias e valores das entregas.</div>
      ${mensagemExtra ? `<div class="gl-sub" style="color:var(--mango);font-weight:700;margin-top:-6px;">${mensagemExtra}</div>` : ''}
      <div class="gl-passos">
        <div class="gl-passos-titulo">Como ativar:</div>
        <div class="gl-passo"><b>No celular (Android/iPhone):</b> vá em Configurações → Localização (ou Privacidade → Localização) e ative para o navegador (Chrome/Safari).</div>
        <div class="gl-passo"><b>No navegador:</b> toque no ícone de cadeado/informações ao lado do endereço do site e permita o acesso à localização.</div>
      </div>
      <button class="btn btn-primario" style="margin-top:18px;" onclick="tentarNovamenteLocalizacao()">Tentar novamente</button>
    `);
  }
  function estadoSemSuporte(){
    mostrarGate(`
      <div class="gl-icone"></div>
      <div class="gl-titulo">Não foi possível acessar a localização</div>
      <div class="gl-sub">Seu navegador não é compatível com localização. Tente abrir o Entrega Flash em outro navegador atualizado (Chrome ou Safari).</div>
    `);
  }
  window.tentarNovamenteLocalizacao = function(){
    estadoCarregando();
    solicitar();
  };
  function esconderGate(){
    if(gate){ gate.style.display='none'; }
  }
  function solicitar(){
    if(!('geolocation' in navigator)){ estadoSemSuporte(); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos){
        try{
          estado.localizacaoObrigatoriaOk = true;
          estado.ultimaLocalizacao = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        }catch(e){}
        esconderGate();
        iniciarAppReal();
      },
      function(erro){
        if(erro && erro.code === 1){ // PERMISSION_DENIED
          estadoNegado('Você negou o acesso à localização. Ative novamente e toque em "Tentar novamente".');
        } else if(erro && erro.code === 2){ // POSITION_UNAVAILABLE
          estadoNegado('Não conseguimos obter sua posição no momento. Verifique se o GPS/localização está ligado.');
        } else if(erro && erro.code === 3){ // TIMEOUT
          estadoNegado('A busca pela sua localização demorou demais. Tente novamente.');
        } else {
          estadoNegado();
        }
      },
      { enableHighAccuracy:true, timeout:12000, maximumAge:60000 }
    );
  }
  estadoCarregando();
  solicitar();
}

// Acesso público ao site: não pedir localização aqui.
// O GPS é exigido apenas no momento operacional (cliente ao confirmar pedido
// e motorista aprovado ao iniciar rota).
iniciarAppReal();
</script>
<script id="ef-sem-emoji-v3">
/* Remove pictogramas decorativos residuais da interface sem alterar eventos, IDs ou funções. */
(function(){
 const rx=/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu;
 function limpar(root){
   const w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);
   let n; while(n=w.nextNode()){ if(rx.test(n.nodeValue)){ n.nodeValue=n.nodeValue.replace(rx,'').replace(/\s{2,}/g,' '); rx.lastIndex=0; } }
 }
 document.addEventListener('DOMContentLoaded',()=>{limpar(document.body);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)limpar(n.nodeType===1?n:n.parentNode)}))).observe(document.body,{childList:true,subtree:true});});
})();
</script>
