async function usarDistanciaManual(){
  const input = document.getElementById('c-distancia-manual');
  const km = parseFloat(input.value);
  if(!km || km<=0){ mostrarToast('Informa um número de km válido.'); return; }
  if(km > KM_MANUAL_MAXIMO){ mostrarToast(`Distância máxima permitida: ${KM_MANUAL_MAXIMO} km. Se a entrega é mais longe que isso, fala com a gente antes de confirmar.`); return; }
  const f = estado.form;
  // proteção anti-fraude: só se comparável a uma distância real já calculada por GPS antes
  if(f.distanciaGPS!=null && f.distanciaGPS>0){
    const pct = km / f.distanciaGPS;
    if(pct < 0.4 || pct > 1.3){
      mostrarToast('Valor muito diferente do esperado pelo GPS. Use o valor automático ou ajuste a distância.');
      registrarAlertaAdmin('fraude_distancia', `Tentativa de distância muito fora do esperado: cliente ${estado.cliente.telefone||f.telefone||'?'} digitou ${km} km, GPS calculou ${f.distanciaGPS} km (${Math.round(pct*100)}%).`);
      return;
    }
    if(pct >= 0.4 && pct < 0.7){
      if(!(await confirmarAcao(`A distância que você informou (${km} km) difere bastante do calculado pelo GPS (${f.distanciaGPS} km). Confirmar mesmo assim?`))) return;
      f.distanciaDivergente = true;
      registrarAlertaAdmin('distancia_divergente', `Cliente ${estado.cliente.telefone||f.telefone||'?'} confirmou distância divergente: ${km} km informado vs ${f.distanciaGPS} km do GPS (${Math.round(pct*100)}%).`);
    }
  }
  estado.form.distancia = Math.round(km*10)/10;
  estado.form.origemCoord = null;
  estado.form.destinoCoord = null;
  const veloc = VEICULOS[estado.form.veiculo].veloc;
  estado.form.duracaoMin = Math.max(3, Math.round((estado.form.distancia/veloc)*60));
  estado.falhaCalculo = false;
  render();
}

// ---------- sem endereço certo (sítio/zona rural) — funciona para recolha, entrega e endereços adicionais ----------
function campoEhParada(campo){ return typeof campo==='string' && campo.indexOf('parada-')===0; }
function paradaIdxDe(campo){ return parseInt(campo.split('-')[1],10); }
function abrirSemEndereco(campo){
  estado.semEndereco = { aberto:true, campo: campo||'origem', mapsLink:'', plusCode:'', erro:'', enviandoFoto:false, capturado:null, favoritos:[], carregandoFavoritos:true };
  render();
  carregarFavoritosSemEndereco();
}
function fecharSemEndereco(){ estado.semEndereco.aberto = false; render(); }
// aplica uma localização (com coordenadas exatas) no campo certo do pedido — usado tanto pelo GPS/link
// quanto ao reaproveitar um local salvo como favorito
function aplicarLocalizacaoNoForm(campo, {texto, lat, lon}){
  if(campoEhParada(campo)){
    const idx = paradaIdxDe(campo);
    estado.form.paradas[idx] = texto;
    if(!estado.form.paradasCoords) estado.form.paradasCoords = [];
    estado.form.paradasCoords[idx] = { lat, lon };
  } else {
    estado.form[campo+'Coord'] = { lat, lon };
    estado.form[campo] = texto;
    estado.form.distancia = null;
  }
}
async function carregarFavoritosSemEndereco(){
  const tel = estado.cliente.telefone;
  if(!tel){ estado.semEndereco.favoritos = []; estado.semEndereco.carregandoFavoritos=false; render(); return; }
  const { data, error } = await sb.from('entrega_clientes_favoritos').select('*').eq('cliente_telefone', tel).order('criado_em',{ascending:false});
  estado.semEndereco.carregandoFavoritos = false;
  if(error){ console.error(error); estado.semEndereco.favoritos = []; render(); return; }
  estado.semEndereco.favoritos = data||[];
  render();
}
function usarFavoritoSemEndereco(id){

  if(!fav) return;

async function removerFavoritoSemEndereco(id, evt){

async function usarGPSSemEndereco(){
  if(!navigator.geolocation){ mostrarToast('Seu navegador não suporta localização por GPS.', 'erro'); return; }
  const campo = estado.semEndereco.campo;
  estado.semEndereco.erro = '';
  mostrarToast('A obter sua localização...');
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      const texto = `📍 Localização GPS (${lat.toFixed(5)}, ${lon.toFixed(5)})`;
      aplicarLocalizacaoNoForm(campo, { texto, lat, lon });
      mostrarToast('Localização capturada! Agora calcula a corrida.', 'sucesso');
      autoCalcularSeCompleto();
      if(campoEhParada(campo)){ fecharSemEndereco(); }
      else { estado.semEndereco.capturado = { texto, lat, lon }; render(); }
    },
    ()=>{ estado.semEndereco.erro = 'Não consegui pegar sua localização. Ativa o GPS e tenta de novo.'; render(); },
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );
}
function usarLinkMapsSemEndereco(){
  const campo = estado.semEndereco.campo;
  const input = document.getElementById('se-maps-link');
  const link = (input?.value||'').trim();
  if(!link){ estado.semEndereco.erro = 'Cola o link que a pessoa compartilhou.'; render(); return; }
  const match = link.match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  const ehParada = campoEhParada(campo);
  if(match){
    const lat = parseFloat(match[1]), lon = parseFloat(match[2]);
    const texto = `📍 Localização compartilhada (${lat.toFixed(5)}, ${lon.toFixed(5)})`;
    aplicarLocalizacaoNoForm(campo, { texto, lat, lon });
    mostrarToast('Localização do link capturada! Agora calcula a corrida.', 'sucesso');
    autoCalcularSeCompleto();
    if(ehParada){ fecharSemEndereco(); }
    else { estado.semEndereco.capturado = { texto, lat, lon }; render(); }
  } else {
    if(ehParada){
      const idx = paradaIdxDe(campo);
      estado.form.paradas[idx] = link;
    } else {
      estado.form[campo+'Referencia'] = link;
    }
    fecharSemEndereco();
    mostrarToast('Não consegui ler as coordenadas — guardei o link para o motorista abrir direto.', 'erro');
  }
}
function usarPlusCodeSemEndereco(){
  const campo = estado.semEndereco.campo;
  const input = document.getElementById('se-plus-code');
  const code = (input?.value||'').trim();
  if(!code){ estado.semEndereco.erro = 'Digita o Plus Code.'; render(); return; }
  if(campoEhParada(campo)){
    const idx = paradaIdxDe(campo);
    estado.form.paradas[idx] = (estado.form.paradas[idx] ? estado.form.paradas[idx]+' · ' : '') + `Plus Code: ${code}`;
  } else {
    estado.form[campo+'Referencia'] = (estado.form[campo+'Referencia'] ? estado.form[campo+'Referencia']+' · ' : '') + `Plus Code: ${code}`;

async function criarPedido(){
  const f = estado.form;
  if(!f.nome||!f.telefone||!f.origem||!f.destino){ mostrarToast('Preenche nome, telefone, recolha e destino.'); return; }
  if(f.distancia==null){ mostrarToast('Calcula a corrida primeiro.'); return; }
  if(f.distancia > KM_MANUAL_MAXIMO){ mostrarToast(`Distância acima do limite permitido (${KM_MANUAL_MAXIMO} km). Ajusta a distância antes de confirmar.`); return; }
  const paradasBrutas = (f.paradas||[]).map((texto,idx)=>({ texto:(texto||'').trim(), coord:(f.paradasCoords||[])[idx]||null })).filter(x=>x.texto);
  estado.calculando = true; render();
  for(const item of paradasBrutas){
    if(!item.coord){
      item.coord = await geocodificar(item.texto);
    }
  }
  estado.calculando = false; render();
  const foraDaArea = paradasBrutas.find(x=>!x.coord);
  if(foraDaArea){
    const ehReferencia = /^📍|^📝|Plus Code/.test(foraDaArea.texto);
    if(!ehReferencia){
      if(!(await confirmarAcao(`Não consegui confirmar automaticamente o endereço "${foraDaArea.texto}". Pode continuar mesmo assim (o motorista vai receber só o texto, sem localização automática) ou cancelar e ajustar o endereço. Continuar?`))) return;
    }
  }
  const paradasValidas = paradasBrutas.map(x=>x.texto);
  const paradasCoordsValidas = paradasBrutas.map(x=>x.coord);
  if(f.tipoRetirada==='agendado' && !f.horarioAgendado){ mostrarToast('Escolha a data e hora da retirada agendada.'); return; }
  const preco = precoDeDistancia(f.veiculo, f.distancia, f.roca) + (f.prioridade ? TAXA_PRIORIDADE_VALOR : 0) + valorExtras(f.extras) + (paradasValidas.length * TAXA_PARADA_EXTRA_VALOR);

  // ---- checagem de saldo: busca o saldo mais atual direto do banco antes de liberar o pedido ----
  const w = estado.cliente.carteira;
  let saldoAtualCliente = 0;
  try{
    const { data:saldoRow } = await sb.from('entrega_clientes_saldos').select('saldo').eq('telefone', estado.cliente.telefone).maybeSingle();
    saldoAtualCliente = saldoRow ? Number(saldoRow.saldo)||0 : 0;
  }catch(e){ console.error(e); mostrarToast('Não consegui checar seu saldo. Tenta novamente.', 'erro'); return; }
  w.saldo = saldoAtualCliente;
  if(saldoAtualCliente < preco){
    mostrarToast('Você está sem saldo. Adicione saldo para continuar.', 'erro');
    abrirAdicionarSaldo();
    setTimeout(()=>{ document.querySelector('.pix-box')?.scrollIntoView({behavior:'smooth', block:'center'}); }, 50);
    return;
  }

  // ---- debita o saldo do cliente de forma atômica no banco ANTES de criar o pedido ----
  // (evita saldo negativo por concorrência: duas abas/pedidos ao mesmo tempo)
  let saldoAposDebito;
  try{
    const { data, error: erroDebito } = await sb.rpc('entrega_ajustar_saldo_cliente_pedido', { p_telefone: estado.cliente.telefone, p_delta: -preco });
    if(erroDebito){
      if(erroDebito.message==='saldo_insuficiente'){
        mostrarToast('Você está sem saldo. Adicione saldo para continuar.', 'erro');
        abrirAdicionarSaldo();
        setTimeout(()=>{ document.querySelector('.pix-box')?.scrollIntoView({behavior:'smooth', block:'center'}); }, 50);
      } else {
        console.error(erroDebito);
        mostrarToast('Não consegui debitar o saldo. Tenta novamente.', 'erro');
      }
      return;
    }
    saldoAposDebito = Number(data)||0;
  }catch(e){ console.error(e); mostrarToast('Não consegui debitar o saldo. Tenta novamente.', 'erro'); return; }
  w.saldo = saldoAposDebito;
  estado.cliente.carteira.saldo = saldoAposDebito;

  const agora = Date.now();
  const pedido = {
    id:'p'+agora+Math.floor(Math.random()*1000),
    clienteNome:f.nome, clienteTelefone:f.telefone,
    origem:f.origem, destino:f.destino, origemCoord:f.origemCoord, destinoCoord:f.destinoCoord,
    origemFotoUrl:f.origemFotoUrl||null, origemReferencia:f.origemReferencia||'',
    destinoFotoUrl:f.destinoFotoUrl||null, destinoReferencia:f.destinoReferencia||'',
    paradas:paradasValidas, paradasCoords:paradasCoordsValidas, paradaAtual:0, tipoRetirada:f.tipoRetirada, horarioAgendado:f.tipoRetirada==='agendado'?f.horarioAgendado:null,
    editado:false, canceladoEm:null, taxaCancelamento:0, prioridade:!!f.prioridade,
    veiculo:f.veiculo, descricao:f.descricao, distancia:f.distancia, distanciaGPS:f.distanciaGPS, distanciaDivergente:!!f.distanciaDivergente, preco:preco,
    extras: {...f.extras},
    status:'buscando', motoristaNome:'', motoristaTelefone:'', criadoEm:agora, atualizadoEm:agora
  };
  const { error: erroSalvar } = await sb.from('entrega_pedidos').upsert(paraCamposDB(pedido));
  if(erroSalvar){
    // não conseguiu criar o pedido: estorna o valor já debitado, senão o cliente perde o dinheiro sem receber nada
    console.error(erroSalvar);
    const { error: erroEstorno } = await sb.rpc('entrega_ajustar_saldo_cliente_pedido', { p_telefone: estado.cliente.telefone, p_delta: preco });
    if(erroEstorno){ console.error(erroEstorno); }
    else{ w.saldo = w.saldo + preco; estado.cliente.carteira.saldo = w.saldo; }
    mostrarToast('Não consegui criar o pedido. O valor debitado foi estornado.', 'erro');
    return;
  }
  estado.ultimoPedidosJSON='';
  estado.filtroTelefoneCliente = f.telefone;
  registrarAlertaAdmin('novo_pedido', `Novo pedido de ${f.nome} (${f.telefone}): ${f.origem} → ${f.destino} · R$ ${preco.toFixed(2)}.`, pedido.id);
  if(f.tipoRetirada!=='agendado'){
    enviarPushServidor('motorista', null, '🆕 Novo pedido disponível!', `${f.origem} → ${f.destino} · R$ ${preco.toFixed(2)}`);
  }
  estado.form = { nome:f.nome, telefone:f.telefone, origem:'', destino:'', paradas:[], tipoRetirada:'agora', horarioAgendado:'', veiculo:'moto', descricao:'', distancia:null, duracaoMin:null, distanciaGPS:null, distanciaDivergente:false, origemCoord:null, destinoCoord:null, prioridade:false, origemFotoUrl:null, origemReferencia:'', destinoFotoUrl:null, destinoReferencia:'', roca:false, extras:extrasVazios() };
  mostrarToast(f.tipoRetirada==='agendado' ? 'Pedido agendado com sucesso!' : 'Pedido criado! Buscando um entregador...', 'sucesso');
  await carregarPedidos();
}

function starsHTML(nota){

  const cheias = Math.round(nota);
  return `<span class="estrelas-fixas">${'★'.repeat(cheias)}${'☆'.repeat(5-cheias)}</span> <span style="color:var(--poeira)">${Number(nota).toFixed(1)}</span>`;

async function avaliarMotorista(pedidoId, nota){
  const p = estado.pedidos.find(x=>x.id===pedidoId);
  if(!p || p.status!=='entregue' || p.avaliacaoNota || !p.motoristaTelefone) return;
  const { error: erroPedido } = await sb.from('entrega_pedidos').update({ avaliacao_nota: nota }).eq('id', pedidoId);
  if(erroPedido){ console.error(erroPedido); mostrarToast('Erro ao salvar a avaliação.', 'erro'); return; }
  const { data: mot, error: erroMot } = await sb.from('entrega_motoristas').select('nota_media,total_avaliacoes').eq('telefone', p.motoristaTelefone).maybeSingle();
  if(!erroMot && mot){
    const totalAtual = Number(mot.total_avaliacoes)||0;
    const mediaAtual = Number(mot.nota_media)||5;
    const novoTotal = totalAtual+1;
    const novaMedia = Math.round(((mediaAtual*totalAtual)+nota)/novoTotal*100)/100;
    await sb.from('entrega_motoristas').update({ nota_media:novaMedia, total_avaliacoes:novoTotal }).eq('telefone', p.motoristaTelefone);
  }
  registrarAlertaAdmin('avaliacao_recebida', `${p.clienteNome||'Cliente'} avaliou ${p.motoristaNome||'motorista'} (${p.motoristaTelefone||''}) com ${nota} estrela(s).`, pedidoId);
  mostrarToast('Obrigado pela avaliação!', 'sucesso');
  estado.ultimoPedidosJSON='';
  await carregarPedidos();
}

// ---------- cancelamento de pedido ----------
function infoCancelamento(p){
  const dentroDaJanela = (Date.now() - p.criadoEm) <= JANELA_CANCELAMENTO_MS;
  const taxa = dentroDaJanela ? 0 : Math.round(p.preco*TAXA_CANCELAMENTO_TARDIO*100)/100;
  return { dentroDaJanela, taxa };
}
function podeCancelar(p){
  return p.status==='buscando' || p.status==='indo_coletar';
}
async function cancelarPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p || !podeCancelar(p)) return;
  const { dentroDaJanela, taxa } = infoCancelamento(p);
  const mensagem = dentroDaJanela
    ? 'Cancelar esta corrida agora? Não haverá cobrança e o valor volta para a sua carteira.'
    : `Já passaram mais de 10 minutos. Cancelar agora vai cobrar uma taxa de R$ ${taxa.toFixed(2)} (10% do valor) — o restante volta para a sua carteira. Confirmar?`;
  if(!(await confirmarAcao(mensagem))) return;
  const agora = Date.now();
  const { error } = await sb.from('entrega_pedidos').update({
    status:'cancelado', atualizado_em:agora, cancelado_em:agora, taxa_cancelamento: dentroDaJanela?0:taxa, cancelado_por:'cliente'
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao cancelar o pedido.', 'erro'); return; }

  // ---- devolve o valor (menos a taxa, se houver) para a carteira do cliente ----
  const valorDevolver = Math.round((p.preco - (dentroDaJanela?0:taxa))*100)/100;
  if(valorDevolver>0){
    try{
      const { data, error: erroEstorno } = await sb.rpc('entrega_ajustar_saldo_cliente_pedido', { p_telefone: p.clienteTelefone, p_delta: valorDevolver });
      if(erroEstorno){
        console.error(erroEstorno);
        mostrarToast('Pedido cancelado, mas houve um erro ao devolver o valor à carteira. Contacta o suporte.', 'erro');
        await carregarPedidos();
        return;
      }
      if(estado.cliente.telefone===p.clienteTelefone){ estado.cliente.carteira.saldo = Number(data)||0; }
    }catch(e){
      console.error(e);
      mostrarToast('Pedido cancelado, mas houve um erro ao devolver o valor à carteira. Contacta o suporte.', 'erro');
      await carregarPedidos();
      return;
    }
  }

  registrarAlertaAdmin('pedido_cancelado_cliente', `Pedido de ${p.clienteNome||'?'} (${p.clienteTelefone||''}) cancelado pelo cliente.${dentroDaJanela?'':` Taxa de R$ ${taxa.toFixed(2)} aplicada.`}`, id);
  if(p.motoristaTelefone) enviarPushServidor('motorista', p.motoristaTelefone, 'Entrega Flash', 'O cliente cancelou a corrida.');
  mostrarToast(dentroDaJanela ? 'Pedido cancelado sem custo. Valor devolvido à sua carteira.' : `Pedido cancelado. Taxa de R$ ${taxa.toFixed(2)} aplicada, o restante voltou para a sua carteira.`, 'sucesso');
  await carregarPedidos();
}

async function confirmarValorCarteira(){

  return estado.pedidos.filter(p=>p.motoristaTelefone===telefone && p.status!=='buscando' && p.criadoEm>=inicioMes).length;
}
function entregasSimultaneasAtivas(telefone){

}
async function aceitarPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  if(estado.motorista.status!=='aprovado'){
    mostrarToast('Ainda falta enviar os documentos e ser aprovado pelo administrador para poderes aceitar corridas.');
    return;
  }
  const plano = PLANOS[estado.motorista.plano] || PLANOS.free;
  if(plano.limiteMensal!=null && entregasDoMesAtual(estado.motorista.telefone)>=plano.limiteMensal){
    mostrarToast(`Limite do plano ${plano.label} (${plano.limiteMensal} entregas/mês) atingido.${plano===PLANOS.free?' Passa para o Pro para entregas ilimitadas.':''}`);
    return;
  }
  if(entregasSimultaneasAtivas(estado.motorista.telefone)>=plano.limiteSimultaneo){
    mostrarToast(`No plano ${plano.label} você pode ter até ${plano.limiteSimultaneo} entregas em andamento ao mesmo tempo. Finaliza uma para aceitar outra.`);
    return;
  }
  const mo = estado.motorista;
  // .eq('status','buscando') garante que a aceitação só vale se NINGUÉM pegou o pedido antes —
  // se dois motoristas tocarem "aceitar" ao mesmo tempo, só o primeiro consegue: o banco resolve
  // isso sozinho, sem risco de dois motoristas ficarem com o mesmo pedido.
  const { data, error } = await sb.from('entrega_pedidos').update({
    status:'indo_coletar', motorista_nome: mo.nome, motorista_telefone: mo.telefone, atualizado_em: Date.now(),
    motorista_foto_url: mo.fotoMotoristaUrl||null, motorista_veiculo_tipo: mo.veiculo||null,
    motorista_marca: mo.marca||null, motorista_cor: mo.cor||null, motorista_placa: mo.placa||null,
    motorista_nota_media: mo.notaMedia!=null?mo.notaMedia:5, motorista_total_avaliacoes: mo.totalAvaliacoes||0,
    iniciado_em: null
  }).eq('id', id).eq('status','buscando').select('id');
  if(error){ console.error(error); mostrarToast('Erro ao aceitar o pedido.', 'erro'); return; }
  if(!data || data.length===0){
    mostrarErro('Esse pedido acabou de ser aceito por outro motorista. Escolhe outro da lista.');
    estado.ultimoPedidosJSON=''; await carregarPedidos();
    return;
  }
  estado.ultimoPedidosJSON='';
  registrarAlertaAdmin('pedido_aceito', `${mo.nome||'Um motorista'} (${mo.telefone||''}) aceitou o pedido de ${p.clienteNome||'?'}.`, id);
  enviarPushServidor('cliente', p.clienteTelefone, 'Entregador encontrado!', `${mo.nome||'Um entregador'} vai levar o seu pedido.`);
  mostrarToast('Pedido aceito! Toque em "Iniciar corrida" quando estiver pronto para seguir até a coleta.', 'sucesso');
  await carregarPedidos();
}
async function iniciarCorrida(id){

// ---------- cancelamento pelo motorista (com limite diário por plano) ----------
async function cancelarPedidoMotorista(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p || p.motoristaTelefone!==estado.motorista.telefone) return;
  if(!['indo_coletar','coletado','a_caminho'].includes(p.status)) return;
  const plano = PLANOS[estado.motorista.plano] || PLANOS.free;
  await carregarCancelamentosMotorista();
  const usados = estado.motorista.cancelamentosHoje||0;
  if(usados>=plano.limiteCancelamentosDia){
    mostrarToast(`Limite de cancelamentos do dia atingido (${usados}/${plano.limiteCancelamentosDia} no plano ${plano.label}). Não é possível cancelar mais entregas hoje.`);
    return;
  }
  if(!(await confirmarAcao(`Cancelar esta entrega? Ela volta para a lista de pedidos disponíveis. Restam ${plano.limiteCancelamentosDia-usados-1} cancelamentos hoje (plano ${plano.label}).`))) return;
  const agora = Date.now();
  const { error } = await sb.from('entrega_pedidos').update({
    status:'buscando', motorista_nome:null, motorista_telefone:null, motorista_foto_url:null,
    motorista_veiculo_tipo:null, motorista_marca:null, motorista_cor:null, motorista_placa:null,
    motorista_nota_media:null, motorista_total_avaliacoes:null, motorista_lat:null, motorista_lng:null,
    iniciado_em:null, cancelado_por:'motorista', atualizado_em: agora
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao cancelar.', 'erro'); return; }
  const { error: erroLog } = await sb.from('entrega_cancelamentos_motorista').insert({
    motorista_telefone: estado.motorista.telefone, pedido_id: id, criado_em: agora
  });
  if(erroLog) console.error(erroLog);
  registrarAlertaAdmin('pedido_cancelado_motorista', `${estado.motorista.nome||'Um motorista'} (${estado.motorista.telefone||''}) cancelou a entrega de ${p.clienteNome||'?'}.`, id);
  if(p.clienteTelefone) enviarPushServidor('cliente', p.clienteTelefone, 'Entrega Flash', 'O motorista cancelou a corrida. Estamos a buscar outro entregador perto de ti.');
  const aindaAtivos = estado.pedidos.some(x=>x.id!==id && x.motoristaTelefone===estado.motorista.telefone && x.iniciadoEm && ['indo_coletar','coletado','a_caminho'].includes(x.status));
  if(!aindaAtivos) pararRastreioMotorista();
  mostrarToast('Entrega cancelada e devolvida à lista de pedidos disponíveis.', 'sucesso');
  estado.ultimoPedidosJSON='';
  await carregarCancelamentosMotorista();
  await carregarPedidos();
}

}
async function carregarCancelamentosMotorista(){

async function avancarStatus(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const i = ESTAGIOS.indexOf(p.status);
  if(i < ESTAGIOS.length-1){
    const novoStatus = ESTAGIOS[i+1];
    const agora = Date.now();
    const { error } = await sb.from('entrega_pedidos').update({ status: novoStatus, atualizado_em: agora }).eq('id', id);
    if(error){ console.error(error); mostrarToast('Erro ao atualizar o pedido.', 'erro'); return; }
    estado.ultimoPedidosJSON='';
    if(novoStatus==='entregue'){
      registrarAlertaAdmin('pedido_entregue', `Pedido de ${p.clienteNome||'?'} entregue por ${p.motoristaNome||'?'} (${p.motoristaTelefone||''}) · R$ ${Number(p.preco||0).toFixed(2)}.`, id);
      const aindaAtivos = estado.pedidos.some(x=>x.id!==id && x.motoristaTelefone===p.motoristaTelefone && x.iniciadoEm && ['indo_coletar','coletado','a_caminho'].includes(x.status));
      if(!aindaAtivos) pararRastreioMotorista();
      const ganhoTotal = ganhoMotorista(p.preco);
      if(p.motoristaAmigoSolicitante && p.motoristaAmigoPercentual!=null){
        // entrega assumida via "motorista amigo" — divide entre quem pediu ajuda e quem ajudou
        const valorSolicitante = Math.round(ganhoTotal * (p.motoristaAmigoPercentual/100) * 100)/100;
        const valorAjudante = Math.round((ganhoTotal - valorSolicitante)*100)/100;
        const [creditoSolicitante, creditoAjudante] = await Promise.all([
          creditarSaldoMotorista(p.motoristaAmigoSolicitante, valorSolicitante),
          creditarSaldoMotorista(p.motoristaTelefone, valorAjudante)
        ]);
        if(creditoSolicitante.ok && creditoAjudante.ok){
          mostrarToast(`Entrega concluída! Tu ficaste com R$ ${valorAjudante.toFixed(2)} e R$ ${valorSolicitante.toFixed(2)} foi creditado a quem te chamou.`, 'sucesso');
        } else {
          mostrarErro('Entrega concluída, mas houve um erro ao dividir o valor. Avisa o suporte com o ID deste pedido, vamos corrigir manualmente.');
        }
      } else {
        const resultadoCredito = await creditarSaldoMotorista(p.motoristaTelefone, ganhoTotal);
        if(resultadoCredito.ok){
          mostrarToast(`Entrega concluída! R$ ${ganhoTotal.toFixed(2)} creditado.`, 'sucesso');
        } else {
          mostrarErro('Entrega concluída, mas houve um erro ao creditar o valor na sua carteira. Avisa o suporte com o ID deste pedido, vamos corrigir manualmente.');
        }
      }
    }
    await carregarPedidos();
  }
}

// ---------- foto obrigatória antes/depois (com verificação de localização) ----------
let fotoPendente = null; // { pedidoId, tipo }
function obterPosicaoAtual(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos)=>resolve({ lat:pos.coords.latitude, lon:pos.coords.longitude }),
      ()=>resolve(ultimaPosicaoMotorista || null),
      { enableHighAccuracy:true, timeout:8000, maximumAge:5000 }
    );
  });
}
async function verificarNoEndereco(coordAlvo){
  if(!coordAlvo) return { dentro:true, distanciaKm:0 }; // sem coordenada cadastrada, não bloqueia
  const posicao = await obterPosicaoAtual();
  if(!posicao) return { dentro:false, distanciaKm:null, semGps:true };
  const distanciaKmAtual = distanciaKm(posicao.lat, posicao.lon, coordAlvo.lat, coordAlvo.lon);
  return { dentro: distanciaKmAtual<=RAIO_GEOFENCE_KM, distanciaKm: distanciaKmAtual };
}
async function solicitarFoto(pedidoId, tipo){
  const p = estado.pedidos.find(x=>x.id===pedidoId);
  if(!p) return;
  let coordAlvo;
  if(tipo==='antes'){
    coordAlvo = p.origemCoord;
  } else {
    const listaParadas = listaDestinosPedido(p);
    coordAlvo = listaParadas[listaParadas.length-1].coord;
  }
  mostrarToast('Verificando a sua localização...');
  const resultado = await verificarNoEndereco(coordAlvo);
  if(resultado.semGps){
    mostrarToast('Não consegui confirmar a sua localização. Ative o GPS e tente novamente.', 'erro');
    return;
  }
  if(!resultado.dentro){
    const faltam = resultado.distanciaKm!=null ? ` (faltam ~${resultado.distanciaKm.toFixed(2)} km)` : '';
    mostrarToast(`Só pode ${tipo==='antes'?'coletar':'finalizar a entrega'} quando estiver no endereço${faltam}.`);
    return;
  }
  fotoPendente = { pedidoId, tipo };
  document.getElementById('input-foto').click();
}
async function confirmarParadaIntermediaria(pedidoId){
  const p = estado.pedidos.find(x=>x.id===pedidoId);
  if(!p || p.motoristaTelefone!==estado.motorista.telefone || p.status!=='a_caminho') return;
  const listaParadas = listaDestinosPedido(p);
  const paradaAtualIdx = Math.min(p.paradaAtual||0, listaParadas.length-1);
  if(paradaAtualIdx >= listaParadas.length-1) return; // já é a última, deve usar solicitarFoto
  mostrarToast('Verificando a sua localização...');
  const resultado = await verificarNoEndereco(listaParadas[paradaAtualIdx].coord);
  if(resultado.semGps){
    mostrarToast('Não consegui confirmar a sua localização. Ative o GPS e tente novamente.', 'erro');
    return;
  }
  if(!resultado.dentro){
    const faltam = resultado.distanciaKm!=null ? ` (faltam ~${resultado.distanciaKm.toFixed(2)} km)` : '';
    mostrarToast(`Só pode confirmar essa parada quando estiver no endereço${faltam}.`);
    return;
  }
  const { error } = await sb.from('entrega_pedidos').update({ parada_atual: paradaAtualIdx+1, atualizado_em: Date.now() }).eq('id', pedidoId);
  if(error){ console.error(error); mostrarToast('Erro ao confirmar a parada.', 'erro'); return; }
  estado.ultimoPedidosJSON='';
  mostrarToast(`Parada ${paradaAtualIdx+1} de ${listaParadas.length} entregue! Segue para a próxima.`, 'sucesso');
  await carregarPedidos();
}
async function processarFotoSelecionada(input){
  const file = input.files && input.files[0];

  const pendente = fotoPendente; fotoPendente = null;

  const { data: pub } = sb.storage.from('entrega-fotos').getPublicUrl(nomeArquivo);

// ---------- rastreio ao vivo ----------
let avisoLocalizacaoMostrado = false;
function iniciarRastreioMotorista(){
  if(watchId!=null) return;
  if(!window.isSecureContext){
    // navegadores modernos bloqueiam geolocalização fora de HTTPS (exceto localhost) — sem isso, a posição nunca chega
    if(!avisoLocalizacaoMostrado){ avisoLocalizacaoMostrado=true; mostrarToast('Não foi possível ativar a localização: o app precisa estar em HTTPS.', 'erro'); }
    return;
  }
  if(!navigator.geolocation){
    if(!avisoLocalizacaoMostrado){ avisoLocalizacaoMostrado=true; mostrarToast('Este navegador não tem suporte a localização.', 'erro'); }
    return;
  }
  watchId = navigator.geolocation.watchPosition(
    (pos)=>{ ultimaPosicaoMotorista = { lat:pos.coords.latitude, lon:pos.coords.longitude }; enviarPosicaoMotorista(); },
    (err)=>{
      console.warn(err);
      if(!avisoLocalizacaoMostrado){
        avisoLocalizacaoMostrado = true;
        const msg = err && err.code===1 ? 'Localização bloqueada. Ative a permissão de localização pro app pra aparecer no mapa e receber pedidos.'
          : 'Não consegui obter sua localização agora. Verifique o GPS e tente de novo.';
        mostrarToast(msg, 'erro');
      }
    },
    { enableHighAccuracy:true, maximumAge:10000 }
  );
  if(!window._envioIntervalo) window._envioIntervalo = setInterval(enviarPosicaoMotorista, 8000);
}
function pararRastreioMotorista(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } avisoLocalizacaoMostrado=false; }
async function enviarPosicaoMotorista(){
  if(!ultimaPosicaoMotorista || !estado.motorista.ativo) return;
  // grava a posição atual do motorista sempre que ele estiver logado — isso alimenta o mapa
  // geral do admin, que mostra motoristas disponíveis mesmo sem corrida em andamento
  if(estado.motorista.telefone){
    sb.from('entrega_motoristas').update({
      lat_atual: ultimaPosicaoMotorista.lat, lng_atual: ultimaPosicaoMotorista.lon, lat_atualizado_em: Date.now()
    }).eq('telefone', estado.motorista.telefone);
  }
  const ativos = estado.pedidos.filter(p=>p.motoristaTelefone===estado.motorista.telefone && p.iniciadoEm && ['indo_coletar','coletado','a_caminho'].includes(p.status));
  if(ativos.length===0) return;
  await Promise.all(ativos.map(p=>sb.from('entrega_pedidos').update({
    motorista_lat: ultimaPosicaoMotorista.lat, motorista_lng: ultimaPosicaoMotorista.lon, motorista_atualizado_em: Date.now()
  }).eq('id', p.id)));
  estado.ultimoPedidosJSON='';
}

// ---------- mapa ----------
// O app inteiro é re-renderizado via innerHTML a cada atualização (realtime/polling).
// Para o carro "andar" suavemente em vez de saltar a cada atualização, o mapa Leaflet e
// seus marcadores vivem numa div separada, guardada em memória (mapasAtivos), que é
// apenas RE-ENCAIXADA dentro do novo slot do template a cada render — nunca recriada do zero.
function montarMapa(containerId, pedido){
  setTimeout(()=>{
    const slot = document.getElementById(containerId);
    if(!slot || !pedido.origemCoord || !pedido.destinoCoord) return;
    const pO=[pedido.origemCoord.lat,pedido.origemCoord.lon], pD=[pedido.destinoCoord.lat,pedido.destinoCoord.lon];
    const pM = pedido.motoristaCoord ? [pedido.motoristaCoord.lat,pedido.motoristaCoord.lon] : null;
    const alvo = (pedido.status==='indo_coletar') ? pO : pD;
    let m = mapasAtivos[containerId];
    if(!m){
      const div = document.createElement('div');
      div.style.width='100%'; div.style.height='100%';
      slot.appendChild(div);
      const map = L.map(div,{zoomControl:false, attributionControl:false});
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      L.marker(pO,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#ff5a3c;border:2px solid #fff"></div>'})}).addTo(map);
      L.marker(pD,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#7fae72;border:2px solid #fff"></div>'})}).addTo(map);
      L.polyline([pO,pD],{color:'#a9a89c',weight:2,opacity:0.35,dashArray:'5,7'}).addTo(map);
      m = { el:div, map, mMotorista:null, linhaMotorista:null, posAtual:null, raf:null };
      mapasAtivos[containerId]=m;
      map.fitBounds(pM?[pO,pD,pM]:[pO,pD],{padding:[24,24]});
      // o card acabou de entrar no DOM (innerHTML recém-renderizado) — o Leaflet às vezes calcula
      // o tamanho do container antes do layout/CSS terminarem de assentar, e o mapa fica em branco.
      // Forçamos um recálculo de tamanho logo depois para garantir que os tiles apareçam.
      setTimeout(()=>{ try{ m.map.invalidateSize(); m.map.fitBounds(pM?[pO,pD,pM]:[pO,pD],{padding:[24,24]}); }catch(e){} }, 200);
    } else if(m.el.parentElement!==slot){
      // o container do template foi recriado no último render — reencaixa o mapa vivo nele
      slot.appendChild(m.el);
      setTimeout(()=>{ try{ m.map.invalidateSize(); }catch(e){} },0);
    }
    if(pM){
      const emoji = (VEICULOS[pedido.veiculo]&&VEICULOS[pedido.veiculo].emoji)||'🚗';
      if(!m.mMotorista){
        m.mMotorista = L.marker(pM,{icon:iconeMotorista(emoji)}).addTo(m.map);
        m.linhaMotorista = L.polyline([pM,alvo],{color:'#ffc93c',weight:5,opacity:0.9,lineCap:'round'}).addTo(m.map);
        m.posAtual = pM;
        m.map.fitBounds([pO,pD,pM],{padding:[24,24]});
      } else if(m.posAtual && (m.posAtual[0]!==pM[0] || m.posAtual[1]!==pM[1])){
        animarMotorista(m, m.posAtual, pM, alvo);
      } else if(m.linhaMotorista){
        m.linhaMotorista.setLatLngs([pM,alvo]);
      }
    }
  },30);
}

function iconeBolinhaMapa(emoji, classeCor){

// desliza o marcador do motorista da posição antiga até a nova em vez de "teleportar"
function animarMotorista(m, de, para, alvo){
  if(m.raf) cancelAnimationFrame(m.raf);
  const inicio = performance.now();
  const duracao = 3500;
  function passo(agora){
    const t = Math.min(1, (agora-inicio)/duracao);
    const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    const lat = de[0]+(para[0]-de[0])*ease;
    const lon = de[1]+(para[1]-de[1])*ease;
    if(m.mMotorista) m.mMotorista.setLatLng([lat,lon]);
    if(m.linhaMotorista) m.linhaMotorista.setLatLngs([[lat,lon],alvo]);
    if(t<1){ m.raf=requestAnimationFrame(passo); } else { m.posAtual=para; m.raf=null; }
  }
  m.raf = requestAnimationFrame(passo);
}
// desliza um marcador simples (sem linha até um alvo) da posição antiga até a nova
function animarMarcadorSimples(mk, de, para){
  if(mk.raf) cancelAnimationFrame(mk.raf);
  const inicio = performance.now();
  const duracao = 3500;
  function passo(agora){
    const t = Math.min(1, (agora-inicio)/duracao);
    const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    const lat = de[0]+(para[0]-de[0])*ease;
    const lon = de[1]+(para[1]-de[1])*ease;
    mk.marker.setLatLng([lat,lon]);
    if(t<1){ mk.raf=requestAnimationFrame(passo); } else { mk.posAtual=para; mk.raf=null; }
  }
  mk.raf = requestAnimationFrame(passo);
}
// ---------- mapa geral do admin: mostra AO VIVO motoristas em corrida, motoristas disponíveis e clientes aguardando ----------
// idade máxima de uma posição pra ainda ser considerada "ao vivo" (motorista pode ter fechado o app sem sair)
const POSICAO_MOTORISTA_MAX_IDADE_MS = 6*60*1000; // 6 minutos
function montarMapaAdminGeral(){
  setTimeout(()=>{
    const slot = document.getElementById('admin-mapa-geral');
    if(!slot) return; // painel admin não está na aba Resumo agora — não há onde montar
    // pega, por motorista, o pedido ativo mais recente com posição conhecida
    const porTelefone = {};
    (estado.admin.todosPedidos||[]).forEach(p=>{
      if(!['indo_coletar','coletado','a_caminho'].includes(p.status)) return;
      if(p.motorista_lat==null || p.motorista_lng==null || !p.motorista_telefone) return;
      const atual = porTelefone[p.motorista_telefone];
      if(!atual || Number(p.motorista_atualizado_em||0) > Number(atual.motorista_atualizado_em||0)){
        porTelefone[p.motorista_telefone] = p;
      }
    });
    const emCorrida = Object.values(porTelefone);
    const telefonesEmCorrida = new Set(emCorrida.map(p=>p.motorista_telefone));
    const agora = Date.now();
    // motoristas disponíveis: online, aprovados, com posição conhecida e recente, e que não estejam já contados como "em corrida"
    const disponiveis = (estado.admin.motoristas||[]).filter(m=>
      m.disponivel && m.status==='aprovado' && m.lat_atual!=null && m.lng_atual!=null &&
      !telefonesEmCorrida.has(m.telefone) && (agora - Number(m.lat_atualizado_em||0)) < POSICAO_MOTORISTA_MAX_IDADE_MS
    );
    // clientes aguardando: pedidos ainda buscando motorista, com endereço de origem já geolocalizado
    const aguardando = (estado.admin.todosPedidos||[]).filter(p=>p.status==='buscando' && p.origem_lat!=null && p.origem_lng!=null);
    const todasPosicoes = [
      ...emCorrida.map(p=>[p.motorista_lat,p.motorista_lng]),
      ...disponiveis.map(m=>[m.lat_atual,m.lng_atual]),
      ...aguardando.map(p=>[p.origem_lat,p.origem_lng])
    ];
    if(!mapaAdminGeral){
      const div = document.createElement('div');
      div.style.width='100%'; div.style.height='100%';
      slot.appendChild(div);
      const map = L.map(div,{zoomControl:true, attributionControl:false});
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      map.setView([-14.235,-51.9253], 4); // centro do Brasil, até termos algo pra enquadrar
      const legenda = L.control({position:'bottomright'});
      legenda.onAdd = function(){
        const div = L.DomUtil.create('div','legenda-mapa-admin');
        div.innerHTML = `
          <div class="item"><span class="ponto" style="background:#2ecc71"></span>Motorista disponível</div>
          <div class="item"><span class="ponto" style="background:#ff9330"></span>Motorista em corrida</div>
          <div class="item"><span class="ponto" style="background:#3fa7ff"></span>Cliente aguardando</div>`;
        return div;
      };
      legenda.addTo(map);
      mapaAdminGeral = { el:div, map, marcadores:{}, marcadoresDisponiveis:{}, marcadoresClientes:{} };
      setTimeout(()=>{ try{ mapaAdminGeral.map.invalidateSize(); }catch(e){} }, 200);
    } else if(mapaAdminGeral.el.parentElement !== slot){
      // o container do template foi recriado no último render — reencaixa o mapa vivo nele
      slot.appendChild(mapaAdminGeral.el);
      setTimeout(()=>{ try{ mapaAdminGeral.map.invalidateSize(); }catch(e){} }, 0);
    }
    // ---- motoristas em corrida (bolinha laranja, ícone do veículo) ----
    const telefonesAtivos = new Set();
    emCorrida.forEach(p=>{
      telefonesAtivos.add(p.motorista_telefone);
      const pos = [p.motorista_lat, p.motorista_lng];
      const emoji = (VEICULOS[p.motorista_veiculo_tipo]&&VEICULOS[p.motorista_veiculo_tipo].emoji) || '🛵';
      const popup = `<b>${p.motorista_nome||'Motorista'}</b>${p.motorista_telefone?`<br>📞 ${p.motorista_telefone}`:''}<br>${STATUS_MAPA_ADMIN[p.status]||p.status}<br>Cliente: ${p.cliente_nome||'—'}`;
      let mk = mapaAdminGeral.marcadores[p.motorista_telefone];
      if(!mk){
        const marker = L.marker(pos,{icon:iconeBolinhaMapa(emoji,'bolinha-corrida')}).addTo(mapaAdminGeral.map).bindPopup(popup);
        mapaAdminGeral.marcadores[p.motorista_telefone] = { marker, posAtual:pos, raf:null };
      } else {
        mk.marker.setPopupContent(popup);
        if(mk.posAtual[0]!==pos[0] || mk.posAtual[1]!==pos[1]){
          animarMarcadorSimples(mk, mk.posAtual, pos);
        }
      }
    });
    // remove do mapa quem não está mais em corrida (entregou, cancelou ou ficou indisponível)
    Object.keys(mapaAdminGeral.marcadores).forEach(tel=>{
      if(!telefonesAtivos.has(tel)){
        try{ mapaAdminGeral.map.removeLayer(mapaAdminGeral.marcadores[tel].marker); }catch(e){}
        delete mapaAdminGeral.marcadores[tel];
      }
    });
    // ---- motoristas disponíveis, sem corrida no momento (bolinha verde) ----
    const telefonesDisponiveisAtivos = new Set();
    disponiveis.forEach(m=>{
      telefonesDisponiveisAtivos.add(m.telefone);
      const pos = [m.lat_atual, m.lng_atual];
      const emoji = (VEICULOS[m.veiculo_tipo]&&VEICULOS[m.veiculo_tipo].emoji) || '🛵';
      const desde = m.disponivel_atualizado_em ? `<br>Disponível ${tempoDecorrido(Number(m.disponivel_atualizado_em))}` : '';
      const popup = `<b>${m.nome||'Motorista'}</b>${m.telefone?`<br>📞 ${m.telefone}`:''}<br>🟢 Disponível${desde}`;
      let mk = mapaAdminGeral.marcadoresDisponiveis[m.telefone];
      if(!mk){
        const marker = L.marker(pos,{icon:iconeBolinhaMapa(emoji,'bolinha-disponivel')}).addTo(mapaAdminGeral.map).bindPopup(popup);
        mapaAdminGeral.marcadoresDisponiveis[m.telefone] = { marker, posAtual:pos, raf:null };
      } else {
        mk.marker.setPopupContent(popup);
        if(mk.posAtual[0]!==pos[0] || mk.posAtual[1]!==pos[1]){
          animarMarcadorSimples(mk, mk.posAtual, pos);
        }
      }
    });
    Object.keys(mapaAdminGeral.marcadoresDisponiveis).forEach(tel=>{
      if(!telefonesDisponiveisAtivos.has(tel)){
        try{ mapaAdminGeral.map.removeLayer(mapaAdminGeral.marcadoresDisponiveis[tel].marker); }catch(e){}
        delete mapaAdminGeral.marcadoresDisponiveis[tel];
      }
    });
    // ---- clientes aguardando motorista (bolinha azul) ----
    const idsAguardandoAtivos = new Set();
    aguardando.forEach(p=>{
      idsAguardandoAtivos.add(p.id);
      const pos = [p.origem_lat, p.origem_lng];
      const popup = `<b>${p.cliente_nome||'Cliente'}</b>${p.cliente_telefone?`<br>📞 ${p.cliente_telefone}`:''}<br>⏳ Aguardando ${tempoDecorrido(Number(p.criado_em))}${p.origem?`<br>${p.origem}`:''}`;
      let mk = mapaAdminGeral.marcadoresClientes[p.id];
      if(!mk){
        const marker = L.marker(pos,{icon:iconeBolinhaMapa('👤','bolinha-cliente')}).addTo(mapaAdminGeral.map).bindPopup(popup);
        mapaAdminGeral.marcadoresClientes[p.id] = { marker, posAtual:pos };
      } else {
        mk.marker.setLatLng(pos);
        mk.marker.setPopupContent(popup);
        mk.posAtual = pos;
      }
    });
    Object.keys(mapaAdminGeral.marcadoresClientes).forEach(id=>{
      if(!idsAguardandoAtivos.has(id)){
        try{ mapaAdminGeral.map.removeLayer(mapaAdminGeral.marcadoresClientes[id].marker); }catch(e){}
        delete mapaAdminGeral.marcadoresClientes[id];
      }
    });
    if(todasPosicoes.length>0){
      try{ mapaAdminGeral.map.fitBounds(todasPosicoes, {padding:[36,36], maxZoom:14}); }catch(e){}
    }
  }, 30);
}

function etaHTML(pedido){
  if(!pedido.motoristaCoord) return `<div class="subtitulo" style="margin-top:8px">Aguardando o entregador iniciar a rota...</div>`;
  const alvo = (pedido.status==='indo_coletar') ? pedido.origemCoord : pedido.destinoCoord;
  if(!alvo) return '';
  const km = distanciaKm(pedido.motoristaCoord.lat,pedido.motoristaCoord.lon,alvo.lat,alvo.lon);
  const min = Math.max(1, Math.round((km/VEICULOS[pedido.veiculo].veloc)*60));
  const txt = pedido.status==='indo_coletar' ? 'até a coleta' : 'até o seu endereço';
  registrarEta(pedido.id, min);
  return `<div class="eta-banner"><div class="eta-min" id="eta-min-${pedido.id}">~${min} min</div><div class="eta-sub" id="eta-sub-${pedido.id}">${km.toFixed(1)} km ${txt} · atualizado em tempo real</div></div>`;
}
// ---------- contagem regressiva do ETA em tempo real ----------
// a cada atualização real de posição (registrarEta) fixamos o valor "oficial"; entre uma
// atualização e outra (a cada 8-15s), o número vai diminuindo sozinho, segundo a segundo
function registrarEta(pedidoId, minutos){
  etaEstado[pedidoId] = { segundos: minutos*60, ultimoOficial: minutos*60 };
}
function iniciarTickEta(){
  if(etaTickInterval) return;
  etaTickInterval = setInterval(()=>{
    Object.keys(etaEstado).forEach(id=>{
      const el = document.getElementById('eta-min-'+id);
      if(!el){ delete etaEstado[id]; return; }
      const e = etaEstado[id];
      if(e.segundos>30) e.segundos -= 1;
      el.textContent = '~'+Math.max(1,Math.round(e.segundos/60))+' min';
    });
  },1000);
}

function cartaoPedidoAtivo(p){
  const i = ESTAGIOS.indexOf(p.status);
  const proximo = i<ESTAGIOS.length-1 ? ESTAGIOS[i+1] : null;
  const listaParadas = listaDestinosPedido(p);
  const paradaAtualIdx = Math.min(p.paradaAtual||0, listaParadas.length-1);
  const temMaisParadas = listaParadas.length>1;
  const ultimaParada = paradaAtualIdx === listaParadas.length-1;
  const enderecoAtualEntrega = listaParadas[paradaAtualIdx].endereco;
  const enderecoGPS = (p.status==='indo_coletar') ? p.origem : enderecoAtualEntrega;
  const mapaId = 'mapa-m-'+p.id;
  const aguardandoInicio = p.status==='indo_coletar' && !p.iniciadoEm;
  let botaoAcao = '';
  if(aguardandoInicio){
    botaoAcao = `<button class="btn btn-primario btn-pequeno" ${atributoDesabilitado('iniciarCorrida_'+p.id)} onclick="executarComCarregando('iniciarCorrida_${p.id}', ()=>iniciarCorrida('${p.id}'))">${rotuloCarregando('iniciarCorrida_'+p.id, '▶️ Iniciar corrida', 'Iniciando...')}</button>`;
  } else if(p.status==='indo_coletar'){
    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="solicitarFoto('${p.id}','antes')">📷 Cheguei / tirar foto e recolher (obrigatória)</button>`;
  } else if(p.status==='coletado'){
    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="avancarStatus('${p.id}')">Segui viagem</button>`;
  } else if(p.status==='a_caminho' && temMaisParadas && !ultimaParada){
    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="confirmarParadaIntermediaria('${p.id}')">✅ Confirmar chegada nesta parada (${paradaAtualIdx+1}/${listaParadas.length})</button>`;
  } else if(p.status==='a_caminho'){
    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="solicitarFoto('${p.id}','depois')">📷 ${temMaisParadas?`Tirar foto e finalizar a última parada (${paradaAtualIdx+1}/${listaParadas.length})`:'Tirar foto e marcar entregue'} (obrigatória — precisa estar no endereço)</button>`;
  }
  const plano = PLANOS[estado.motorista.plano] || PLANOS.free;
  const usados = estado.motorista.cancelamentosHoje||0;
  const podeCancelarMotorista = ['indo_coletar','coletado','a_caminho'].includes(p.status);
  return `
  <div class="pedido">
    <div class="linha-topo">
      <div class="end"><b>Recolha</b>${p.origem}<b style="margin-top:8px">Entrega</b>${p.destino}</div>
      <div class="preco">R$ ${p.preco.toFixed(2)}<span class="ganho">você recebe R$ ${ganhoMotorista(p.preco).toFixed(2)}</span></div>
    </div>
    ${p.status==='a_caminho' && temMaisParadas ? `<div class="subtitulo" style="margin-top:6px;background:var(--painel-alt);border-radius:8px;padding:8px 10px">📍 Parada atual (${paradaAtualIdx+1} de ${listaParadas.length}): <b style="color:var(--osso)">${enderecoAtualEntrega}</b></div>` : ''}
    ${p.prioridade ? `<span class="selo selo-prioridade">🚀 Entrega prioritária</span>` : ''}
    ${extrasHTML(p)}
    ${seloHTML(p.status)}
    ${trilhaHTML(p.status)}
    <div style="font-size:14px;color:var(--poeira);margin-top:10px">Cliente: <b style="color:var(--osso)">${p.clienteNome}</b> · ${p.clienteTelefone}</div>
    ${p.status==='indo_coletar' && (p.origemReferencia || p.origemFotoUrl) ? `<div class="subtitulo" style="margin-top:8px;background:var(--painel-alt);border-radius:8px;padding:8px 10px">
      ${p.origemReferencia ? `📝 ${p.origemReferencia}<br>` : ''}
      ${p.origemFotoUrl ? `<a href="${p.origemFotoUrl}" target="_blank" style="color:var(--mango)">📸 Ver foto do local</a>` : ''}
    </div>` : ''}
    ${p.status==='indo_coletar' && !p.origemCoord ? `<div class="ligar-antes-aviso" style="margin-top:8px"><span style="font-size:20px">📞</span><div class="laa-texto"><b>Local sem GPS exato.</b> Recomendamos ligar pro cliente antes de sair, pra confirmar o caminho.</div></div>` : ''}
    ${p.status==='a_caminho' && (p.destinoReferencia || p.destinoFotoUrl) ? `<div class="subtitulo" style="margin-top:8px;background:var(--painel-alt);border-radius:8px;padding:8px 10px">
      ${p.destinoReferencia ? `📝 ${p.destinoReferencia}<br>` : ''}
      ${p.destinoFotoUrl ? `<a href="${p.destinoFotoUrl}" target="_blank" style="color:var(--mango)">📸 Ver foto do local</a>` : ''}
    </div>` : ''}
    ${p.status==='a_caminho' && !p.destinoCoord ? `<div class="ligar-antes-aviso" style="margin-top:8px"><span style="font-size:20px">📞</span><div class="laa-texto"><b>Local sem GPS exato.</b> Recomendamos ligar pro cliente antes de seguir viagem, pra confirmar o caminho.</div></div>` : ''}
    ${p.iniciadoEm && p.status!=='entregue' ? `<div class="gps-ao-vivo"><span class="ponto-pulsante"></span> localização a atualizar em tempo real</div>` : ''}
    ${p.origemCoord && p.destinoCoord ? `<div class="mapa" id="${mapaId}"></div>` : ''}
    ${fotosHTML(p)}
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      ${p.status==='indo_coletar' && p.origemCoord
        ? `<button class="btn btn-azul btn-pequeno" onclick="abrirGPSCoord(${p.origemCoord.lat},${p.origemCoord.lon})">📍 GPS</button>`
        : `<button class="btn btn-azul btn-pequeno" onclick="abrirGPS('${enderecoGPS.replace(/'/g,"\\'")}')">📍 GPS</button>`}
      ${botaoChatHTML(p.id, estado.chatNaoLidas[p.id]||0)}
      ${botaoLigarHTML(p.clienteTelefone)}
      ${proximo ? botaoAcao : ''}
    </div>
    ${podeCancelarMotorista ? `
    <div class="cancelamento-motorista-box">
      <div>Cancelamentos hoje: <b>${usados}/${plano.limiteCancelamentosDia}</b> (plano ${plano.label}) — ${plano.label==='Free' ? 'até 3 cancelamentos por dia' : 'até 10 cancelamentos por dia'}</div>
      <button class="btn btn-chama btn-pequeno" style="margin-top:6px" ${atributoDesabilitado('cancelarPedidoMotorista_'+p.id)} onclick="executarComCarregando('cancelarPedidoMotorista_${p.id}', ()=>cancelarPedidoMotorista('${p.id}'))">${rotuloCarregando('cancelarPedidoMotorista_'+p.id, 'Cancelar esta entrega', 'Cancelando...')}</button>
    </div>` : ''}
    ${podeCancelarMotorista && (PLANOS[estado.motorista.plano]||PLANOS.free).label==='Pro' ? `
    <button class="btn btn-secundario btn-pequeno" style="margin-top:8px" onclick="abrirChamadoAmigo('${p.id}')">🆘 Veículo quebrou? Chamar motorista amigo</button>` : ''}
  </div>`;
}
function extrasHTML(p){
  const ativos = extrasAtivos(p.extras);
  if(ativos.length===0) return '';

}
function telaCliente(){

        <button class="btn btn-primario btn-pequeno" style="margin-top:10px" onclick="irParaCadastroEntregadorViaBanner()">Cadastrar-me agora</button>

    ${(f.paradas||[]).length < MAX_PARADAS_EXTRA ? `<button type="button" class="btn-add-parada" onclick="adicionarParada()">+ Adicionar mais um endereço de entrega (até 10 no total)</button>` : ''}

      : listaExibida.length===0
        ? `<div class="vazio"><span class="emoji-grande">📦</span>${estado.abaPedidosCliente==='ativos'?'Nenhum pedido em andamento.':'Ainda não há pedidos no histórico.'}</div>`

function telaAcessoMotorista(){
  const pm = estado.painelMotorista;
  if(pm.tela==='basico'){
    return `<div class="box-status"><span class="bs-emoji">📝</span><div class="bs-titulo">Cadastro recebido!</div><div class="bs-texto">Já dá pra conhecer o app — falta só enviar os documentos. Estamos a analisar os teus dados e assim que for liberado, avisamos aqui e por WhatsApp pra enviares tudo e começares a receber corridas.</div>
      <button class="btn btn-secundario" style="margin-top:16px" onclick="irParaLogin()">Voltar</button></div>`;
  }
  if(pm.tela==='liberado'){
    return `<div class="box-status"><span class="bs-emoji">🎉</span><div class="bs-titulo">Cadastro liberado!</div><div class="bs-texto">Envia os teus documentos agora pra começares a receber corridas ainda hoje.</div>
      <button class="btn btn-primario" style="margin-top:16px" ${pm.carregandoLiberado?'disabled':''} onclick="continuarParaDocumentos()">${pm.carregandoLiberado?'A carregar...':'📄 Enviar documentos'}</button></div>`;
  }
  if(pm.tela==='pendente'){
    return `<div class="box-status"><span class="bs-emoji">⏳</span><div class="bs-titulo">Cadastro em análise</div><div class="bs-texto">Recebemos os seus dados e o pagamento da taxa. Vamos avisar-te por WhatsApp assim que o cadastro for aprovado.</div></div>`;
  }
  if(pm.tela==='reprovado'){

          ${m.totalAvaliacoes>0 ? `<span style="font-size:13px">${starsHTML(m.notaMedia)} <span style="color:var(--poeira)">(${m.totalAvaliacoes})</span></span>` : ''}
        </div>
      </div>
    </div>
    ${veiculoInfo ? `
    <div class="perfil-motorista-linha" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--linha)">

      <div><b>${veiculoInfo.label}</b>${detalhesVeiculo ? ` <span style="color:var(--poeira)">· ${detalhesVeiculo}</span>` : ''}</div>
    </div>` : ''}

}
function telaMotorista(){
  const m = estado.motorista;
  if(!m.ativo){
    if(estado.sessaoCarregando) return `<div class="cartao"><div class="vazio"><span class="emoji-grande">⏳</span>A retomar a sua sessão...</div></div>`;
    return telaAcessoMotorista();
  }
  const planoAtual = PLANOS[m.plano] || PLANOS.free;
  const agoraTs = Date.now();
  const disponiveis = m.disponivel ? estado.pedidos
    .filter(p=>p.status==='buscando' && p.veiculo===m.veiculo && (p.prioridade || planoAtual.prioridade || (agoraTs-p.criadoEm)>=ATRASO_PRIORIDADE_PRO_MS))
    .map(p=>({ ...p, distanciaAteMim: (ultimaPosicaoMotorista && p.origemCoord) ? distanciaKm(ultimaPosicaoMotorista.lat,ultimaPosicaoMotorista.lon,p.origemCoord.lat,p.origemCoord.lon) : null }))
    // raio de atendimento é um benefício do plano Pro — só filtra por distância quem tem plano Pro e configurou um raio
    .filter(p=> !(m.plano==='pro' && m.raioAtendimentoKm && p.distanciaAteMim!=null) || p.distanciaAteMim<=m.raioAtendimentoKm)
    .sort((a,b)=> (b.prioridade?1:0) - (a.prioridade?1:0) || (a.distanciaAteMim!=null && b.distanciaAteMim!=null ? a.distanciaAteMim-b.distanciaAteMim : a.criadoEm-b.criadoEm)) : [];
  // chamados de "motorista amigo" (SOS) abertos por outros motoristas, compatíveis com o meu veículo
  const chamadosParaMim = m.disponivel ? (estado.chamadosAmigo||[]).filter(c=>c.status==='aberto' && c.motorista_solicitante!==m.telefone && c.veiculo_tipo===m.veiculo) : [];
  const meusChamadosAbertos = (estado.chamadosAmigo||[]).filter(c=>c.status==='aberto' && c.motorista_solicitante===m.telefone);
  const ativos = estado.pedidos.filter(p=>!['buscando','entregue','cancelado'].includes(p.status) && p.motoristaTelefone===m.telefone);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const entreguesHojeArr = estado.pedidos.filter(p=>p.status==='entregue' && p.motoristaTelefone===m.telefone && p.atualizadoEm>=hoje.getTime());
  const ganhosHoje = entreguesHojeArr.reduce((s,p)=>s+ganhoMotorista(p.preco),0);
  const entregasMes = entregasDoMesAtual(m.telefone);
  return `
  ${perfilMotoristaHTML(m)}
  ${m.status!=='aprovado' ? `<div class="cartao" style="border:1px solid var(--sol,#e8b23d);background:rgba(232,178,61,0.08)">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <span style="font-size:20px">⏳</span>
      <div style="font-size:13.5px;color:var(--osso);line-height:1.5">
        <b>Cadastro ainda em análise.</b> Já podes conhecer o app e ficar online, mas só vais poder <b>aceitar corridas</b> e <b>fazer saque</b> depois de enviares os documentos e o administrador aprovar o teu cadastro.
      </div>
    </div>
  </div>` : ''}
  <div class="cartao">
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap">
      <div style="display:flex;gap:8px">
        <button class="btn btn-secundario btn-pequeno botao-chat" onclick="abrirSuporte()">💬 Suporte${estado.suporteNaoLidas>0?`<span class="notif-bolinha">${estado.suporteNaoLidas}</span>`:''}</button>
        <button class="btn btn-secundario btn-pequeno" onclick="sairMotorista()">Sair</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:var(--painel-alt);border:1px solid var(--linha);border-radius:12px;padding:14px 16px;flex-wrap:wrap">
      <div>
        <div style="font-size:12.5px;text-transform:uppercase;letter-spacing:0.4px;color:var(--poeira)">Creditado hoje · ${entreguesHojeArr.length} entregas</div>
        <div style="font-family:'Rajdhani';font-weight:700;font-size:27.5px;color:var(--osso);margin-top:2px">R$ ${ganhosHoje.toFixed(2)}</div>
        <div style="font-size:13px;color:var(--poeira);margin-top:4px">Saldo p/ saque: <b style="color:var(--osso)">R$ ${Number(m.saldo||0).toFixed(2)}</b>${planoAtual.limiteMensal!=null?` · ${entregasMes}/${planoAtual.limiteMensal} entregas este mês`:''}</div>
      </div>
      <button class="btn btn-primario btn-pequeno" style="margin-top:0;white-space:nowrap${m.status!=='aprovado'?';opacity:0.6':''}" ${m.status!=='aprovado'?'disabled title="Disponível após aprovação do cadastro"':''} onclick="solicitarSaque()">💰 Saque</button>
    </div>
    <button class="btn ${m.disponivel?'btn-secundario':'btn-verde'}" style="margin-top:14px" ${atributoDesabilitado('alternarDisponibilidade')} onclick="executarComCarregando('alternarDisponibilidade', alternarDisponibilidade)">${carregando('alternarDisponibilidade') ? '<span class="girando"></span>Atualizando...' : (m.disponivel?'🔴 Parar / ficar indisponível':'🟢 Iniciar rota')}</button>
    ${!m.disponivel ? `<div class="cf-ajuda" style="text-align:center;margin-top:6px">👆 Clique aqui para começar a receber pedidos</div>` : ''}
    ${m.plano==='pro' ? raioAtendimentoHTML(m) : ''}
    ${direitosPlanoHTML(planoAtual, m.plano)}
  </div>
  ${chamadosParaMim.length>0 ? `<div class="cartao" style="border:2px solid var(--chama)">
    <h2 style="color:var(--chama)">🆘 Motorista amigo precisa de ajuda urgente</h2>
    ${chamadosParaMim.map(cartaoChamadoAmigo).join('')}
  </div>` : ''}
  ${meusChamadosAbertos.length>0 ? meusChamadosAbertos.map(c=>`
  <div class="cartao" style="border:1px solid var(--mango)">
    <div style="display:flex;align-items:center;gap:8px"><span class="ponto-pulsante" style="background:var(--mango)"></span><b>🆘 Pedido de ajuda enviado — a aguardar outro motorista aceitar...</b></div>
    <div class="subtitulo" style="margin-top:4px">Oferecendo ${c.percentual_solicitante}% pra ti · resto pra quem ajudar</div>
    <button class="btn btn-secundario btn-pequeno" style="margin-top:8px" onclick="cancelarChamadoAmigo('${c.id}')">Cancelar chamado</button>
  </div>`).join('') : ''}
  ${ativos.length>0 ? `<div class="cartao"><h2>Em curso</h2>${ativos.map(cartaoPedidoAtivo).join('')}</div>` : ''}
  <div class="cartao">
    <h2>📦 Minhas entregas</h2>
    <div class="aba-mini">
      <button class="${estado.abaMinhasEntregas==='andamento'?'ativo':''}" onclick="mudarAbaMinhasEntregas('andamento')">Em andamento</button>
      <button class="${estado.abaMinhasEntregas==='concluidas'?'ativo':''}" onclick="mudarAbaMinhasEntregas('concluidas')">Concluídas</button>
      <button class="${estado.abaMinhasEntregas==='canceladas'?'ativo':''}" onclick="mudarAbaMinhasEntregas('canceladas')">Canceladas</button>
    </div>
    ${(() => {
      const meusPedidos = estado.pedidos.filter(p=>p.motoristaTelefone===m.telefone);
      const listaMinhas = estado.abaMinhasEntregas==='andamento' ? ativos
        : estado.abaMinhasEntregas==='concluidas' ? meusPedidos.filter(p=>p.status==='entregue')
        : meusPedidos.filter(p=>p.status==='cancelado');
      if(listaMinhas.length===0){
        const msg = estado.abaMinhasEntregas==='andamento' ? 'Nenhuma entrega em andamento no momento.'
          : estado.abaMinhasEntregas==='concluidas' ? 'Ainda não há entregas concluídas.'
          : 'Nenhuma entrega cancelada.';
        return `<div class="vazio"><span class="emoji-grande">📦</span>${msg}</div>`;
      }
      return estado.abaMinhasEntregas==='andamento' ? listaMinhas.map(cartaoPedidoAtivo).join('') : listaMinhas.map(cartaoEntregaMotoristaHistorico).join('');
    })()}
  </div>
  <div class="cartao">
    <h2>Pedidos disponíveis</h2>
    ${!m.disponivel
      ? `<div class="vazio"><span class="emoji-grande">🛵</span>Toque em "Iniciar rota" para começar a receber pedidos.</div>`
      : disponiveis.length===0
        ? `<div class="vazio"><span class="emoji-grande">🛵</span>Sem pedidos por agora.</div>`
        : disponiveis.map(cartaoPedidoDisponivel).join('')
    }
  </div>
  ${estado.chamadoAmigoModal.aberto ? modalChamadoAmigoHTML() : ''}`;
}

function raioAtendimentoHTML(m){
  const opcoes = [5,10,15,20,30,50];
  return `
  <div style="margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--painel-alt);border:1px solid var(--linha)">
    <div style="font-weight:700;color:var(--osso);font-size:14px">📍 Raio de atendimento (benefício Pro)</div>
    <div style="font-size:12.5px;color:var(--poeira);margin:4px 0 8px">Só recebes pedidos até essa distância de onde estás agora.</div>
    <select id="sel-raio-atendimento" onchange="salvarRaioAtendimento(this.value)" style="width:100%">
      <option value="" ${!m.raioAtendimentoKm?'selected':''}>Sem limite</option>
      ${opcoes.map(km=>`<option value="${km}" ${m.raioAtendimentoKm==km?'selected':''}>Até ${km} km</option>`).join('')}
    </select>
  </div>`;
}

function cartaoChamadoAmigo(c){
  const dist = (ultimaPosicaoMotorista && c.lat!=null && c.lng!=null) ? distanciaKm(ultimaPosicaoMotorista.lat,ultimaPosicaoMotorista.lon,Number(c.lat),Number(c.lng)) : null;
  return `
  <div class="pedido" style="border-color:var(--chama)">
    <div style="font-weight:700;color:var(--osso)">${c.motorista_solicitante_nome||'Um motorista'} precisa de ajuda${dist!=null?` · a ${dist.toFixed(1)} km de ti`:''}</div>
    <div class="subtitulo" style="margin-top:4px">Veículo quebrou / imprevisto. Oferece <b style="color:var(--osso)">${c.percentual_solicitante}%</b> da entrega pra ti, e fica com o resto (${(100-c.percentual_solicitante)}%) se ajudares a terminar a corrida.</div>
    <button class="btn btn-chama btn-pequeno" style="margin-top:10px" ${atributoDesabilitado('ajudarChamado_'+c.id)} onclick="executarComCarregando('ajudarChamado_${c.id}', ()=>ajudarChamadoAmigo('${c.id}'))">${rotuloCarregando('ajudarChamado_'+c.id, '🆘 Ajudar agora', 'A assumir...')}</button>
  </div>`;
}

function modalChamadoAmigoHTML(){
  const cm = estado.chamadoAmigoModal;
  return `
  <div class="modal-fundo" onclick="if(event.target===this) fecharChamadoAmigo()">
    <div class="modal-chat">
      <div class="chat-topo"><h3>🆘 Chamar motorista amigo</h3><button class="chat-fechar" onclick="fecharChamadoAmigo()">&times;</button></div>
      <div style="padding:16px 18px;overflow-y:auto">
        <div class="subtitulo" style="margin-top:0">Se o teu veículo quebrou ou não consegues terminar essa entrega, chama outro motorista da mesma região com o mesmo tipo de veículo. Ele assume a corrida e vocês dividem o pagamento.</div>

        <button class="btn btn-chama" style="margin-top:14px" ${cm.enviando?'disabled':''} onclick="enviarChamadoAmigo()">${cm.enviando?'A enviar...':'🆘 Enviar chamado agora'}</button>
      </div>
    </div>
  </div>`;
}

// ---------- direitos do plano (mostrado assim que o motorista loga) ----------
function direitosPlanoHTML(planoAtual, chave){
  const atrasoSeg = Math.round(ATRASO_PRIORIDADE_PRO_MS/1000);
  const linhas = chave==='pro' ? [
    planoAtual.limiteMensal!=null ? `⚠️ Até ${planoAtual.limiteMensal} entregas por mês` : '✅ Sem limite de entregas por mês',
    `✅ Até ${planoAtual.limiteSimultaneo} corridas ao mesmo tempo`,
    `✅ Até ${planoAtual.limiteCancelamentosDia} cancelamentos por dia`,
    '✅ Vê os pedidos novos na hora, antes de todo mundo',
    planoAtual.saqueDias>0 ? `⚠️ Saque em até ${planoAtual.saqueDias} dias` : '✅ Saque imediato',
    '✅ 📍 Escolhe o raio de atendimento — só recebe pedidos até a distância que quiseres',
    '✅ 🆘 Motorista amigo — se o veículo quebrar, chama outro motorista pra terminar a corrida e dividem o pagamento, sem perder a entrega'
  ] : [
    planoAtual.limiteMensal!=null ? `⚠️ Até ${planoAtual.limiteMensal} entregas por mês` : '✅ Sem limite de entregas por mês',
    `⚠️ Até ${planoAtual.limiteSimultaneo} corridas ao mesmo tempo`,
    `⚠️ Até ${planoAtual.limiteCancelamentosDia} cancelamentos por dia`,
    `⚠️ Vê os pedidos novos ${atrasoSeg}s depois dos motoristas Pro`,
    `⚠️ Saque em até ${planoAtual.saqueDias} dias`
  ];
  return `
  <div style="margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--painel-alt);border:1px solid var(--linha)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <b style="font-size:15px">${chave==='pro'?'⭐ Plano Pro':'🆓 Plano Free'} — o que você pode fazer</b>
      ${chave==='free' ? `<button class="btn btn-secundario btn-pequeno" onclick="abrirComoFunciona('motorista')">Ver vantagens do Pro</button>` : ''}
    </div>
    <div style="margin-top:6px;font-size:14px;color:var(--poeira);line-height:1.7">${linhas.join('<br>')}</div>
  </div>`;
}

// ---------- preserva rolagem e digitação entre re-renderizações (evita "piscar") ----------
function capturarFocoAtivo(){
  const el = document.activeElement;
  if(!el || !el.id || !(el.tagName==='INPUT'||el.tagName==='TEXTAREA')) return null;
  return { id: el.id, value: el.value, selStart: el.selectionStart, selEnd: el.selectionEnd };
}
function restaurarFocoAtivo(foco){
  if(!foco) return;
  const el = document.getElementById(foco.id);
  if(!el || !(el.tagName==='INPUT'||el.tagName==='TEXTAREA')) return;
  if((el.value===''||el.value==null) && foco.value){ el.value = foco.value; }
  el.focus();
  try{ if(typeof foco.selStart==='number') el.setSelectionRange(foco.selStart, foco.selEnd); }catch(e){}
}
// captura o valor de TODOS os campos de texto/senha antes de redesenhar a tela (app.innerHTML=...),
// porque esse redesenho recria os elementos do zero e apagaria o que a pessoa digitou —
// isso é o que causava "login/senha não funciona, como se não tivesse digitado nada".
function capturarValoresInputs(){
  const app = document.getElementById('app');
  if(!app) return null;
  const mapa = {};
  app.querySelectorAll('input[id], textarea[id]').forEach(el=>{
    if(el.value){ mapa[el.id] = el.value; }
  });
  return mapa;
}
function restaurarValoresInputs(mapa){
  if(!mapa) return;
  // sempre restaura o que a pessoa tinha digitado (em vez de só quando o campo fica vazio):
  // vários campos (ex: configurações do admin, cadastro do motorista) só são lidos do DOM
  // na hora de salvar, sem sincronizar cada tecla no estado — se um re-render acontecesse
  // no meio (novo pedido chegando, atualização de outro admin, etc.), o valor digitado
  // "sumia" e voltava pro último valor salvo. Isso garante que digitar nunca se perde.
  Object.keys(mapa).forEach(id=>{
    const el = document.getElementById(id);
    if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA')){
      el.value = mapa[id];
    }
  });
}
function capturarScroll(){
  const adminConteudo = document.querySelector('.admin-conteudo');
  return { janela: window.scrollY, admin: adminConteudo?adminConteudo.scrollTop:null };
}
function restaurarScroll(s){
  if(!s) return;
  window.scrollTo(0, s.janela);
  if(s.admin!=null){ const el = document.querySelector('.admin-conteudo'); if(el) el.scrollTop = s.admin; }
}

// ---------- mantém o progresso do cadastro (cliente/motorista) mesmo se recarregar a página (F5) ----------
function salvarRascunhosCadastro(){
  try{
    if(!estado.motorista.ativo && estado.painelMotorista.tela!=='entrar'){
      const c = estado.painelMotorista.cadastro;
      localStorage.setItem('ef_motorista_rascunho', JSON.stringify({
        tela: estado.painelMotorista.tela,
        etapa: c.etapa, id: c.id, nome: c.nome, telefone: c.telefone, cidade: c.cidade,
        veiculo: c.veiculo, cpf: c.cpf, marca: c.marca, placa: c.placa, cor: c.cor
      }));
    } else if(!estado.motorista.ativo){
      localStorage.removeItem('ef_motorista_rascunho');
    }
    if(!estado.cliente.logado && estado.painelCliente.tela==='cadastro'){
      const cc = estado.painelCliente.cadastro;
      localStorage.setItem('ef_cliente_rascunho', JSON.stringify({ nome: cc.nome, telefone: cc.telefone }));
    } else if(!estado.cliente.logado){
      localStorage.removeItem('ef_cliente_rascunho');
    }
  }catch(e){ /* localStorage indisponível: seguimos sem persistir o rascunho */ }
}
function restaurarRascunhosCadastro(){
  try{
    if(!estado.motorista.ativo){
      const bruto = localStorage.getItem('ef_motorista_rascunho');
      if(bruto){
        const r = JSON.parse(bruto);
        estado.painelMotorista.tela = r.tela||'entrar';
        Object.assign(estado.painelMotorista.cadastro, {
          etapa: r.etapa||1, id: r.id||null, nome: r.nome||'', telefone: r.telefone||'', cidade: r.cidade||'',
          veiculo: r.veiculo||'moto', cpf: r.cpf||'', marca: r.marca||'', placa: r.placa||'', cor: r.cor||''
        });
      }
    }
    if(!estado.cliente.logado){
      const brutoC = localStorage.getItem('ef_cliente_rascunho');
      if(brutoC){
        const rc = JSON.parse(brutoC);
        if(rc.nome || rc.telefone){
          estado.painelCliente.tela='cadastro';

async function hashSenha(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function loginMotorista(){
  const pm = estado.painelMotorista;
  const telefone = document.getElementById('lm-telefone')?.value.trim();
  const senha = document.getElementById('lm-senha')?.value || '';
  if(!telefone||!senha){ pm.loginErro='Preenche telefone e senha.'; render(); return; }
  pm.loginErro='';
  const senhaHash = await hashSenha(senha);
  const { data, error } = await sb.from('entrega_motoristas').select('*').eq('telefone', telefone).maybeSingle();
  if(error){ pm.loginErro='Erro ao consultar o cadastro. Tenta novamente.'; render(); return; }
  if(!data){ pm.loginErro='Não encontrámos cadastro com este telefone. Cadastra-te abaixo.'; render(); return; }
  if(data.senha_hash !== senhaHash){ pm.loginErro='Senha incorreta.'; render(); return; }
  if(data.status==='incompleto'){ pm.loginErro='O seu cadastro ficou incompleto. Cadastra-te novamente.'; render(); return; }
  if(data.status==='liberado'){ pm.tela='liberado'; pm.telefoneLiberado=data.telefone; render(); return; }
  if(data.status==='reprovado'){
    pm.tela='reprovado'; pm.motivoReprovacao=data.motivo_reprovacao||'Não foi indicado um motivo.';
    pm.reenvio = { telefone:data.telefone, senhaHash:senhaHash, veiculoTipo:data.veiculo_tipo||'', cnhUrl:data.cnh_url||null, crlvUrl:data.crlv_url||null, fotoVeiculoFrenteUrl:data.foto_veiculo_url||null, fotoVeiculoTrasUrl:data.foto_veiculo_tras_url||null, fotoMotoristaUrl:data.foto_motorista_url||null, enviando:false };
    render(); return;
  }
  if(data.status==='bloqueado'){ pm.loginErro='O seu cadastro está bloqueado. Fala com o suporte para mais informações.'; render(); return; }
  // basico, pendente ou aprovado — todos entram no painel; aceitar/saque ficam travados até 'aprovado'
  if(STATUS_ACESSO_PAINEL.includes(data.status)){ await entrarNoPainelMotorista(data); return; }
}

async function salvarEtapaCadastro(campos){
  const c = estado.painelMotorista.cadastro;
  const agora = Date.now();
  if(!c.id){ c.id = 'mot'+agora+Math.floor(Math.random()*1000); }
  const base = { id:c.id, criado_em: c.criadoEm||agora, atualizado_em: agora };
  if(c.nome) base.nome = c.nome;
  if(c.cpf) base.cpf = c.cpf;
  if(c.telefone) base.telefone = c.telefone;
  if(c.cidade) base.cidade = c.cidade;
  if(c.senhaHash) base.senha_hash = c.senhaHash;
  const linha = Object.assign(base, campos);
  const { error } = await sb.from('entrega_motoristas').upsert(linha);
  if(error){ console.error(error); mostrarToast('Erro ao gravar o cadastro: '+(error.message||''), 'erro'); return false; }
  c.criadoEm = c.criadoEm || agora;
  return true;
}

function cpfValido(cpf){
  const s = String(cpf||'').replace(/\D/g,'');
  if(s.length!==11) return false;
  if(/^(\d)\1{10}$/.test(s)) return false; // todos os dígitos iguais, ex: 111.111.111-11
  const calcDigito = (base)=>{
    let soma=0, peso=base.length+1;
    for(let i=0;i<base.length;i++){ soma += parseInt(base[i],10)*peso; peso--; }
    const resto = soma % 11;
    return resto<2 ? 0 : 11-resto;
  };
  const d1 = calcDigito(s.slice(0,9));
  if(d1 !== parseInt(s[9],10)) return false;
  const d2 = calcDigito(s.slice(0,10));
  if(d2 !== parseInt(s[10],10)) return false;
  return true;
}

async function avancarEtapa1(){
  const c = estado.painelMotorista.cadastro;
  c.nome = document.getElementById('cm-nome').value.trim();

  c.cidade = document.getElementById('cm-cidade').value.trim();
  c.senha = document.getElementById('cm-senha').value;
  // cadastro básico: só o essencial pra reduzir fricção logo na entrada pelo anúncio —
  // CPF e dados do veículo (marca/placa/cor) ficam pra depois, quando o admin liberar
  if(!c.nome||!c.telefone||!c.cidade||!c.senha){ c.erroEtapa='Preenche todos os campos.'; render(); return; }
  if(c.senha.length<4){ c.erroEtapa='A senha precisa de pelo menos 4 caracteres.'; render(); return; }
  c.erroEtapa=''; c.enviando=true; render();
  const { data: existente } = await sb.from('entrega_motoristas').select('id,status').eq('telefone', c.telefone).maybeSingle();
  if(existente && existente.status!=='incompleto'){
    c.enviando=false; c.erroEtapa='Já existe cadastro com este telefone. Use "Já sou cadastrado" para entrar.';
    render(); return;
  }
  if(existente) c.id = existente.id;
  c.senhaHash = await hashSenha(c.senha);
  // este é o fim do cadastro "básico" — para por aqui de propósito: o motorista já vê a tela
  // do app (sem poder ligar a rota) e só é convidado a completar CPF/veículo/documentos depois
  // que o admin analisa esses dados básicos e libera, reduzindo a fricção logo na entrada
  const ok = await salvarEtapaCadastro({ nome:c.nome, telefone:c.telefone, cidade:c.cidade, senha_hash:c.senhaHash, veiculo_tipo:c.veiculo, status:'basico' });
  c.enviando=false;
  if(ok){ estado.painelMotorista.tela='basico'; } else { c.id=null; c.erroEtapa='Erro ao gravar. Tenta de novo.'; }

async function escolherPlano(chave){
  const c = estado.painelMotorista.cadastro;
  if(c.plano===chave) return;
  c.plano = chave;
  c.pix = { qrCode:null, copiaCola:null, status:'pendente', gerando:false, erro:'' };
  if(pixPollTimer){ clearInterval(pixPollTimer); pixPollTimer=null; }
  const p = PLANOS[chave];
  await salvarEtapaCadastro({ plano:chave, taxa_valor:p.preco, taxa_status: p.preco>0 ? 'pendente' : 'pago' });
  if(chave==='free'){ dispararAnimacaoPlano('free'); return; }
  render();
  if(chave==='pro'){ criarCobrancaPix(); }
}

async function criarCobrancaPix(){
  const c = estado.painelMotorista.cadastro;
  c.pix.gerando=true; c.pix.erro=''; render();
  try{
    const resp = await fetch(`${FUNCOES_URL}/criar-cobranca-pix`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ motoristaId:c.id, valor:PLANOS.pro.preco, nome:c.nome, cpf:c.cpf })
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro){ throw new Error(dados.erro || 'Falha ao gerar cobrança PIX.'); }
    c.pix.qrCode = dados.qrCodeBase64; c.pix.copiaCola = dados.copiaCola; c.pix.gerando=false;
    render();
    iniciarPollingPix();
  }catch(e){
    console.error(e);
    c.pix.gerando=false; c.pix.erro = 'Não consegui gerar a cobrança PIX. Verifique se a chave MP_ACCESS_TOKEN está configurada nas secrets do Supabase e tente novamente.';
    render();
  }
}
function iniciarPollingPix(){
  if(pixPollTimer) clearInterval(pixPollTimer);
  pixPollTimer = setInterval(async ()=>{
    const c = estado.painelMotorista.cadastro;
    if(!c.id || c.pix.status==='pago'){ clearInterval(pixPollTimer); pixPollTimer=null; return; }
    const { data } = await sb.from('entrega_motoristas').select('taxa_status').eq('id', c.id).maybeSingle();
    if(data && data.taxa_status==='pago'){
      c.pix.status='pago'; clearInterval(pixPollTimer); pixPollTimer=null;
      dispararAnimacaoPlano('pro');
    }
  }, 4000);
}
function copiarPix(){
  const c = estado.painelMotorista.cadastro;
  if(!c.pix.copiaCola) return;
  navigator.clipboard.writeText(c.pix.copiaCola).then(()=>mostrarToast('Código PIX copiado!', 'sucesso'));
}

function mudarAbaAdmin(aba){
  estado.admin.aba = aba;
  salvarLocal('ef_admin_aba', aba);
  render();
  if(aba==='pedidos' && estado.admin.todosPedidos.length===0) carregarTodosPedidosAdmin();
  if(aba==='clientes' && estado.admin.clientes.length===0) carregarClientesAdmin();
  if(aba==='feedbacks' && !estado.admin.feedbacksCarregados) carregarFeedbacksAdmin();
}
async function carregarFeedbacksAdmin(){
  estado.admin.carregando=true; render();
  const { data, error } = await sb.from('entrega_feedbacks').select('*').order('criado_em',{ascending:false}).limit(300);
  estado.admin.carregando=false; estado.admin.feedbacksCarregados=true;
  if(error){ console.error(error); mostrarToast('Erro ao carregar sugestões e reclamações.', 'erro'); return; }
  estado.admin.feedbacks = data||[];
  render();
}
async function marcarFeedbackLido(id){
  const { error } = await sb.from('entrega_feedbacks').update({ lido:true }).eq('id', id);
  if(error){ console.error(error); return; }
  const f = (estado.admin.feedbacks||[]).find(x=>x.id===id);
  if(f) f.lido=true;
  render();
}
function definirPapelAvisoGeral(papel){ estado.admin.avisoGeral.papel = papel; render(); }
async function enviarAvisoGeralAdmin(){
  const ag = estado.admin.avisoGeral;
  const texto = (document.getElementById('aviso-geral-mensagem')?.value || ag.mensagem || '').trim();
  if(!texto){ mostrarToast('Escreve a mensagem do aviso antes de enviar.'); return; }
  if(!(await confirmarAcao(`Enviar este aviso para TODOS os ${ag.papel==='motorista'?'motoristas':'clientes'} cadastrados?`))) return;
  ag.enviando=true; render();
  const { data: idAviso, error } = await sb.rpc('entrega_admin_enviar_aviso_geral', { p_senha: estado.admin.senhaDigitada, p_papel: ag.papel, p_mensagem: texto });
  ag.enviando=false;
  if(error){
    console.error(error);
    mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao enviar o aviso: '+(error.message||'tenta de novo'), 'erro');
    render();
    return;
  }
  ag.mensagem='';
  mostrarToast(`Aviso enviado para todos os ${ag.papel==='motorista'?'motoristas':'clientes'}!`, 'sucesso');
  enviarPushServidor(ag.papel, null, '📢 Aviso do Entrega Flash', texto);
  render();
}

async function carregarTodosPedidosAdmin(){
  estado.admin.carregando=true; render();
  const { data, error } = await sb.from('entrega_pedidos').select('*').order('criado_em',{ascending:false}).limit(500);
  estado.admin.carregando=false;
  if(error){ console.error(error); mostrarToast('Erro ao carregar pedidos.', 'erro'); return; }
  estado.admin.todosPedidos = data||[];
  render();
